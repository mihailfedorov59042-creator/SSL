<style>
/* Layout: узкая верхняя панель с двумя разделами; всё остальное — окно выбранного раздела на всю высоту.
   Палитра совпадает с обоими разделами: киноварь для акцента, нейтрали с зелёным оттенком. */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface-2:#E9EBE5; --ink:#1A1D24; --muted:#5A5F68; --line:#D5D8D0; --kinovar:#AE3720;
  --font-ustav:'Ponomar',Georgia,serif;
  --font-ui:'Golos Text','PT Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161B; --surface:#1C1F26; --surface-2:#252930; --ink:#E7E5DF; --muted:#A0A5AD; --line:#31353D; --kinovar:#E2694C; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#14161B; --surface:#1C1F26; --surface-2:#252930; --ink:#E7E5DF; --muted:#A0A5AD; --line:#31353D; --kinovar:#E2694C; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--font-ui);overflow:hidden}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
.brand .ini{font-family:var(--font-ustav);font-size:30px;line-height:1;color:var(--kinovar)}
.brand .nm{font-size:15px;font-weight:600}
.brand .sub{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.seg button{font:inherit;font-size:14.5px;font-weight:500;line-height:1.2;border:0;background:none;color:var(--muted);padding:8px 16px;border-radius:7px;cursor:pointer;white-space:nowrap;min-height:36px}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--kinovar);outline-offset:2px}
.topics{flex:none;display:flex;align-items:center;gap:6px;padding:6px 16px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.topics[hidden]{display:none}
.topics .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px;white-space:nowrap}
.topics button{font:inherit;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:32px}
.topics button:hover{color:var(--ink);border-color:var(--muted)}
.topics button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:640px){.topics .lbl{display:none}}
.stage{position:relative;flex:1;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.stage .wait{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}
@media (max-width:640px){
  .brand .sub{display:none}
  .bar{padding-block:6px}
  .seg{width:100%}
  .seg button{flex:1;padding-inline:8px}
  .brand{display:none}
}
</style>

ht:700;font-size:16.5px;margin-bottom:3px}\n.term dd{margin:0;font-size:15px;line-height:1.5}\n.term .link{font-family:var(--font-ui);font-size:12.5px;color:var(--muted);margin-top:6px;display:inline-block}\ntable.signs{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:15px}\ntable.signs td{padding:7px 12px;border-top:1px solid var(--line);vertical-align:top}\ntable.signs tr:first-child td{border-top:0}\ntable.signs td:first-child{font-family:var(--font-rec);font-size:18px;white-space:nowrap;width:1%}\ntable.signs td:last-child{color:var(--muted)}\n.gl-h{font-size:21px;font-weight:600;margin:30px 0 10px}\n<\/style>\n\n<header class=\"wrap masthead\">\n  <div class=\"eyebrow\">Старославянский язык · лекции 1–2 · фонетика<\/div>\n  <h1><span class=\"ini\">С<\/span>тарославянская фонетика<\/h1>\n  <p class=\"lede\">Пять презентаций, собранных в один маршрут: от трёх праславянских тенденций к звуковой системе старославянского и чередованиям. Каждый этап показывает, из чего он вытекает и к чему ведёт; таблица звуков растёт вместе с маршрутом.<\/p>\n  <p class=\"hint-ch\">Слова, подчёркнутые пунктиром, можно нажать — покажется цепочка от праформы к старославянской форме, например <button class=\"chw\" data-ch=\"облакъ\">облакъ<\/button>.<\/p>\n<\/header>\n\n<nav class=\"tabs\" aria-label=\"Разделы\">\n  <div class=\"wrap tabs-in\" role=\"tablist\" id=\"tabs\">\n    <button class=\"tab\" role=\"tab\" data-tab=\"route\">Маршрут<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"lab\">Лаборатория слова<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"sum\">Сводные таблицы<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"gloss\">Глоссарий и знаки<\/button>\n  <\/div>\n<\/nav>\n\n<main class=\"wrap\">\n  <section class=\"panel\" id=\"p-route\" role=\"tabpanel\">\n    <div class=\"topics-wrap\"><div class=\"topics\" id=\"topics\"><\/div><\/div>\n    <div class=\"stepper\" id=\"stepper\" aria-label=\"Этапы темы\"><\/div>\n    <article class=\"stage\" id=\"stage\"><\/article>\n  <\/section>\n\n  <section class=\"panel\" id=\"p-lab\" role=\"tabpanel\" hidden>\n    <h2>Лаборатория слова<\/h2>\n    <p class=\"panel-intro\">Выбери праформу и проведи её через законы по шагам: на каждом шаге выбери, что происходит. Неверный выбор не засчитывается — можно попробовать снова.<\/p>\n    <div class=\"lab\"><div class=\"lab-list\" id=\"labList\"><\/div><div class=\"lab-work\" id=\"labWork\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"panel\" id=\"p-sum\" role=\"tabpanel\" hidden>\n    <h2>Сводные таблицы<\/h2>\n    <p class=\"panel-intro\">Всё, что раскидано по этапам, — в одном месте. Ссылка у таблицы ведёт к этапу маршрута.<\/p>\n    <div class=\"toc\" id=\"sumToc\"><\/div>\n    <div id=\"sumBody\"><\/div>\n  <\/section>\n\n  <section class=\"panel\" id=\"p-gloss\" role=\"tabpanel\" hidden>\n    <h2>Глоссарий и знаки<\/h2>\n    <p class=\"panel-intro\">Обозначения, сокращения и термины лекций. У термина есть ссылка на этап, где он объясняется.<\/p>\n    <h3 class=\"gl-h\">Знаки<\/h3>\n    <div class=\"tbl-scroll\"><table class=\"signs\" id=\"signs\"><\/table><\/div>\n    <h3 class=\"gl-h\">Сокращения<\/h3>\n    <div class=\"tbl-scroll\"><table class=\"signs\" id=\"abbr\"><\/table><\/div>\n    <h3 class=\"gl-h\">Термины<\/h3>\n    <dl class=\"gloss-grid\" id=\"terms\"><\/dl>\n  <\/section>\n<\/main>\n\n<script>\n/* =========================================================\n   ДАННЫЕ: темы и этапы.\n   Разметка в строках: {…} — старославянская форма, ^…^ — реконструкция, _…_ — русская форма.\n   tend: t1 — количество→качество, t2 — открытый слог, t3 — сингармонизм, r — итог/следствие\n   ========================================================= */\nconst TOPICS = [\n {n:1, title:\"Три тенденции\", sub:\"Исходная точка\", tend:\"r\"},\n {n:2, title:\"Количество → качество\", sub:\"10 гласных → 8\", tend:\"t1\"},\n {n:3, title:\"Закон открытого слога\", sub:\"Дифтонги, j, tort, группы\", tend:\"t2\"},\n {n:4, title:\"Слоговой сингармонизм\", sub:\"Три палатализации\", tend:\"t3\"},\n {n:5, title:\"Итог: звуковая система\", sub:\"Гласные и согласные\", tend:\"r\"},\n {n:6, title:\"Редуцированные\", sub:\"Позиции и падение\", tend:\"r\"},\n {n:7, title:\"Чередования\", sub:\"Следы всех этапов\", tend:\"r\"}\n];\nconst TEND = {t1:\"Тенденция 1 · количество → качество\", t2:\"Тенденция 2 · открытый слог\", t3:\"Тенденция 3 · сингармонизм\", r:\"Итог и следствия\"};\n\nconst STAGES = [\n/* ================= ТЕМА 1 ================= */\n{id:\"tend\", topic:1, tend:\"r\", title:\"Три тенденции праславянского языка\",\n lead:\"Звуки старославянского унаследованы из праславянского и сложились под действием трёх тенденций.\",\n news:[\"три тенденции\",\"исходная система: 10 гласных\"],\n tbl:\"ie\",\n from:[],\n to:[{id:\"qq\",why:\"тенденция 1\"},{id:\"ideal\",why:\"тенденция 2\"},{id:\"pal1\",why:\"тенденция 3\"}],\n body:`<p>Старославянский не создавал звуки заново: они <b>унаследованы из праславянского языка<\/b>. Праславянский, в свою очередь, получил от индоевропейского десять гласных, различавшихся только долготой, и сочетания звуков, которые затем перестроил.<\/p>\n<p>В праславянском действовали три фундаментальные тенденции:<\/p>\n<ol class=\"tends\">\n<li class=\"t1\"><b>Переход количественных различий гласных в качественные.<\/b> Главным становится не долгота, а то, как звук образуется.<\/li>\n<li class=\"t2\"><b>Тенденция к открытости слога<\/b> (= к восходящей звучности). Слог должен оканчиваться гласным, а звуки в нём — идти от менее звучного к более звучному.<\/li>\n<li class=\"t3\"><b>Тенденция к слоговому сингармонизму.<\/b> В пределах слога согласный и гласный уподобляются друг другу по артикуляции.<\/li>\n<\/ol>\n<p>Гласные старославянского возникли в результате действия <b>первых двух<\/b> тенденций. Мягкие согласные — результат второй и третьей.<\/p>\n<details class=\"ex\"><summary>Что такое праславянский и индоевропейский язык?<\/summary><p>Индоевропейский — общий предок славянских, балтийских, германских, романских (через латынь), индоиранских и других языков. Праславянский — общий предок всех славянских языков. Ни тот, ни другой не записаны: их формы восстановлены сравнением языков-потомков. Поэтому реконструированные формы помечают звёздочкой: ^*gordъ^.<\/p><\/details>\n<details class=\"ex\"><summary>«Количественные» и «качественные» различия — в чём разница?<\/summary><p>Количественное различие — по длительности: ĭ и ī отличаются только тем, сколько длится звук. Качественное — по артикуляции: ряд (где поднят язык — спереди или сзади), подъём (насколько высоко), огубленность. После действия первой тенденции бывшие краткий и долгий гласные стали разными по качеству: из ĭ получился {ь}, из ī — {и}.<\/p><\/details>\n<details class=\"ex\"><summary>Все три тенденции на примерах<\/summary><p><b>1.<\/b> ŭ и ū различались долготой, а стали разными звуками {ъ} и {ы}: {тъкнѫти} — {тыкати}.<br><b>2.<\/b> В ^*gordъ^ слог ^*gor-^ закрыт (кончается на r). Его «открыли» — ст.-сл. {градъ}.<br><b>3.<\/b> В слоге ^ke^ задний согласный k стоит перед гласным переднего ряда e; согласный сдвигается вперёд и становится шипящим: {рекѫ} — {речетъ}.<\/p><\/details>`,\n ru:[[\"{градъ}\",\"_город_\",\"обе формы — ответ на закрытый слог ^*gor-^; ветви славянских языков открыли его по-разному\"]],\n tasks:[\n  {q:\"Какая тенденция объясняет переход ŭ > {ъ}?\", o:[\"переход количественных различий в качественные\",\"тенденция к открытости слога\",\"слоговой сингармонизм\",\"ни одна из трёх\"], a:0, e:\"ŭ и ū различались только долготой; ŭ стал кратким {ъ}, ū — {ы}. Количественное различие стало качественным.\"},\n  {q:\"Дифтонг ^oi̯^ перед согласным стал {ѣ}. Какая тенденция?\", o:[\"тенденция к открытости слога\",\"переход количества в качество\",\"слоговой сингармонизм\",\"ни одна из трёх\"], a:0, e:\"Неслоговой i̯ закрывал слог; слияние дифтонга в один гласный — способ открыть слог.\"},\n  {q:\"к > ч перед гласным переднего ряда ({рекѫ} — {речетъ}). Какая тенденция?\", o:[\"слоговой сингармонизм\",\"тенденция к открытости слога\",\"переход количества в качество\",\"ни одна из трёх\"], a:0, e:\"В слоге ^ke^ согласный уподобился гласному переднего ряда — это сингармонизм.\"},\n  {q:\"Почему праславянские формы пишут со звёздочкой?\", o:[\"они восстановлены сравнением языков, а не записаны\",\"звёздочка обозначает ударение\",\"так отмечают церковные слова\",\"так отмечают долгие гласные\"], a:0, e:\"Звёздочка — знак реконструкции: такая форма не засвидетельствована в текстах.\"}\n ]},\n\n/* ================= ТЕМА 2 ================= */\n{id:\"qq\", topic:2, tend:\"t1\", title:\"Десять индоевропейских гласных → восемь праславянских\",\n lead:\"Пары кратких и долгих гласных превратились в звуки, разные по качеству.\",\n news:[\"ĕ > е, ē > ѣ\",\"ĭ > ь, ī > и\",\"ŭ > ъ, ū > ы\",\"ă, ŏ > о; ā, ō > а\"],\n tbl:\"v\", v:{\"е\":[\"ĕ\"],\"ѣ\":[\"ē\"],\"ь\":[\"ĭ\"],\"и\":[\"ī\"],\"о\":[\"ŏ\",\"ă\"],\"а\":[\"ā\",\"ō\"],\"ъ\":[\"ŭ\"],\"ы\":[\"ū\"]},\n from:[{id:\"tend\",why:\"действие тенденции 1\"}],\n to:[{id:\"diph\",why:\"новые монофтонги встраиваются в эту систему\"},{id:\"tort\",why:\"удлинённые ē, ō дадут ѣ и а\"},{id:\"pos\",why:\"ъ и ь — бывшие ŭ и ĭ\"},{id:\"row\",why:\"ряд е || о || ѣ || а || ь || и — те же соответствия\"}],\n body:`<p>Праславянский унаследовал из индоевропейского <b>пять гласных, различавшихся количеством<\/b>: ĭ – ī, ĕ – ē, ŭ – ū, ă – ā, ŏ – ō. С началом действия первой тенденции количественные различия преобразовались в качественные:<\/p>\n<div data-w=\"merge\"><\/div>\n<ul>\n<li>ĕ сохранился как {е}, ē перешёл в {ѣ};<\/li>\n<li>ĭ изменился в {ь}, ī сохранился как {и};<\/li>\n<li>ŭ перешёл в {ъ}, ū — в {ы};<\/li>\n<li>ă и ŏ совпали в гласном {о}; ā и ō — в гласном {а}.<\/li>\n<\/ul>\n<p>Так из пяти пар получилось <b>восемь фонем<\/b>, различавшихся и количественно, и артикуляторно.<\/p>\n<h4>Где это видно<\/h4>\n<p><b>Сравнение с латынью<\/b>, где долгота сохранилась: {вьдова} — vĭdua, {мати} — māter, {овьца} — ŏvis, {отьць} — ătta.<\/p>\n<p><b>Чередования в глагольных корнях<\/b>, где чередуются древние краткие и долгие: {жьдати} — {ожидати}, {тъкнѫти} — {тыкати}, {родити} — {раждати}.<\/p>\n<details class=\"ex\"><summary>Почему из десяти получилось восемь, а не десять?<\/summary><p>Две пары слились: краткие ă и ŏ дали один звук {о}, долгие ā и ō — один звук {а}. Поэтому по славянскому {о} нельзя сказать, было ли в индоевропейском a или o: {овьца} — лат. ŏvis (o), но {отьць} — лат. ătta (a).<\/p><\/details>\n<details class=\"ex\"><summary>Как по латинскому слову найти славянский гласный<\/summary><p>Смотрите на знак над латинским гласным: краткость ˘ или долгота ¯. Затем примените таблицу: māter — ā > {а}: {мати}; vĭdua — ĭ > {ь}: {вьдова}. Проверьте по русскому: ь здесь в слабой позиции и позже исчез — _вдова_.<\/p><\/details>\n<details class=\"ex\"><summary>Откуда {ъ} и {ь} и почему их называют редуцированными<\/summary><p>Это бывшие краткие высокие гласные ŭ и ĭ. В праславянском они стали ещё короче остальных — «неполного образования». Их судьба (сильная и слабая позиция, падение) — тема 6.<\/p><\/details>`,\n ru:[[\"{мати}\",\"_мать_\",\"ā > а\"],[\"{вьдова}\",\"_вдова_\",\"ĭ > ь; позже ь в слабой позиции исчез\"],[\"{жьдати} — {ожидати}\",\"_ждать — ожидать_\",\"древнее ĭ || ī сохранилось и в русском\"],[\"{тъкнѫти} — {тыкати}\",\"_ткнуть — тыкать_\",\"ŭ || ū\"]],\n tasks:[\n  {q:\"Во что перешёл индоевропейский ē?\", o:[\"{ѣ}\",\"{е}\",\"{и}\",\"{а}\"], a:0, e:\"ē > {ѣ}: долгий е стал отдельным звуком — ятем.\"},\n  {q:\"Латинскому ŏvĭs соответствует {овьца}. Какие соответствия здесь видны?\", o:[\"ŏ > о, ĭ > ь\",\"ŏ > а, ĭ > и\",\"ō > о, ī > ь\",\"ŏ > о, ī > и\"], a:0, e:\"Краткий ŏ дал {о}, краткий ĭ — {ь}.\"},\n  {q:\"Какое древнее чередование показывает пара {жьдати} — {ожидати}?\", o:[\"ĭ || ī (ь || и)\",\"ŭ || ū (ъ || ы)\",\"ĕ || ē (е || ѣ)\",\"ŏ || ō (о || а)\"], a:0, e:\"{ь} < ĭ, {и} < ī: краткая и долгая ступень одного корня.\"},\n  {q:\"Почему по славянскому {о} нельзя определить, был ли в индоевропейском a или o?\", o:[\"ă и ŏ совпали в о\",\"о всегда из долгого ō\",\"о всегда из a\",\"о возникло из дифтонга\"], a:0, e:\"Краткие ă и ŏ слились: {отьць} — ătta, {овьца} — ŏvis.\"}\n ]},\n\n/* ================= ТЕМА 3 ================= */\n{id:\"ideal\", topic:3, tend:\"t2\", title:\"Идеальный слог и восходящая звучность\",\n lead:\"Образцом стал слог по модели ta: согласный в начале, гласный в конце, звучность растёт.\",\n news:[\"модель ta\",\"шкала звучности\",\"три следствия закона\"],\n tbl:\"sonor\",\n from:[{id:\"tend\",why:\"тенденция 2\"}],\n to:[{id:\"diph\",why:\"i̯, u̯ после гласного\"},{id:\"nas\",why:\"m, n после гласного\"},{id:\"jot\",why:\"согласный + j\"},{id:\"tort\",why:\"r, l после гласного\"},{id:\"groups\",why:\"скопления согласных\"},{id:\"prot\",why:\"слог без согласного в начале\"},{id:\"fall\",why:\"падение редуцированных отменит закон\"}],\n body:`<p>В праславянский период действовал <b>закон открытого слога<\/b>. Моделью для организации слогов стал открытый слог <b>ta<\/b> — так называемый <b>идеальный слог<\/b>: оба элемента, согласный и гласный, находятся в сильных позициях, то есть минимально зависят от соседних звуков и от места в фонетическом слове.<\/p>\n<p>В слоге ta 1) согласный и гласный имеют артикуляторный и позиционный контраст; 2) реализуется <b>принцип восходящей звучности<\/b>.<\/p>\n<div data-w=\"sonor\"><\/div>\n<h4>Причины и следствия закона<\/h4>\n<ol>\n<li>первичный импульс — разграничение и противопоставление гласных и согласных фонем;<\/li>\n<li>следствие — позиционное противопоставление: согласный — первый элемент слога, гласный — второй;<\/li>\n<li>на этой основе они сближаются в пределах слога как взаимодополняющие элементы;<\/li>\n<li>слоги обособляются в пределах фонетического слова («суверенизация слога»).<\/li>\n<\/ol>\n<p>Закон восходящей звучности оставался ведущим принципом строения слога в славянских языках <b>до XI–XIV вв.<\/b> — до падения редуцированных.<\/p>\n<h4>Три следствия для звуков<\/h4>\n<ol>\n<li>Если после гласного в конце слога стояли сонанты m, n, i̯, u̯, происходила <b>монофтонгизация<\/b>: возникли пять дополнительных гласных {ѣ, и, у, ѧ, ѫ}.<\/li>\n<li>Скопление гласных на стыке слогов (<b>зияние<\/b>) устранялось.<\/li>\n<li>Скопление согласных после гласного в середине слова либо <b>отходило к следующему слогу<\/b>, либо <b>отпадало<\/b>.<\/li>\n<\/ol>\n<details class=\"ex\"><summary>Что такое звучность и почему она должна «восходить»?<\/summary><p>Звучность — доля голоса по сравнению с шумом. Меньше всего её у щелевых {с, з}, больше — у взрывных, ещё больше — у сонорных {р, л, н, м} и {в}, больше всего — у гласных. В слоге звуки идут от менее звучного к более звучному, а вершина — гласный — стоит в конце. Слог ^stra^ правильный (с → т → р → а), а ^*gor^ — нет: после вершины о стоит ещё r.<\/p><\/details>\n<details class=\"ex\"><summary>Почему {в} стоит в одной группе с сонорными?<\/summary><p>В группах согласных праславянского {в} ведёт себя как {р, л, н, м}: стоит после взрывных ({дъва}, {твьрдъ}) и щелевых ({свѣтъ}). Поэтому в лекции он отнесён к третьей группе.<\/p><\/details>\n<details class=\"ex\"><summary>Как проверить слово по закону — пошагово<\/summary><p>1. Разделите слово так, чтобы каждый слог кончался гласным: {се-стра}. 2. В каждом слоге проверьте согласные перед гласным: звучность должна расти (с 1 → т 2 → р 3). 3. Если слог закрыт или звучность падает, праславянский должен был это исправить. Как именно — следующие этапы темы.<\/p><\/details>`,\n ru:[[\"{сестра}\",\"_сестра_\",\"группа стр: с (1) → т (2) → р (3) — звучность растёт, группа сохраняется\"]],\n tasks:[\n  {q:\"Какой слог соответствует модели идеального слога?\", o:[\"ta\",\"at\",\"tar\",\"ast\"], a:0, e:\"Идеальный слог — согласный + гласный, открытый: ta.\"},\n  {q:\"Какая последовательность соответствует восходящей звучности?\", o:[\"с → т → р → а\",\"р → т → с → а\",\"т → с → а → р\",\"а → р → т → с\"], a:0, e:\"Щелевой (1) → взрывной (2) → сонорный (3) → гласный.\"},\n  {q:\"Какая группа удовлетворяет восходящей звучности?\", o:[\"ст\",\"тс\",\"рт\",\"нд\"], a:0, e:\"с (1) → т (2): звучность растёт. В остальных она падает.\"},\n  {q:\"До какого времени закон восходящей звучности оставался ведущим принципом?\", o:[\"до XI–XIV вв., падения редуцированных\",\"до IX в., создания азбуки\",\"до VIII в.\",\"действует до сих пор\"], a:0, e:\"Так в лекции: до падения редуцированных (XI–XIV вв.).\"}\n ]},\n\n{id:\"diph\", topic:3, tend:\"t2\", title:\"Дифтонги → ѣ, и, у\",\n lead:\"Неслоговые i̯ и u̯ закрывали слог: дифтонги распадались или становились одним гласным.\",\n news:[\"ѣ из ai̯, oi̯\",\"и из ei̯, oi̯\",\"у из au̯, ou̯\",\"ю из eu̯\"],\n tbl:\"v\", v:{\"ѣ\":[\"ai̯\",\"oi̯\"],\"и\":[\"ei̯\",\"oi̯ (нисх. интонация)\"],\"у\":[\"au̯\",\"ou̯\",\"eu̯ > ю\"]},\n from:[{id:\"ideal\",why:\"i̯, u̯ закрывали слог\"},{id:\"qq\",why:\"новые гласные совпали с уже существующими ѣ, и\"}],\n to:[{id:\"pal2\",why:\"новые ѣ, и вызвали вторую палатализацию\"},{id:\"diphalt\",why:\"пити — пьѭ, ковати — кѹѭ\"},{id:\"sysv\",why:\"вклад в систему гласных\"}],\n body:`<p><b>Дифтонг<\/b> — сочетание двух гласных в одном слоге; один из них неслоговой, близкий к согласному. Из индоевропейского унаследованы дифтонги ^ai̯, oi̯, ei̯^ (i̯ было близко к j) и ^au̯, ou̯, eu̯^ (u̯ было близко к v).<\/p>\n<p>Дифтонги нарушали закон открытого слога и преобразовались двумя способами:<\/p>\n<ul>\n<li><b>перед гласным<\/b> — распадались на два звука: ^ai̯ > a + j^; неслоговой элемент уходил в следующий слог;<\/li>\n<li><b>на конце слова и перед согласным<\/b> — переходили в один гласный (<b>монофтонгизация<\/b>).<\/li>\n<\/ul>\n<table class=\"rules\"><tr><td>^ai̯, oi̯^<\/td><td>><\/td><td>{ѣ}<\/td><\/tr><tr><td>^oi̯^ (при нисходящей интонации)<\/td><td>><\/td><td>{и}<\/td><\/tr><tr><td>^ei̯^<\/td><td>><\/td><td>{и}<\/td><\/tr><tr><td>^au̯, ou̯^<\/td><td>><\/td><td>{у}<\/td><\/tr><tr><td>^eu̯^<\/td><td>><\/td><td>{ю} (ju)<\/td><\/tr><\/table>\n<p>Результаты видны в чередованиях: {пѣти} — {поѭ} (ѣ < oi̯: ^*poi̯ti^), {бити} — {бьѭ} (и < ei̯: ^*bei̯ti^), {ковати} — {кѹѭ} (у < ou̯: ^*kou̯jǫ^).<\/p>\n<div data-w=\"syl\"><\/div>\n<details class=\"ex\"><summary>Почему у одного корня то ѣ, то оj?<\/summary><p>Всё решает граница слога. В ^*poi̯-ti^ после дифтонга стоит согласный, i̯ остаётся в первом слоге и закрывает его — дифтонг сливается в {ѣ}: {пѣти}. В ^*po-i̯ǫ^ после дифтонга гласный, i̯ уходит в следующий слог и становится j: {по-ѭ}. Корень один, позиция разная — и результат разный. Русский сохранил это: _петь — пою_.<\/p><\/details>\n<details class=\"ex\"><summary>Что значит «oi̯ > и при нисходящей интонации»?<\/summary><p>Обычно oi̯ давал {ѣ}. Но в части окончаний получался {и} — например, в им. п. мн. ч. основ на ^-o^: ^*duchoi̯^ > {дуси}, ^*raboi̯^ > {раби}. Интонацию (тип слогового тона) восстанавливают по другим языкам; для экзамена достаточно знать оба результата и пример.<\/p><\/details>\n<details class=\"ex\"><summary>Откуда в {в} в {ковати}?<\/summary><p>^*kou̯-ati^: после дифтонга гласный, u̯ уходит в следующий слог и становится {в}: {ко-ва-ти}. В ^*kou̯-jǫ^ после дифтонга согласный j — дифтонг остаётся в слоге и даёт {у}: {кѹ-ѭ}.<\/p><\/details>`,\n ru:[[\"{пѣти} — {поѭ}\",\"_петь — пою_\",\"oi̯ перед согласным > ѣ (рус. е); перед гласным > оj\"],[\"{бити} — {бьѭ}\",\"_бить — бью_\",\"ei̯ > и; перед гласным > ьj\"],[\"{ковати} — {кѹѭ}\",\"_ковать — кую_\",\"ou̯ перед гласным > ов; перед согласным > у\"]],\n tasks:[\n  {q:\"^*bei̯ti^ > ?\", o:[\"{бити}\",\"{бѣти}\",\"{бути}\",\"{бьти}\"], a:0, e:\"ei̯ перед согласным > {и}.\"},\n  {q:\"Почему в {поѭ} нет ѣ, хотя корень тот же, что в {пѣти}?\", o:[\"i̯ перед гласным ушёл в следующий слог и стал j\",\"ѣ выпал под ударением\",\"это другой корень\",\"ѣ перешёл в о\"], a:0, e:\"^*po-i̯ǫ^: слог по- уже открыт, дифтонг не сливается.\"},\n  {q:\"Из какого дифтонга {у} в {кѹѭ}?\", o:[\"ou̯\",\"oi̯\",\"ei̯\",\"ai̯\"], a:0, e:\"^*kou̯jǫ^: ou̯ перед согласным j > {у}.\"},\n  {q:\"Какой результат дал eu̯?\", o:[\"{ю} (ju)\",\"{у}\",\"{и}\",\"{ѣ}\"], a:0, e:\"eu̯ > {ю}: j + u.\"}\n ]},\n\n{id:\"nas\", topic:3, tend:\"t2\", title:\"Дифтонгические сочетания → ѧ, ѫ\",\n lead:\"Гласный + m или n в одном слоге слились в носовой гласный.\",\n news:[\"ѧ из en, em, in, im\",\"ѫ из an, am, on, om, un, um\"],\n tbl:\"v\", v:{\"ѧ\":[\"en\",\"em\",\"in\",\"im\"],\"ѫ\":[\"an\",\"am\",\"on\",\"om\",\"un\",\"um\"]},\n from:[{id:\"ideal\",why:\"m, n закрывали слог\"}],\n to:[{id:\"jatyus\",why:\"судьба юсов в славянских языках\"},{id:\"diphalt\",why:\"ѧ || ен, ѫ || он\"},{id:\"pal3\",why:\"ѧ — одно из условий третьей палатализации\"}],\n body:`<p><b>Дифтонгические сочетания<\/b> — сочетания гласного с носовым согласным m или n, входившим в тот же слог. Они преобразовались так же, как дифтонги:<\/p>\n<ul>\n<li><b>перед гласным<\/b> сочетание распадалось: носовой согласный уходил в следующий слог;<\/li>\n<li><b>перед согласным и на конце слова<\/b> — монофтонгизация: возникал носовой гласный.<\/li>\n<\/ul>\n<table class=\"rules\"><tr><td>^en, em, in, im^<\/td><td>><\/td><td>ę {ѧ}<\/td><\/tr><tr><td>^an, am, on, om, un, um^<\/td><td>><\/td><td>ǫ {ѫ}<\/td><\/tr><\/table>\n<p>Чередования: {сѣмѧ} — {сѣмена} (ѧ из en), {распьнѫ} — {распѧти} (ѧ из in), {звонъ} — {звѫкъ} (ѫ из on), {дымъ} — {дѫти} (ѫ из um).<\/p>\n<details class=\"ex\"><summary>Как запомнить, где ѧ, а где ѫ<\/summary><p>Смотрите на гласный в сочетании. Гласные переднего ряда (e, i) дают передний носовой {ѧ} — юс малый. Гласные непереднего ряда (a, o, u) дают задний носовой {ѫ} — юс большой.<\/p><\/details>\n<details class=\"ex\"><summary>Почему {сѣмѧ}, но {сѣмене}?<\/summary><p>В ^*sēmen^ сочетание en на конце слова — слог закрыт, получается {ѧ}. В родительном падеже ^*sē-me-ne^ после e идёт гласный, n уходит в следующий слог, сочетание сохраняется. Русский сохранил это чередование: _семя — семени, имя — имени, время — времени_.<\/p><\/details>\n<details class=\"ex\"><summary>Откуда {дѫти}, если в {дымъ} нет носового?<\/summary><p>В ^*dum-ti^ сочетание um стоит перед согласным и даёт {ѫ}: {дѫти} (рус. _дуть_). В {дымъ} m относится к следующему слогу, сочетания нет, а долгий ū дал {ы} по правилу темы 2.<\/p><\/details>`,\n ru:[[\"{пѧть}\",\"_пять_\",\"ѧ > я у восточных славян\"],[\"{рѫка}\",\"_рука_\",\"ѫ > у\"],[\"{сѣмѧ} — {сѣмене}\",\"_семя — семени_\",\"ѧ на конце || ен перед гласным\"],[\"{звѫкъ} — {звонъ}\",\"_звук — звон_\",\"ѫ перед согласным || он перед гласным\"]],\n tasks:[\n  {q:\"Сочетание ^in^ перед согласным даёт:\", o:[\"{ѧ}\",\"{ѫ}\",\"{ин}\",\"{и}\"], a:0, e:\"Гласный переднего ряда + n > {ѧ}.\"},\n  {q:\"Почему в {сѣмене} нет носового гласного?\", o:[\"n отошёл к следующему слогу\",\"носовой выпал в косвенных падежах\",\"это другой корень\",\"сработала палатализация\"], a:0, e:\"^*sē-me-ne^: сочетание en не в одном слоге.\"},\n  {q:\"Из какого сочетания {ѫ} в {дѫти}?\", o:[\"um\",\"en\",\"in\",\"ai̯\"], a:0, e:\"^*dum-ti^: u + m перед согласным > {ѫ}.\"},\n  {q:\"Какой юс дают гласные непереднего ряда в сочетании с m, n?\", o:[\"{ѫ} — юс большой\",\"{ѧ} — юс малый\",\"оба\",\"никакой\"], a:0, e:\"a, o, u + m/n > {ѫ}.\"}\n ]},\n\n{id:\"jot\", topic:3, tend:\"t2\", title:\"Сочетания с j → мягкие согласные\",\n lead:\"Согласный перед j уходил в следующий слог и сливался с j в один мягкий звук.\",\n news:[\"ч’, ж’, ш’\",\"шт’, жд’\",\"р’, л’, н’\",\"эпентетический л’\"],\n tbl:\"c\", c:{\"ч\":[\"kj\"],\"ж\":[\"gj\",\"zj\"],\"ш\":[\"chj\",\"sj\"],\"шт\":[\"tj\",\"stj\",\"skj\"],\"жд\":[\"dj\",\"zdj\",\"zgj\"],\"р’\":[\"rj\"],\"л’\":[\"lj\",\"губной + j (эпентеза)\"],\"н’\":[\"nj\"]},\n from:[{id:\"ideal\",why:\"согласный уходит к следующему слогу\"}],\n to:[{id:\"sysc\",why:\"новые мягкие согласные\"},{id:\"consalt\",why:\"с // ш, т // шт, д // жд, б // бл’\"},{id:\"pal1\",why:\"те же ч, ж, ш даст и первая палатализация\"}],\n body:`<p>В результате сочетания с <b>j<\/b> в праславянский период образовались новые мягкие согласные. Изменение вызвано тенденцией к открытому слогу: из двух согласных образовывался один, который под влиянием j смещался в палатальную зону, то есть становился мягким: ^*plak-jǫ^ > ^*pla-kjǫ^ > {плачѫ}.<\/p>\n<table class=\"rules wide\">\n<tr><td>1<\/td><td>kj > č’, gj > ž’, chj > š’<\/td><td>{плакати} — {плачѫ} (^*pla-kjǫ < *plak-jǫ^), {лъгати} — {лъжа}, {духъ} — {душа} (^*duchja^)<\/td><\/tr>\n<tr><td>2<\/td><td>sj > š’, zj > ž’<\/td><td>{носити} — {ношѫ} (^*nosjǫ^), {ноша}, {ножь} (^*nozjь < *noz-j-ŏ-s^), {казати} — {кажѫ}<\/td><\/tr>\n<tr><td>3<\/td><td>tj > št’, dj > žd’<\/td><td>{хотѣти} — {хоштѫ} (^*chotjǫ^), {ходити} — {хождѫ} (^*chodjǫ^), {свѣшта} (^*světja^)<\/td><\/tr>\n<tr><td>4<\/td><td>stj > št’, zdj > žd’<\/td><td>{мьстити} — {мьштениѥ}, {пригвоздити} — {пригвожденъ}<\/td><\/tr>\n<tr><td>5<\/td><td>skj > št’, zgj > žd’<\/td><td>{искати} — {иштѫ} (^*iskjǫ^), {розга} — {рождиѥ} ‘ветви’<\/td><\/tr>\n<tr><td>6<\/td><td>rj > r’, lj > l’, nj > n’<\/td><td>{велѣти} — {велѭ}, {чинити} — {чинѭ}, {вечеръ} — {вечерꙗ}<\/td><\/tr>\n<tr><td>7<\/td><td>pj > pl’, bj > bl’, mj > ml’, vj > vl’<\/td><td>{любити} — {люблѭ}, {ловити} — {ловлѭ}, {капати} — {каплꙗ} (^*kapja^), {земьныи} — {землꙗ} (^*zemja^)<\/td><\/tr>\n<\/table>\n<p><b>Группа 3 у других славян раскрывалась иначе.<\/b> У восточных: tj > ч’, dj > ж’ (_хочю, хожю, свѣча_). У западных: tj > c’, dj > dz’ (польск. _świeca, miedza_).<\/p>\n<details class=\"ex\"><summary>Как закон открытого слога производит мягкие согласные<\/summary><p>В ^*plak-jǫ^ первый слог закрыт. Чтобы его открыть, k переходит в следующий слог: ^*pla-kjǫ^. Сочетание kj в начале слога сливается в один звук, а j делает его мягким — {ч}. Так тенденция 2 создаёт новые фонемы.<\/p><\/details>\n<details class=\"ex\"><summary>Откуда {л} в {люблѭ} и {землꙗ}?<\/summary><p>Губные п, б, м, в не могли слиться с j в один мягкий звук. Между губным и j развился мягкий л’ — <b>эпентетический<\/b> (вставной): ^*ljubjǫ^ > {люблѭ}, ^*zemja^ > {землꙗ}. В русском он тоже есть: _люблю, ловлю, земля, капля_.<\/p><\/details>\n<details class=\"ex\"><summary>Как найти старославянизм в русском по шт/жд<\/summary><p>Если в русском щ или жд стоит там, где в исконном слове ч или ж, — слово пришло из старославянского: _освещение_ — _свеча_, _хождение_ — _хожу_, _одежда_ — _одёжа_, _рождение_ — _рожать_, _невежда_ — _невежа_.<\/p><\/details>`,\n ru:[[\"{свѣшта}\",\"_свеча_ / _освещение_\",\"tj > шт (ст.-сл.), ч (вост.-сл.)\"],[\"{хождѫ}\",\"_хожу_ / _хождение_\",\"dj > жд (ст.-сл.), ж (вост.-сл.)\"],[\"{ношѫ}\",\"_ношу_\",\"sj > ш’ — одинаково\"],[\"{люблѭ}\",\"_люблю_\",\"эпентетический л’\"]],\n tasks:[\n  {q:\"^*chodjǫ^ > ?\", o:[\"{хождѫ}\",\"{хожѫ}\",\"{ходѫ}\",\"{хоѕѫ}\"], a:0, e:\"dj > жд’ у южных славян. У восточных было бы ж’: _хожу_.\"},\n  {q:\"Какое русское слово пришло из старославянского?\", o:[\"_освещение_\",\"_свеча_\",\"_хожу_\",\"_одёжа_\"], a:0, e:\"щ на месте ч (_свеча_) — след ст.-сл. шт < tj.\"},\n  {q:\"Почему в {землꙗ} появился л?\", o:[\"губной м не сливается с j, развился эпентетический л’\",\"л был в корне\",\"это след палатализации\",\"так писали только в глаголице\"], a:0, e:\"^*zemja^: mj > ml’.\"},\n  {q:\"sj > ?\", o:[\"ш’\",\"шт’\",\"с’\",\"ч’\"], a:0, e:\"{носити} — {ношѫ}.\"}\n ]},\n\n{id:\"tort\", topic:3, tend:\"t2\", title:\"Сочетания tort, tolt, tert, telt → неполногласие\",\n lead:\"Гласный + плавный между согласными: южные славяне переставили их и удлинили гласный.\",\n news:[\"ра, ла < or, ol\",\"рѣ, лѣ < er, el\",\"у восточных — полногласие\"],\n tbl:\"v\", v:{\"ѣ\":[\"ē при метатезе er, el\"],\"а\":[\"ō при метатезе or, ol\"]},\n from:[{id:\"ideal\",why:\"сочетание закрывало слог\"},{id:\"qq\",why:\"удлинённые ē, ō > ѣ, а\"}],\n to:[{id:\"ort\",why:\"тот же механизм в начале слова\"},{id:\"diphalt\",why:\"рѣ || ра || ор: {стрѣгѫ} — {стража}\"}],\n body:`<p>Дифтонгические сочетания <b>*er, *or, *el, *ol<\/b> между согласными (условно tert, tort, telt, tolt), унаследованные из индоевропейского, не могли сохраниться из-за закона открытого слога. Их преобразование относится к <b>VIII–IX вв.<\/b>, когда славянское единство уже разрушалось, поэтому в разных языках оно шло по-разному. Пример — имя Карла Великого: ст.-сл. {краль}, чеш. _král_, рус. _король_, польск. _król_.<\/p>\n<p>У южных славян (на основе одного из их диалектов сложился старославянский), а также у чехов и словаков произошла <b>метатеза<\/b> — перестановка гласного и плавного, — сопровождаемая <b>удлинением гласного<\/b>. У восточных славян возникло <b>полногласие<\/b>.<\/p>\n<div data-w=\"tort\"><\/div>\n<h4>Примеры<\/h4>\n<ul>\n<li>{градъ} — _городъ_ из ^*gord-^: юж.-сл. ^*gordъ > *gōrdъ > *gardъ > *gradъ^; вост.-сл. ^*gordъ > *gorᵒdъ > *gorodъ^<\/li>\n<li>{брѣгъ} — _берегъ_ из ^*berg-^: юж.-сл. ^*bergъ > *bērgъ > *bѣrgъ > *brѣgъ^; вост.-сл. ^*bergъ > *berᵉgъ > *beregъ^<\/li>\n<li>{гласъ} — _голосъ_ из ^*gols-^: юж.-сл. ^*golsъ > *gōlsъ > *galsъ > *glasъ^; вост.-сл. ^*golsъ > *golᵒsъ > *golosъ^<\/li>\n<li>{млѣко} — _молоко_ из ^*melko^: юж.-сл. ^*melko > *mēlko > *mѣlko > *mlѣko^; вост.-сл. ^*melko > *molko > *molᵒko > *moloko^<\/li>\n<\/ul>\n<details class=\"ex\"><summary>Почему в результате {ѣ} и {а}, а не е и о?<\/summary><p>Потому что гласный удлинился. А долгие гласные в праславянском давали ē > {ѣ}, ō > {а} — это правило темы 2. Отсюда {рѣ, лѣ} из er, el и {ра, ла} из or, ol. Результат этого этапа предсказан этапом «Количество → качество».<\/p><\/details>\n<details class=\"ex\"><summary>Почему _молоко_, а не *мелеко?<\/summary><p>У восточных славян в сочетании telt гласный e перед l сначала перешёл в o: ^*melko > *molko^, а затем развился второй гласный: _молоко_. Поэтому с р полногласие бывает -ере- (_берег_), а с л — только -оло- (_молоко, шелом_).<\/p><\/details>\n<details class=\"ex\"><summary>Как найти неполногласие в русском<\/summary><p>Ищите пары: ра, ла, ре, ле между согласными — старославянское; оро, оло, ере — исконно русское. _Град — город, глас — голос, брег — берег, млечный — молоко, враг — ворог, страна — сторона, хранить — хоронить, шлем — шелом, среда — середина_. Неполногласные слова в русском — старославянизмы.<\/p><\/details>`,\n ru:[[\"{градъ}\",\"_город_\",\"or > ра / оро\"],[\"{брѣгъ}\",\"_берег_\",\"er > рѣ / ере\"],[\"{гласъ}\",\"_голос_\",\"ol > ла / оло\"],[\"{млѣко}\",\"_молоко_\",\"el > лѣ / оло (e > o перед л)\"],[\"{краль}\",\"_король_\",\"имя Карла: or > ра / оро\"]],\n tasks:[\n  {q:\"^*bergъ^ в старославянском:\", o:[\"{брѣгъ}\",\"{брагъ}\",\"{берегъ}\",\"{бергъ}\"], a:0, e:\"er + удлинение > рѣ.\"},\n  {q:\"Почему в {градъ} а, а не о?\", o:[\"гласный удлинился, а ō > а\",\"о перешёл в а под ударением\",\"это влияние греческого\",\"а — из дифтонга\"], a:0, e:\"^*gōrdъ > *gardъ^: долгий ō дал {а} (тема 2).\"},\n  {q:\"Какое русское слово содержит неполногласие?\", o:[\"_страна_\",\"_сторона_\",\"_город_\",\"_молоко_\"], a:0, e:\"_страна_ — старославянизм, ср. исконное _сторона_.\"},\n  {q:\"^*korva^ в старославянском:\", o:[\"{крава}\",\"{корова}\",\"{крѣва}\",\"{крова}\"], a:0, e:\"or > ра: {крава}; рус. _корова_ — полногласие.\"}\n ]},\n\n{id:\"ort\", topic:3, tend:\"t2\", title:\"Сочетания *or, *ol в начале слова\",\n lead:\"Результат зависел от интонации и ветви; в старославянском — всегда ра-, ла-.\",\n news:[\"ст.-сл.: всегда ра-, ла-\",\"у других славян при нисх. интонации ро-, ло-\"],\n tbl:null,\n from:[{id:\"ideal\",why:\"начальный слог закрыт\"},{id:\"tort\",why:\"тот же механизм: перестановка с удлинением\"}],\n to:[{why:\"чередования раст- // рост-, раз- // роз-, равн- // ровн- в русском\"}],\n body:`<p>Результат преобразования начальных *ort, *olt зависел, во-первых, от <b>интонации<\/b> и, во-вторых, от <b>ветви<\/b> славянских языков.<\/p>\n<ol>\n<li><b>При восходящей интонации<\/b> результат одинаков во всех славянских языках: ^*ort > rōt > rat^, ^*olt > lōt > lat^. Например: ^*ortajь^ > {ратаи}, ^*olkomъ^ > {лакомъ}.<\/li>\n<li><b>При нисходящей интонации<\/b> результаты различны:\n<br>а) у южных славян — перестановка с одновременным удлинением гласного: ^*ort > rōt > rat^, ^*olt > lōt > lat^;\n<br>б) у остальных — перестановка без удлинения: ^*ort > rot^, ^*olt > lot^. Например: ^*orvьnъ^ > {равьнъ} и _ровьнъ_, ^*oldii^ > {ладии} — _лодии_ (_ладья — лодка_).<\/li>\n<\/ol>\n<p>К этому преобразованию восходят чередования _раст- // рост-_, _раз- // роз-_, _равн- // ровн-_.<\/p>\n<div data-w=\"ort\"><\/div>\n<details class=\"ex\"><summary>Что такое интонация и нужно ли её определять?<\/summary><p>Интонация здесь — тип слогового тона: восходящий или нисходящий. Её восстанавливают по другим языкам; самостоятельно определять её не нужно. Для старославянского вывод простой: у южных славян при <b>любой<\/b> интонации получается {ра-}, {ла-}. Разница видна только у восточных и западных славян.<\/p><\/details>\n<details class=\"ex\"><summary>Почему в русском и ра-, и ро-?<\/summary><p>Собственно русские результаты — _ло-, ро-_ при нисходящей интонации (_лодка, ровный, рост, розыск_) и _ла-, ра-_ при восходящей (_лакомый_). Кроме того, в русский пришли старославянизмы с _ра-, ла-_: _равный, ладья, растение, разум_. Отсюда пары _ровный — равный_, _лодка — ладья_.<\/p><\/details>`,\n ru:[[\"{равьнъ}\",\"_ровный_ / _равный_\",\"or- > ра- (ст.-сл.), ро- (вост.-сл., нисх. интонация)\"],[\"{ладии}\",\"_лодка_ / _ладья_\",\"ol- > ла- / ло-\"],[\"{лакомъ}\",\"_лакомый_\",\"восходящая интонация: ла- у всех славян\"],[\"{растѫ}\",\"_рост_ / _растение_\",\"раст- // рост-\"]],\n tasks:[\n  {q:\"^*orvьnъ^ в старославянском:\", o:[\"{равьнъ}\",\"{ровьнъ}\",\"{оравьнъ}\",\"{оровьнъ}\"], a:0, e:\"У южных славян при любой интонации or- > ра-.\"},\n  {q:\"От чего зависел результат начального *ort у восточных славян?\", o:[\"от интонации\",\"от рода слова\",\"от следующего гласного\",\"от числа слогов\"], a:0, e:\"Восходящая — ра-, нисходящая — ро-.\"},\n  {q:\"Какая пара показывает это чередование?\", o:[\"_ладья — лодка_\",\"_город — град_\",\"_петь — пою_\",\"_сон — сна_\"], a:0, e:\"ol- > ла- / ло-.\"}\n ]},\n\n{id:\"trt\", topic:3, tend:\"t2\", title:\"Сочетания tъrt, tъlt → слоговые плавные\",\n lead:\"Редуцированный + плавный между согласными: перестановка, и плавный стал слоговым.\",\n news:[\"r̥, l̥ — слоговые плавные\",\"на письме: ръ, рь, лъ, ль\"],\n tbl:\"c\", c:{\"р\":[\"слоговой r̥ (из tъrt, tьrt)\"],\"л\":[\"слоговой l̥ (из tъlt, tьlt)\"]},\n from:[{id:\"ideal\",why:\"сочетание закрывало слог\"},{id:\"qq\",why:\"ъ, ь — бывшие ŭ, ĭ\"}],\n to:[{id:\"sysc\",why:\"плавные бывают слоговыми и неслоговыми\"},{id:\"pos\",why:\"в этих сочетаниях ъ, ь — особый случай\"}],\n body:`<p>Сочетания редуцированного с плавным между согласными тоже закрывали слог. В южнославянских и части западнославянских языков они преобразовались так:<\/p>\n<table class=\"rules wide\">\n<tr><td>1<\/td><td>^*tŭrt > tъrt > trъt > t<span class=\"lr\">r<sup>ъ<\/sup><\/span>t > tr̥t^<\/td><td>^tъrgъ > trъgъ > t<span class=\"lr\">r<sup>ъ<\/sup><\/span>gъ > tr̥gъ^ — ст.-сл. {тръгъ}; ср. др.-рус. _търгъ_<\/td><\/tr>\n<tr><td>2<\/td><td>^*tĭrt > tьrt > trьt > t<span class=\"lr\">r<sup>ь<\/sup><\/span>t > tr̥t^<\/td><td>^vьrchъ > vrьchъ > v<span class=\"lr\">r<sup>ь<\/sup><\/span>chъ > vr̥chъ^ — ст.-сл. {врьхъ}; ср. др.-рус. _вьрхъ_<\/td><\/tr>\n<tr><td>3<\/td><td>^*tŭlt > tъlt > tlъt > t<span class=\"lr\">l<sup>ъ<\/sup><\/span>t > tl̥t^<\/td><td>^*pъlnъ > plъnъ > p<span class=\"lr\">l<sup>ъ<\/sup><\/span>nъ > pl̥nъ^ — ст.-сл. {плънъ}; ср. др.-рус. _пълнъ_<\/td><\/tr>\n<tr><td>4<\/td><td>^*tĭlt > tьlt > tlьt > t<span class=\"lr\">l<sup>ь<\/sup><\/span>t > tl̥t^<\/td><td>^*vьlkъ > vlьkъ > v<span class=\"lr\">l<sup>ь<\/sup><\/span>kъ > vl̥kъ^ — ст.-сл. {влькъ}; ср. др.-рус. ^*vьlkъ > *vъlkъ^ (_вълкъ_)<\/td><\/tr>\n<\/table>\n<p>Итог: в написаниях {ръ, рь, лъ, ль} между согласными плавный часто <b>слоговой<\/b> (r̥, l̥) — он сам образует слог, а ъ или ь лишь отмечает это на письме.<\/p>\n<details class=\"ex\"><summary>Как узнать, слоговой ли плавный — проверка русским<\/summary><p>Так советует лекция. Если в русском гласный стоит <b>после<\/b> плавного — плавный неслоговой: {кръвь} — _кровь_, {сльза} — _слеза_. Если гласный <b>перед<\/b> плавным — слоговой: {грътань} — _гортань_, {влъкъ} — _волк_, {дльгъ} — _долг_. Причина: в первом случае в праформе уже был порядок «плавный + редуцированный», а во втором — «редуцированный + плавный», который переставился.<\/p><\/details>\n<details class=\"ex\"><summary>Почему здесь нет полного гласного, как в {градъ}?<\/summary><p>Удлинение было: в ^t<span class=\"lr\">r<sup>ъ<\/sup><\/span>t^ одна черта стоит над всем сочетанием, а ъ записан мелко сверху — это уже не отдельный гласный, а призвук при плавном. Удлинялся сверхкраткий ъ или ь: он слился с плавным и сделал его слоговым, а отдельного полного гласного, как ā в ^tort > trat^, не возникло.<\/p><\/details>`,\n ru:[[\"{тръгъ}\",\"_торг_\",\"tъrt > тръ (ст.-сл.), тор (рус.)\"],[\"{врьхъ}\",\"_верх_\",\"tьrt > врь / вер\"],[\"{плънъ}\",\"_полный_\",\"tъlt > плъ / пол\"],[\"{влькъ}\",\"_волк_\",\"tьlt > вль / вол\"],[\"{кръвь}\",\"_кровь_\",\"неслоговой: в праформе уже kr + ъ\"]],\n tasks:[\n  {q:\"Плавный в {влъкъ} (рус. _волк_):\", o:[\"слоговой\",\"неслоговой\"], a:0, e:\"В русском гласный перед л — значит, в ст.-сл. л слоговой.\"},\n  {q:\"Плавный в {сльза} (рус. _слеза_):\", o:[\"неслоговой\",\"слоговой\"], a:0, e:\"В русском гласный после л — плавный неслоговой.\"},\n  {q:\"^*vьrchъ^ в старославянском:\", o:[\"{врьхъ}\",\"{вьрхъ}\",\"{верхъ}\",\"{врѣхъ}\"], a:0, e:\"tьrt > trьt: {врьхъ}; др.-рус. _вьрхъ_.\"}\n ]},\n\n{id:\"groups\", topic:3, tend:\"t2\", title:\"Упрощение групп согласных\",\n lead:\"Группы, нарушавшие восходящую звучность, теряли один из согласных.\",\n news:[\"6 правил упрощения\",\"расподобление tt > st\"],\n tbl:\"sonor\",\n from:[{id:\"ideal\",why:\"принцип восходящей звучности\"}],\n to:[{id:\"fall\",why:\"после падения редуцированных появятся новые группы: къде > где\"},{id:\"pal1\",why:\"кт перед гласным переднего ряда > шт\"}],\n body:`<p>Группы согласных в пределах слога должны были удовлетворять принципу восходящей звучности. Возможны последовательности 1–2, 1–3, 2–3, 1–2–3, где 1 — фрикативные {с, з}, 2 — взрывные {т, д, г, к, б, п}, 3 — сонорные {р, л, н, м} и {в}.<\/p>\n<p>Встречаются группы из двух согласных: {сп, ст, ск, сл, сн, см, св; зб, зд, зг, зл, зн, зм, зв; кн, гн, хн; пл, бл, гл, кл, хл; пр, бр, тр, др, кр, гр, хр; тв, дв, кв, хв}: {снѣгъ}, {знати}, {хлѣбъ}, {трава}, {жьзлъ}, {разбити}, {казнь}, {агньць}, {пригвоздити}, {влъхвъ}. Редко — из трёх ({стр, смр, ств, скв, скл, скр}): {страхъ}, {скрьжьтъ}.<\/p>\n<p>В остальных случаях группа <b>упрощалась<\/b>: устранялся первый или второй согласный.<\/p>\n<div data-w=\"groups\"><\/div>\n<details class=\"ex\"><summary>Почему {мести}, а не *мети?<\/summary><p>Два одинаковых взрывных подряд (tt) — звучность не растёт. Первый из них превратился в щелевой {с} — это <b>расподобление<\/b> (диссимиляция): похожие звуки становятся непохожими. Так же ^*vedti^ > {вести}. Ср. русское _мету — мести, веду — вести_: в корне т/д, в инфинитиве с.<\/p><\/details>\n<details class=\"ex\"><summary>Почему {пешти}, но {плетѫ}?<\/summary><p>Группа kt упрощалась по-разному. Перед гласным переднего ряда (^*pekti^: kt + i) она дала {шт} — тот же результат, что tj. В остальных случаях k выпадал: ^*plektǫ^ > {плетѫ}. У восточных славян kt перед гласным переднего ряда дал ч: _печь, мочь_.<\/p><\/details>\n<details class=\"ex\"><summary>Все ли упрощения объясняются звучностью?<\/summary><p>Большинство — да: ^*o-psa^ (п 2 → с 1: звучность падает), ^*ži-vti^ (в 3 → т 2). Но группы «взрывной + сонорный» tl, dl, pn, dn, tm, dm звучность не нарушают и всё же упрощались — их нужно запомнить отдельно. Недаром в западнославянских tl, dl сохранились: чеш. _vedl, pletl_.<\/p><\/details>\n<details class=\"ex\"><summary>Где в русском видны исчезнувшие согласные<\/summary><p>_Сон — спать_ (п), _кануть — капать_ (п), _число — читать_ (т), _время — вертеть_ (т), _обязать — вязать_ (в), _облако — обволакивать_ (в).<\/p><\/details>`,\n ru:[[\"{сънъ}\",\"_сон — спать_\",\"pn > n\"],[\"{врѣмѧ}\",\"_время — вертеть_\",\"tm > m\"],[\"{вести}\",\"_вести — веду_\",\"dt > st\"],[\"{пешти}\",\"_печь_\",\"kt перед гласным переднего ряда: шт / ч\"],[\"{число}\",\"_число — читать_\",\"ts > s\"]],\n tasks:[\n  {q:\"^*vedti^ > ?\", o:[\"{вести}\",\"{веѕти}\",\"{вети}\",\"{ведти}\"], a:0, e:\"dt > st — расподобление.\"},\n  {q:\"^*opsa^ > ?\", o:[\"{оса}\",\"{опса}\",\"{опа}\",\"{осса}\"], a:0, e:\"ps > s: первый согласный выпал.\"},\n  {q:\"Какая группа сохранялась?\", o:[\"{ст}\",\"pt\",\"dm\",\"ps\"], a:0, e:\"с (1) → т (2) — звучность растёт.\"},\n  {q:\"^*pekti^ > ?\", o:[\"{пешти}\",\"{пекти}\",\"{пети}\",\"{печи}\"], a:0, e:\"kt перед гласным переднего ряда > {шт}.\"}\n ]},\n\n{id:\"prot\", topic:3, tend:\"t2\", title:\"Протетический j\",\n lead:\"Слог не начинался с гласного: перед начальным гласным развивался j.\",\n news:[\"ѥ-, ю-, ꙗ- в начале слова\",\"и < jь\"],\n tbl:\"v\", v:{\"и\":[\"jь (в начале слова)\"]},\n from:[{id:\"ideal\",why:\"слог должен начинаться с согласного\"}],\n to:[{id:\"sysv\",why:\"ещё один источник и\"},{why:\"йотированные буквы в начале слов: ѥ, ю, ꙗ, ѩ, ѭ\"}],\n body:`<p>Слог, начинающийся с гласного, не соответствовал модели идеального слога ta. Поэтому перед гласным в начале слова развивался <b>протетический<\/b> (приставной) <b>j<\/b>:<\/p>\n<table class=\"rules three\"><tr><th>праславянский<\/th><th>старославянский<\/th><th>русский<\/th><\/tr>\n<tr><td>^*eda^<\/td><td>{ѥда}<\/td><td>_еда_<\/td><\/tr>\n<tr><td>^*unos^<\/td><td>{юнъ}<\/td><td>_юность_<\/td><\/tr>\n<tr><td>^*aviti sen^<\/td><td>{ꙗвити сѧ}<\/td><td>_явиться_<\/td><\/tr><\/table>\n<p>С этим связано и происхождение {и} из ^jь^: звук {ь} не мог стоять в абсолютном начале слова, и перед ним ставился протетический j. Сочетание jь дало {и}: ср. {въз-ьм-ѫ} и {им-ѫ} (^*jьmǫ^).<\/p>\n<details class=\"ex\"><summary>Почему {възьмѫ}, но {имѫ}?<\/summary><p>Корень ^ьм-^ ‘брать’. После приставки {въз-} он стоит не в начале слова, j не нужен: {възьмѫ}. В начале слова ь стоять не мог, появлялся j, а ^jь^ дало {и}: ^*jьmǫ^ > {имѫ}. Тот же корень в русском: _возьму_ и _иметь_.<\/p><\/details>\n<details class=\"ex\"><summary>Почему в русском _один_, а не _един_?<\/summary><p>У восточных славян в ряде слов начальное je изменилось в о: _один_ (ст.-сл. {ѥдинъ}), _озеро_ ({ѥзеро}), _олень_ ({ѥлень}), _осень_ ({ѥсень}). Формы с е в русском — старославянизмы: _единый, единство_.<\/p><\/details>`,\n ru:[[\"{ѥда}\",\"_еда_\",\"протетический j перед е\"],[\"{ѥдинъ}\",\"_один_ / _единый_\",\"вост.-сл. je- > о-; _единый_ — старославянизм\"],[\"{ѥзеро}\",\"_озеро_\",\"то же\"],[\"{юнъ}\",\"_юность_\",\"j перед у\"]],\n tasks:[\n  {q:\"Почему перед начальным гласным развивался j?\", o:[\"слог должен был начинаться с согласного\",\"так требовала палатализация\",\"j остался от дифтонга\",\"для различения омонимов\"], a:0, e:\"Модель идеального слога — ta.\"},\n  {q:\"^*jьmǫ^ > ?\", o:[\"{имѫ}\",\"{ьмѫ}\",\"{ѥмѫ}\",\"{ꙗмѫ}\"], a:0, e:\"jь > {и}.\"},\n  {q:\"Какое русское слово — старославянизм?\", o:[\"_единый_\",\"_один_\",\"_озеро_\",\"_олень_\"], a:0, e:\"Исконно русское je- > о-: _один_; е- сохранилось в книжном _единый_.\"}\n ]},\n\n/* ================= ТЕМА 4 ================= */\n{id:\"pal1\", topic:4, tend:\"t3\", title:\"Первая палатализация заднеязычных\",\n lead:\"к, г, х перед гласными переднего ряда перешли в мягкие шипящие ч’, ж’, ш’.\",\n news:[\"к > ч’, г > ж’, х > ш’\",\"ск > шт’, зг > жд’\",\"кт, гт > шт\",\"ē после шипящих > а\",\"где: наст. вр., аорист, зв. форма, суффиксы\"],\n tbl:\"c\", c:{\"ч\":[\"к + гласный переднего ряда\"],\"ж\":[\"г + гласный переднего ряда\"],\"ш\":[\"х + гласный переднего ряда\"],\"шт\":[\"ск, кт, гт + гласный переднего ряда\"],\"жд\":[\"зг + гласный переднего ряда\"]},\n v:{\"а\":[\"ē после шипящих\"]},\n from:[{id:\"tend\",why:\"тенденция 3 — сингармонизм\"},{id:\"jot\",why:\"те же звуки возникли из kj, gj, chj\"}],\n to:[{id:\"pal2\",why:\"позже, после монофтонгизации, действует вторая\"},{id:\"soft\",why:\"к, г, х больше не стоят перед гласными переднего ряда\"},{id:\"consalt\",why:\"к // ч, г // ж, х // ш\"}],\n body:`<p>Смягчение заднеязычных к, г, х происходило в результате тенденции к <b>слоговому сингармонизму<\/b>: в пределах слога звуки уподоблялись по артикуляции (согласный — гласному или наоборот).<\/p>\n<p>Выделяют три смягчения: первое дало мягкие <b>шипящие<\/b>; второе и третье, более поздние (после монофтонгизации дифтонгов), — мягкие <b>свистящие<\/b>.<\/p>\n<p>В ходе первой палатализации <b>к > ч’, г > ж’, х > ш’<\/b> перед гласными переднего ряда {и, е, ѣ, ѧ, ь}. Это изменение заднеязычных в переднеязычные палатальные вследствие уподобления гласным переднего ряда: {бѣгъ} — {бѣжитъ}, {рекѫ} — {речетъ}, {вѣкъ} — {вѣчьнъ}, {богъ} — {божьскъ}, {бѣгъ} — {бѣжати} (^*bēgēti^), {тихъ} — {тишина}.<\/p>\n<p>Кроме того, перед теми же гласными <b>ск > шт’, зг > жд’<\/b>: {воскъ} — {воштанъ}, {дъска} — {дъштица}; <b>кт, гт > шт<\/b>: {рекѫ} — {решти}, {могѫ} — {мошти}.<\/p>\n<h4>Где встречается первая палатализация<\/h4>\n<p>В учебниках первая палатализация видна в корне слова и на стыке морфем — при словоизменении и словообразовании (Ремнёва §92). Вот формы, которые приводят учебники и лекция:<\/p>\n<table class=\"where\"><tr><th>Где<\/th><th>Примеры<\/th><th>Источник<\/th><\/tr>\n<tr><td>Настоящее время глагола: окончания с е, и<\/td><td>{рекѫ} — {речеши}, {речетъ}; {могѫ} — {можеши}; {бѣжитъ}<\/td><td><span class=\"srcref\">Л<\/span><span class=\"srcref\">Ив §21<\/span><span class=\"srcref\">Р §92, §153<\/span><\/td><\/tr>\n<tr><td>Простой аорист<\/td><td>{рече}, {може} — 3 л. ед. ч. (ср. {рекѫ}, {могъ}); {бышѧ} — 3 л. мн. ч. (ср. 1 л. ед. ч. {быхъ})<\/td><td><span class=\"srcref\">Р §92<\/span><span class=\"srcref\">Ив §21<\/span><\/td><\/tr>\n<tr><td>Звательная форма<\/td><td>{другъ} — {друже}, {духъ} — {душе}, {отрокъ} — {отроче}<\/td><td><span class=\"srcref\">Р §92<\/span><span class=\"srcref\">Ив §21<\/span><\/td><\/tr>\n<tr><td>Словообразование: суффиксы с ь, и, ѧ<\/td><td>{вѣкъ} — {вѣчьнъ}, {богъ} — {божьскъ}; {тихъ} — {тишина}; {отрокъ} — {отрочѧ}; {мѫка} — {мѫчити}; {сушити}; {воскъ} — {воштанъ}, {дъска} — {дъштица}<\/td><td><span class=\"srcref\">Л<\/span><span class=\"srcref\">Ив §21<\/span><span class=\"srcref\">Р §92<\/span><span class=\"srcref\">К §22<\/span><\/td><\/tr>\n<tr><td>Глаголы на -ати из ^*-ēti^<\/td><td>{бѣгъ} — {бѣжати}, {крикъ} — {кричати}, {слухъ} — {слушати}; {слышати}, {дышати}: после шипящего ē > {а}<\/td><td><span class=\"srcref\">Л<\/span><span class=\"srcref\">Р §92<\/span><span class=\"srcref\">Ив §21<\/span><span class=\"srcref\">К §22<\/span><\/td><\/tr>\n<tr><td>Корень: древние чередования гласных<\/td><td>{коса} — {чесати}, {коньць} — {начѧло}; без пары: {жена}, {чѧдо}, {жѧти}<\/td><td><span class=\"srcref\">Р §92<\/span><span class=\"srcref\">Ив §21<\/span><\/td><\/tr>\n<tr><td>Инфинитив, причастие<\/td><td>{решти}, {мошти}, также {ношть} (кт, гт > шт); {ходъ} — {шьдъ}<\/td><td><span class=\"srcref\">Л<\/span><span class=\"srcref\">Ив §21<\/span><\/td><\/tr>\n<\/table>\n<p class=\"sum-note\">Р — Ремнёва 2004 (то же в белградском издании), Ив — Иванова 1998, К — Камчатнов 2009, Л — слайды лекции. Перед ѫ, ъ, ы, а, о к, г, х сохраняются: {рекѫ}, {богъ}, {тихъ}. Перед ѣ, и из дифтонгов первая палатализация уже не действовала (Р §92).<\/p>\n<div class=\"notebox\"><h5>А повелительное наклонение?<\/h5>\n<p>В присланных учебниках и в слайдах лекций повелительное наклонение — пример <b>второй<\/b> палатализации, а не первой. Суффикс {-и-} / {-ѣ-} возник из дифтонга ^oi̯^ (тематический ^o^ + суффикс ^i^). Перед ним к, г дали свистящие: {рьци}, {рьцѣте}, {помози}, {моѕи}, {врьзи} (Ремнёва §153, с. 274; Иванова §96, с. 171, и §22; Камчатнов §59; слайд о второй палатализации).<\/p>\n<p>Первая палатализация у тех же глаголов — в <b>настоящем времени<\/b>. У Ремнёвой в таблице (§153, с. 275) формы стоят рядом: {речеши} — {рьци}, {можеши} — {помози}, {врьжеши} — {врьзи}. Основа одна, а результаты разные: перед исконным е — шипящий, перед и из дифтонга — свистящий.<\/p>\n<p>Шипящий в повелительном наклонении бывает, но он пришёл из основы: {слыши} — от {слышати} (^*slūchēti^, первая палатализация в основе). А {плачи} — от {плакати}, где ч из kj (йотовое смягчение).<\/p>\n<p class=\"nb\">В учебниках Ремнёвой (оба издания), Ивановой и Камчатнова не сказано, что первая палатализация встречается в повелительном наклонении. Возможно, на лекции речь шла о паре {речеши} — {рьци}. Лучше уточнить у преподавателя.<\/p><\/div>\n<details class=\"ex\"><summary>Что происходит при палатализации — по артикуляции<\/summary><p>Заднеязычный к образуется задней частью языка, гласный е — передней. Внутри одного слога они уподобились: место образования согласного сдвинулось вперёд, к твёрдому нёбу (лат. palatum — отсюда «палатализация»), и к стал мягким ч’.<\/p><\/details>\n<details class=\"ex\"><summary>Почему {бѣжати}, а не *бѣжѣти?<\/summary><p>Праформа ^*bēgēti^. Сначала г перед ē стал ж. А после нового шипящего долгий ē перешёл в {а}: ^*bēžēti^ > {бѣжати}. Поэтому в сводке происхождения гласных у {а} есть особый источник — «ē после шипящих» (он добавлен в таблицу гласных). Так же {крикъ} — {кричати}, {слухъ} — {слышати}.<\/p><\/details>\n<details class=\"ex\"><summary>Почему {друже}, но {друзи}?<\/summary><p>Звательный падеж: г перед исконным е — первая палатализация, {друже}. Им. п. мн. ч. ^*drugoi̯^: окончание oi̯ дало и уже после того, как первая палатализация перестала действовать, поэтому г изменился иначе — в з. Это вторая палатализация, следующий этап.<\/p><\/details>`,\n ru:[[\"{рекѫ} — {речетъ}\",\"_рука — ручной_, _пеку — печёт_\",\"к > ч\"],[\"{богъ} — {божьскъ}\",\"_бог — божий_\",\"г > ж\"],[\"{тихъ} — {тишина}\",\"_тихий — тишина_\",\"х > ш\"],[\"{решти}, {мошти}\",\"_речь, мочь_\",\"кт, гт перед и: шт (ст.-сл.) / ч (рус.)\"]],\n tasks:[\n  {q:\"{другъ} — {друже}: какой процесс?\", o:[\"первая палатализация\",\"вторая палатализация\",\"третья палатализация\",\"йотовое смягчение\"], a:0, e:\"г перед исконным е > ж.\"},\n  {q:\"^*bēgēti^ > ?\", o:[\"{бѣжати}\",\"{бѣжѣти}\",\"{бѣгати}\",\"{бѣзати}\"], a:0, e:\"г > ж перед ē; ē после ж > а; корневой ē > ѣ.\"},\n  {q:\"{воскъ} — {воштанъ}: что изменилось?\", o:[\"ск > шт перед гласным переднего ряда\",\"к > ч\",\"ст > шт\",\"к выпал\"], a:0, e:\"ск > шт’.\"},\n  {q:\"Перед какими гласными действовала первая палатализация?\", o:[\"и, е, ѣ, ѧ, ь\",\"а, о, у, ы, ъ\",\"только перед и\",\"перед любыми\"], a:0, e:\"Перед гласными переднего ряда.\"},\n  {q:\"{рече}, {може} — что это за форма?\", o:[\"3 л. ед. ч. простого аориста\",\"2 л. ед. ч. повелительного наклонения\",\"звательная форма\",\"инфинитив\"], a:0, e:\"Ремнёва §92: к, г перед е аориста > ч, ж (ср. {рекѫ}, {могъ}).\"},\n  {q:\"{речеши} — {рьци}: какие палатализации?\", o:[\"в {речеши} первая, в {рьци} вторая\",\"обе — первая\",\"обе — вторая\",\"в {речеши} вторая, в {рьци} первая\"], a:0, e:\"Наст. вр.: исконный е — шипящий. Повел. накл.: и из ^oi̯^ — свистящий (Ремнёва §153).\"},\n  {q:\"В какой форме НЕТ первой палатализации?\", o:[\"{помози} (повел. накл.)\",\"{можеши} (наст. вр.)\",\"{може} (аорист)\",\"{друже} (зв. ф.)\"], a:0, e:\"Суффикс повелительного наклонения и < ^oi̯^ — здесь вторая палатализация: г > з.\"}\n ]},\n\n{id:\"pal2\", topic:4, tend:\"t3\", title:\"Вторая палатализация\",\n lead:\"к, г, х перед новыми ѣ, и (из дифтонгов) перешли в свистящие ц’, ѕ’, с’.\",\n news:[\"к > ц’, г > ѕ’ (> з’), х > с’\",\"кв > цв, гв > зв\",\"условие: ѣ, и из дифтонгов\"],\n tbl:\"c\", c:{\"ц\":[\"к + ѣ, и из дифтонгов\"],\"ѕ\":[\"г + ѣ, и из дифтонгов\"],\"с’\":[\"х + ѣ, и из дифтонгов\"]},\n from:[{id:\"tend\",why:\"тенденция 3\"},{id:\"diph\",why:\"новые ѣ, и из oi̯, ai̯ — условие\"},{id:\"pal1\",why:\"к этому времени первая уже закончилась\"}],\n to:[{id:\"pal3\",why:\"тоже свистящие, но условие — предшествующий гласный\"},{id:\"consalt\",why:\"к // ц, г // з, х // с\"}],\n body:`<p>Ко второй палатализации относят переход заднеязычных в мягкие <b>свистящие<\/b> перед гласными {и}, {ѣ}, образованными в результате <b>монофтонгизации дифтонгов oi̯, ai̯<\/b>: <b>к > ц’, г > ѕ’ (dz’) > з’, х > с’<\/b>.<\/p>\n<p>{рекѫ} — {рьци} (2 л. ед. ч. повел. накл.), {могѫ} — {моѕи} (2 л. ед. ч. повел. накл.), {духъ} — {дуси} (им. п. мн. ч.), {цѣна} (^*kai̯na^).<\/p>\n<p>В старославянском второй палатализации подвергались также сочетания <b>кв, гв<\/b>: {цвѣтъ}, {звѣзда}, {влъсви} (ед. ч. {влъхвъ}).<\/p>\n<p><b>Где встречается.<\/b> Обычно на конце основы перед окончанием (Ремнёва §93): Д. п. ед. ч. ж. р. {рѫцѣ}; М. п. ед. и мн. ч. м. р. {влъцѣ}, {влъцѣхъ}; И. п. мн. ч. {влъци}, {дуси}; повелительное наклонение {рьци}, {мози}. Сравните с первой палатализацией в тех же словах: {речеши} — {рьци}, {друже} — {друзи}.<\/p>\n<div data-w=\"chrono\"><\/div>\n<details class=\"ex\"><summary>Главный вопрос: почему к в одних словах дал ч, а в других ц?<\/summary><p>Сравните {вѣкъ} — {вѣчьнъ} (к перед исконным ь) и ^*kai̯na^ > {цѣна} (к перед ѣ из дифтонга). Различие — в происхождении гласного после к. Перед исконными гласными переднего ряда к уже изменился в ч (первая палатализация). Новые ѣ, и появились позже — из дифтонгов (этап «Дифтонги»). К тому времени первая палатализация закончилась, и перед новыми гласными к дал другой результат — ц. Это <b>относительная хронология<\/b>: первая палатализация → монофтонгизация → вторая палатализация.<\/p><\/details>\n<details class=\"ex\"><summary>Что такое {ѕ} (зело)?<\/summary><p>Мягкая аффриката dz’ — результат г во второй и третьей палатализации. Позже она упростилась в з’. Ранние памятники ещё сохраняют {ѕ}: {моѕи}, {польѕа} — например, Мариинское евангелие.<\/p><\/details>\n<details class=\"ex\"><summary>Где вторая палатализация видна в русском?<\/summary><p>В корнях: _цена, цвет, звезда_. В склонении русский её устранил по аналогии: ст.-сл. {рѫка} — {на рѫцѣ}, {нога} — {на ноѕѣ}, а в русском _на руке, на ноге_.<\/p><\/details>`,\n ru:[[\"{цѣна}\",\"_цена_\",\"ai̯ > ѣ, затем к > ц\"],[\"{цвѣтъ}, {звѣзда}\",\"_цвет, звезда_\",\"кв > цв, гв > зв\"],[\"{на рѫцѣ}\",\"_на руке_\",\"русский устранил чередование по аналогии\"],[\"{дуси}\",\"_духи_\",\"х > с перед и < oi̯; в русском х восстановлен\"]],\n tasks:[\n  {q:\"^*kai̯na^ > ?\", o:[\"{цѣна}\",\"{чѣна}\",\"{кѣна}\",\"{цина}\"], a:0, e:\"ai̯ > ѣ, затем к > ц перед новым ѣ.\"},\n  {q:\"Почему в {цѣна} ц, а в {вѣчьнъ} ч?\", o:[\"ѣ в {цѣна} из дифтонга и появился после первой палатализации\",\"в {цѣна} другое ударение\",\"{цѣна} — заимствование\",\"ч и ц взаимозаменяемы\"], a:0, e:\"Относительная хронология: 1-я палатализация → монофтонгизация → 2-я.\"},\n  {q:\"{духъ} — {дуси}: какой процесс?\", o:[\"вторая палатализация\",\"первая палатализация\",\"третья палатализация\",\"sj > ш’\"], a:0, e:\"х > с перед и < oi̯.\"},\n  {q:\"Во что перешло кв в {цвѣтъ}?\", o:[\"цв\",\"чв\",\"кв (без изменений)\",\"св\"], a:0, e:\"кв перед ѣ > цв.\"}\n ]},\n\n{id:\"pal3\", topic:4, tend:\"t3\", title:\"Третья палатализация\",\n lead:\"к, г, х после и, ь, ѧ, рь перешли в свистящие: влиял предшествующий гласный.\",\n news:[\"прогрессивная\",\"после и, ь, ѧ, рь\",\"не действует перед согласным, ъ, ы\"],\n tbl:\"c\", c:{\"ц\":[\"к после и, ь, ѧ, рь\"],\"ѕ\":[\"г после и, ь, ѧ, рь\"],\"с’\":[\"х после и, ь, ѧ, рь\"]},\n from:[{id:\"tend\",why:\"тенденция 3\"},{id:\"nas\",why:\"ѧ — один из гласных-условий\"},{id:\"pal2\",why:\"тот же результат — свистящие\"}],\n to:[{id:\"consalt\",why:\"{въсклицати} — {въскликнѫти}\"},{id:\"row\",why:\"{нарицати}: к > ц после и\"}],\n body:`<p>Третья палатализация проходила, если <b>перед<\/b> согласными к, г, х находились звуки {и, ь, ѧ, рь} (слогообразующий р): {отьць} (^*otьkъ^), {кънѧѕь} (^*kъnęgъ^), {овьца} (^*ovĭka^).<\/p>\n<p>Она <b>не происходила<\/b>, если после заднеязычного стоял согласный или гласные {ъ, ы}: {въсклицати} — {въскликнѫти}, {ниць} — {никнѫти}, {кънѧѕь} — {кънѧгыни}, {подвиѕати} — {подвигнѫти}.<\/p>\n<details class=\"ex\"><summary>Чем третья отличается от первой и второй?<\/summary><p>Первая и вторая — <b>регрессивные<\/b>: на согласный влияет следующий гласный (^ke > če^). Третья — <b>прогрессивная<\/b>: влияет предшествующий гласный (^ika > ica^). Результат — как у второй: свистящие ц, ѕ, с.<\/p><\/details>\n<details class=\"ex\"><summary>Почему {отьць}, если после к стоит ъ?<\/summary><p>Запрет касается ъ и ы, восходящих к ŭ и ū: {кънѧгыни} (ы < ū) сохраняет г. Конечный ъ в ^*otьkъ^ — окончание, восходящее к ^*-os^; во время третьей палатализации на его месте был не ъ, поэтому палатализация прошла. После мягкого ц ъ сменился на ь: {отьць}.<\/p><\/details>\n<details class=\"ex\"><summary>Пары в русском<\/summary><p>_Отец, овца, князь_ — свистящие после ь, ѧ. Рядом — формы без палатализации, где после согласного стоит согласный или ы: _восклицать — воскликнуть, ниц — никнуть, князь — княгиня, подвизаться — подвигнуть_.<\/p><\/details>`,\n ru:[[\"{отьць}\",\"_отец_\",\"к > ц после ь\"],[\"{кънѧѕь} — {кънѧгыни}\",\"_князь — княгиня_\",\"перед ы — без палатализации\"],[\"{въсклицати} — {въскликнѫти}\",\"_восклицать — воскликнуть_\",\"перед н — без палатализации\"],[\"{овьца}\",\"_овца_\",\"к > ц после ь\"]],\n tasks:[\n  {q:\"^*otьkъ^ > ?\", o:[\"{отьць}\",\"{отьчь}\",\"{отькъ}\",\"{отьсь}\"], a:0, e:\"к после ь > ц (третья палатализация).\"},\n  {q:\"Почему в {кънѧгыни} г не изменился?\", o:[\"после г стоит ы\",\"перед г нет гласного\",\"это заимствование\",\"г вообще не палатализовался\"], a:0, e:\"Перед ъ, ы (< ŭ, ū) третья палатализация не шла.\"},\n  {q:\"Какое направление влияния у третьей палатализации?\", o:[\"предшествующий гласный влияет на согласный\",\"следующий гласный влияет на согласный\",\"j влияет на согласный\",\"согласный влияет на гласный\"], a:0, e:\"Прогрессивная палатализация.\"},\n  {q:\"{ниць} — {никнѫти}: почему во втором слове к?\", o:[\"после к стоит согласный н\",\"перед к нет и\",\"это другой корень\",\"к восстановлен по аналогии\"], a:0, e:\"Перед согласным третья палатализация не происходила.\"}\n ]},\n\n/* ================= ТЕМА 5 ================= */\n{id:\"sysv\", topic:5, tend:\"r\", title:\"Система гласных старославянского языка\",\n lead:\"Одиннадцать гласных: ряд, подъём, огубленность, носовые, редуцированные.\",\n news:[\"11 гласных\",\"лабиализованные о, у\",\"носовые ѧ, ѫ\",\"краткие ъ, ь\"],\n tbl:\"v\", vMark:[\"о\",\"у\",\"ѧ\",\"ѫ\",\"ъ\",\"ь\"],\n from:[{id:\"qq\",why:\"восемь гласных\"},{id:\"diph\",why:\"у и новые источники ѣ, и\"},{id:\"nas\",why:\"ѧ, ѫ\"},{id:\"pal1\",why:\"а из ē после шипящих\"},{id:\"prot\",why:\"и из jь\"}],\n to:[{id:\"jatyus\",why:\"особые звуки: ѣ и юсы\"},{id:\"pos\",why:\"судьба ъ и ь\"}],\n body:`<p>Итог предыдущих этапов — система гласных старославянского языка. Таблица справа собрана по этапам; наведите или нажмите на звук, чтобы увидеть его источники.<\/p>\n<p><b>Характеристика звуков:<\/b><\/p>\n<ul>\n<li>{о} и {у} были <b>лабиализованными<\/b> (огубленными);<\/li>\n<li>{ѧ} (юс малый) и {ѫ} (юс большой) — <b>носовыми<\/b>, то есть произносились с участием носовой полости;<\/li>\n<li>{ъ} (ер) и {ь} (ерь) — <b>краткими<\/b> (редуцированными, неполного образования).<\/li>\n<\/ul>\n<h4>Происхождение (обобщение)<\/h4>\n<p>Гласные старославянского были <b>монофтонгического<\/b> или <b>дифтонгического<\/b> происхождения:<\/p>\n<table class=\"rules origin\">\n<tr><td>{а}<\/td><td><<\/td><td>ō, ā (+ ē после шипящих)<\/td><\/tr>\n<tr><td>{о}<\/td><td><<\/td><td>ŏ, ă<\/td><\/tr>\n<tr><td>{е}<\/td><td><<\/td><td>ĕ<\/td><\/tr>\n<tr><td>{ы}<\/td><td><<\/td><td>ū<\/td><\/tr>\n<tr><td>{ъ}<\/td><td><<\/td><td>ŭ<\/td><\/tr>\n<tr><td>{ь}<\/td><td><<\/td><td>ĭ<\/td><\/tr>\n<tr><td>{у}<\/td><td><<\/td><td>au̯, ou̯, eu̯<\/td><\/tr>\n<tr><td>{ѫ}<\/td><td><<\/td><td>an, am, on, om, un, um<\/td><\/tr>\n<tr><td>{ѧ}<\/td><td><<\/td><td>en, em, in, im<\/td><\/tr>\n<tr><td>{и}<\/td><td><<\/td><td>ī, oi̯, ei̯; кроме того, jь<\/td><\/tr>\n<tr><td>{ѣ}<\/td><td><<\/td><td>ē, ai̯, oi̯<\/td><\/tr>\n<\/table>\n<details class=\"ex\"><summary>Как читать таблицу: ряд и подъём<\/summary><p><b>Ряд<\/b> — какая часть языка поднимается: передняя ({и, е, ѣ}), средняя ({ы}) или задняя ({у, о, а}). <b>Подъём<\/b> — насколько высоко: верхний ({и, ы, у}), средний ({е, о}), нижний ({ѣ, а}). {ь} и {ѧ} стоят в одном ряду с {е}, {ъ} и {ѫ} — с {о}.<\/p><\/details>\n<details class=\"ex\"><summary>Монофтонгическое и дифтонгическое — как различить<\/summary><p>Монофтонгическое — из простых индоевропейских гласных (тема 2): {е, о, а, ы, ъ, ь}. Дифтонгическое — из дифтонгов и дифтонгических сочетаний (тема 3): {у, ѧ, ѫ}. {и} и {ѣ} имеют оба типа источников.<\/p><\/details>`,\n ru:[[\"{рѫка}\",\"_рука_\",\"ѫ > у\"],[\"{пѧть}\",\"_пять_\",\"ѧ > я\"],[\"{вѣра}\",\"_вера_\",\"ѣ > е\"],[\"{сънъ}\",\"_сон_\",\"ъ в сильной позиции > о\"]],\n tasks:[\n  {q:\"Какие гласные были носовыми?\", o:[\"{ѧ}, {ѫ}\",\"{ъ}, {ь}\",\"{о}, {у}\",\"{ѣ}, {а}\"], a:0, e:\"Юсы произносились с участием носовой полости.\"},\n  {q:\"Какого подъёма {ѣ} в старославянском?\", o:[\"нижнего\",\"верхнего\",\"среднего\",\"это не гласный\"], a:0, e:\"Передний ряд, нижний подъём.\"},\n  {q:\"Из чего {у}?\", o:[\"из дифтонгов au̯, ou̯ (и eu̯ > ю)\",\"из ū\",\"из ŭ\",\"из un\"], a:0, e:\"{у} — дифтонгического происхождения.\"},\n  {q:\"Какие гласные лабиализованные?\", o:[\"{о}, {у}\",\"{и}, {ы}\",\"{а}, {ѣ}\",\"{ъ}, {ь}\"], a:0, e:\"Огубленные — о и у.\"}\n ]},\n\n{id:\"jatyus\", topic:5, tend:\"r\", title:\"Особые гласные: ѣ и юсы\",\n lead:\"Как звучали ять и носовые и что с ними стало в славянских языках.\",\n news:[\"ѣ — передний ряд, нижний подъём\",\"в глаголице одна буква для ѣ и ꙗ\",\"юсы сохранились в польском и кашубском\"],\n tbl:\"v\", vMark:[\"ѣ\",\"ѧ\",\"ѫ\"],\n from:[{id:\"sysv\",why:\"место ѣ и юсов в системе\"},{id:\"nas\",why:\"происхождение юсов\"},{id:\"diph\",why:\"ѣ из ai̯, oi̯\"}],\n to:[{why:\"правильное употребление юсов — критерий старославянского памятника\"}],\n body:`<h4>Звук {ѣ}<\/h4>\n<p>Звук ѣ унаследован из праславянского и был характерен для всех славянских языков, но в разных языках произносился по-разному. В старославянском это был <b>гласный переднего ряда нижнего подъёма<\/b>.<\/p>\n<p>В глаголице кириллическим буквам {ѣ} и {ꙗ} соответствовала <b>одна буква<\/b> <span class=\"glag\">ⱑ<\/span>. Значит, для составителя азбуки два звука за этими графемами были неразличимы. Следствие — смешение этих букв в старославянских памятниках: {ѣко} вм. {ꙗко}, {землѣ} вм. {землꙗ}. У западных и восточных славян ѣ относился к верхнему подъёму и впоследствии совпал с {и} или {е}.<\/p>\n<h4>Звуки {ѧ} и {ѫ}<\/h4>\n<p>Старославянскому языку эпохи Кирилла и Мефодия были свойственны носовые звуки — юсы: {ѧ} (юс малый) и {ѫ} (юс большой). Носовые утрачены почти во всех славянских языках и сохранились только в <b>польском<\/b> и <b>кашубском<\/b>. В остальных они изменились: {ѧ} — в е (южнослав.) или я [’а] (восточнослав.); {ѫ} — в ъ (болг.), о (словен.), у (серб., чеш., словац., восточнослав.).<\/p>\n<div data-w=\"yus\"><\/div>\n<details class=\"ex\"><summary>Почему одна глаголическая буква для ѣ и ꙗ — важный довод<\/summary><p>Азбука Кирилла фонологическая: одна буква — одна фонема. Если создатель дал ѣ и ꙗ одну букву, значит, в его диалекте (окрестности Солуни) ѣ звучал как широкое [’а], почти как ꙗ. Это и есть довод в пользу нижнего подъёма ѣ в старославянском.<\/p><\/details>\n<details class=\"ex\"><summary>Юсы и датировка памятников<\/summary><p>Носовые рано стали утрачиваться в болгарских говорах, и писцы начали путать {ѧ} и {ѫ}. Поэтому правильное употребление юсов — главный критерий, по которому памятник относят к старославянским (см. модуль «Старославянские памятники»).<\/p><\/details>\n<details class=\"ex\"><summary>Как ѣ отразился в русском и украинском<\/summary><p>В русском ѣ совпал с е: _вера, лес, хлеб_. В украинском — с і: _віра, ліс, хліб_. Это и есть «совпал с и или е» из лекции.<\/p><\/details>`,\n ru:[[\"{пѧть}\",\"_пять_ (польск. _pięć_)\",\"ѧ > я; в польском носовой сохранился\"],[\"{рѫка}\",\"_рука_ (польск. _ręka_)\",\"ѫ > у\"],[\"{зѫбъ}\",\"_зуб_ (польск. _ząb_)\",\"ѫ > у\"],[\"{вѣра}\",\"_вера_ (укр. _віра_)\",\"ѣ > е / і\"]],\n tasks:[\n  {q:\"В каких языках сохранились носовые?\", o:[\"в польском и кашубском\",\"в русском и украинском\",\"в болгарском\",\"во всех южнославянских\"], a:0, e:\"Только польский и кашубский.\"},\n  {q:\"Во что перешёл {ѫ} в русском?\", o:[\"у\",\"о\",\"ъ\",\"я\"], a:0, e:\"{рѫка} > _рука_.\"},\n  {q:\"Что показывает одна глаголическая буква для ѣ и ꙗ?\", o:[\"для составителя азбуки эти звуки были неразличимы\",\"глаголица древнее кириллицы\",\"ѣ был носовым\",\"ꙗ появился позже\"], a:0, e:\"Отсюда и смешение {ѣко} / {ꙗко} в памятниках.\"},\n  {q:\"{землѣ} вместо {землꙗ} в памятнике — это:\", o:[\"смешение ѣ и ꙗ\",\"ошибка в юсах\",\"падение редуцированных\",\"вторая палатализация\"], a:0, e:\"Пример из лекции.\"}\n ]},\n\n{id:\"sysc\", topic:5, tend:\"r\", title:\"Система согласных старославянского языка\",\n lead:\"Сонорные и шумные; губные, переднеязычные, среднеязычный j, заднеязычные.\",\n news:[\"ф — только в заимствованиях\",\"j передаётся йотированными буквами\",\"плавные слоговые и неслоговые\"],\n tbl:\"c\", c:{\"ф\":[\"только в заимствованиях\"]},\n from:[{id:\"jot\",why:\"мягкие из сочетаний с j\"},{id:\"pal1\",why:\"шипящие\"},{id:\"pal2\",why:\"свистящие\"},{id:\"pal3\",why:\"свистящие\"},{id:\"trt\",why:\"слоговые плавные\"}],\n to:[{id:\"soft\",why:\"мягкие и полумягкие\"}],\n body:`<p>Итоговая система согласных — таблица справа (по лекции). Каждая ячейка помнит, на каком этапе появился звук.<\/p>\n<ol>\n<li>Звук {ф} употреблялся только в заимствованных словах; первоначально в славянских языках такого звука не было: {Филипъ}, {финикъ}.<\/li>\n<li>Звук {j} передавался в старославянском при помощи йотированных букв ({ѥ, ꙗ, ю, ѩ, ѭ}), если они стояли в начале слова или после гласных: {моѥ}.<\/li>\n<li>Плавные {р} и {л} могли быть и слоговыми, и неслоговыми. Если после р или л следует любой гласный, кроме {ь} или {ъ}, плавные неслоговые. Труднее определить роль плавного в сочетаниях {рь, ръ, ль, лъ} между согласными: её выясняют сравнением с русским — {кръвь} — _кровь_, {сльза} — _слеза_ (неслоговые) и {грътань} — _гортань_, {влъкъ} — _волк_, {дльгъ} — _долг_ (слоговые).<\/li>\n<\/ol>\n<details class=\"ex\"><summary>Сонорные, шумные, аффрикаты, «сложные»<\/summary><p><b>Сонорные<\/b> — с преобладанием голоса ({м, н, р, л, j}). <b>Шумные<\/b> — с преобладанием шума: взрывные ({п, б, т, д, к, г}) — смычка и взрыв; щелевые ({в, ф, з, с, ж, ш, х}) — трение в щели; аффрикаты ({ц, ч, ѕ}) — смычка, переходящая в щель. «Сложные» {шт, жд} — сочетания, которые в старославянском вели себя как один звук (результат tj, dj и др.).<\/p><\/details>\n<details class=\"ex\"><summary>Откуда каждый мягкий согласный<\/summary><p>{ч, ж, ш} — сочетания с j и первая палатализация; {ц, ѕ, с’} — вторая и третья; {шт, жд} — tj, dj, stj, zdj, skj, zgj, а также ск, зг, кт, гт перед гласными переднего ряда; {р’, л’, н’} — rj, lj, nj. Нажмите на звук в таблице — источники перечислены там.<\/p><\/details>`,\n ru:[[\"{кръвь}\",\"_кровь_\",\"ръ — неслоговой\"],[\"{влъкъ}\",\"_волк_\",\"лъ — слоговой\"],[\"{Филипъ}\",\"_Филипп_\",\"ф — в заимствованиях\"]],\n tasks:[\n  {q:\"Где употреблялся {ф}?\", o:[\"только в заимствованных словах\",\"во всех словах\",\"только в глаголице\",\"только после гласных\"], a:0, e:\"Первоначально такого звука в славянских языках не было.\"},\n  {q:\"Плавный в {дльгъ} (рус. _долг_):\", o:[\"слоговой\",\"неслоговой\"], a:0, e:\"Гласный в русском перед плавным — слоговой.\"},\n  {q:\"Как передавался {j}?\", o:[\"йотированными буквами в начале слова и после гласных\",\"особой буквой j\",\"буквой и\",\"никак\"], a:0, e:\"{моѥ}, {ѥда}.\"},\n  {q:\"Какие звуки — аффрикаты?\", o:[\"{ц, ч, ѕ}\",\"{шт, жд}\",\"{с, з}\",\"{к, г}\"], a:0, e:\"Смычка, переходящая в щель.\"}\n ]},\n\n{id:\"soft\", topic:5, tend:\"r\", title:\"Мягкие и полумягкие согласные\",\n lead:\"Мягкие по природе, полумягкие — перед гласными переднего ряда; заднеязычные — только твёрдые.\",\n news:[\"мягкие по природе\",\"полумягкие — по позиции\",\"заднеязычные — только твёрдые\"],\n tbl:\"c\", cMark:[\"ш\",\"ж\",\"ч\",\"шт\",\"жд\",\"ц\",\"ѕ\",\"j\",\"р’\",\"л’\",\"н’\",\"с’\"],\n from:[{id:\"sysc\",why:\"состав согласных\"},{id:\"pal1\",why:\"к, г, х ушли из позиции перед гласными переднего ряда\"},{id:\"jot\",why:\"мягкие р’, л’, н’\"}],\n to:[{id:\"consalt\",why:\"{другъ} — {друже} — {друзи}\"}],\n body:`<p>Согласные старославянского различались по степени мягкости: <b>твёрдые, полумягкие и мягкие<\/b>.<\/p>\n<p><b>Мягкие<\/b> были мягкими по природе, независимо от следующего гласного; образовывались при поднятой к нёбу (лат. palatum) средней части языка, отчего получили название <b>палатальных<\/b>: {ш, ж, ч, шт (щ), жд, ц, ѕ (dz’), j, р’, л’, н’, с’}. По твёрдости-мягкости были противопоставлены только {р’, л’, н’, с’} — {р, л, н, с}.<\/p>\n<p><b>Полумягкие.<\/b> Остальные согласные смягчались только перед гласными переднего ряда {и, е, ѣ, ѧ, ь}: {рабъ} — {раб˙и}, {дъва} — {дъв˙ѣ}. Они не достигали мягкости исконно мягких. Полумягкими были и р, л, н, с перед гласными переднего ряда, отличаясь по артикуляции от мягких р’, л’, н’, с’.<\/p>\n<p><b>Заднеязычные<\/b> были возможны только твёрдые. В заимствованиях они получали позиционное смягчение (полумягкие): {кедръ}, {легеонъ}, {архиереи}. В собственно славянских словах такие сочетания были невозможны: перед гласными переднего ряда к, г, х чередовались с шипящими или свистящими: {другъ} — {друже} (зв. п.), {друзи} (им. п. мн. ч.).<\/p>\n<details class=\"ex\"><summary>Почему в исконных словах нет ке, ги, хѣ?<\/summary><p>Это прямое следствие темы 4: все сочетания заднеязычных с гласными переднего ряда устранены тремя палатализациями. Поэтому ке, ги, хи встречаются только в заимствованиях, пришедших позже: {кедръ}, {архиереи}.<\/p><\/details>\n<details class=\"ex\"><summary>Мягкий и полумягкий — в чём разница<\/summary><p>Мягкий (р’) мягок всегда, даже перед а, о, у ({вечерꙗ}, {велѭ}), и противопоставлен твёрдому р — это разные фонемы. Полумягкий — лишь слегка смягчённый вариант твёрдого перед гласным переднего ряда; самостоятельной фонемой он не был.<\/p><\/details>`,\n ru:[[\"{другъ} — {друже} — {друзи}\",\"_друг — дружеский — друзья_\",\"г // ж // з\"],[\"{кедръ}\",\"_кедр_\",\"заимствование: к перед е возможен\"]],\n tasks:[\n  {q:\"Какие согласные противопоставлены по твёрдости-мягкости?\", o:[\"р — р’, л — л’, н — н’, с — с’\",\"все согласные\",\"только заднеязычные\",\"никакие\"], a:0, e:\"Так в лекции.\"},\n  {q:\"{раб˙и}: б здесь\", o:[\"полумягкий\",\"мягкий\",\"твёрдый\",\"носовой\"], a:0, e:\"Смягчение перед гласным переднего ряда — позиционное.\"},\n  {q:\"Почему возможно сочетание ке в {кедръ}?\", o:[\"это заимствование\",\"это след первой палатализации\",\"е здесь из ѣ\",\"к здесь мягкий по природе\"], a:0, e:\"В исконных словах такие сочетания устранены палатализациями.\"}\n ]},\n\n/* ================= ТЕМА 6 ================= */\n{id:\"pos\", topic:6, tend:\"r\", title:\"Редуцированные: сильная и слабая позиция\",\n lead:\"ъ и ь были короче краткого гласного; в одних позициях усиливались, в других ослабевали.\",\n news:[\"сильная: как полные гласные\",\"слабая: со временем исчезают\",\"счёт от конца слова\"],\n tbl:\"v\", vMark:[\"ъ\",\"ь\"],\n from:[{id:\"qq\",why:\"ъ, ь — из ŭ, ĭ\"},{id:\"sysv\",why:\"место ъ, ь в системе\"}],\n to:[{id:\"tense\",why:\"особый случай — перед j\"},{id:\"fall\",why:\"что стало с ними в X–XI вв.\"}],\n body:`<p>Гласные {ъ} (ер) и {ь} (ерь) отличались от остальных <b>количеством<\/b>: произносились короче обычного краткого гласного. Количественная редукция могла усиливаться или ослабевать в зависимости от положения в слове: при ослаблении редукции (<b>сильная позиция<\/b>) они могли достигать степени гласных полного образования, при усилении (<b>слабая позиция<\/b>) ослабевали настолько, что со временем полностью утрачивались.<\/p>\n<div class=\"twocol\">\n<div><h4>Сильная позиция<\/h4><ol type=\"а\">\n<li><b>под ударением — всегда<\/b>, даже перед слогом с полным гласным: {ть́мьнъ}, {ръ́пътъ}, {дъ́скѫ}, {ль́гъкъ}, {ть́щѫ} (в. п. ед. ч.);<\/li>\n<li>в слоге перед слогом с редуцированным в слабой позиции: {пѣсъкъ}, {отьць}, {дьнь};<\/li>\n<li>в ударных односложных словах — <b>всегда<\/b>: {нъ} (но), {тъ} (тот), {сь} (этот).<\/li><\/ol><\/div>\n<div><h4>Слабая позиция<\/h4><ol type=\"а\">\n<li>на конце неодносложных слов: {рабъ}, {сынъ}, {гость}, {идетъ};<\/li>\n<li>в слоге перед слогом с гласным полного образования: {мъного}, {дъва}, {къто}, {чьто};<\/li>\n<li>в слоге перед слогом с редуцированным в сильной позиции: {чьтьць};<\/li>\n<li>в безударных односложных словах (предлогах) — <b>как правило<\/b>: {къ тебѣ}, {въ селѣ}. Исключение: если в первом слоге следующего слова слабый редуцированный, ер предлога сильный — {къ мьнѣ} (_ко мне_), {въ сънѣ} (_во сне_).<\/li><\/ol><\/div>\n<\/div>\n<div data-w=\"havlik\"><\/div>\n<details class=\"ex\"><summary>Почему в {дъскѫ} ъ сильный, хотя дальше полный гласный?<\/summary><p>Это правило (а) сильной позиции: ер под ударением сильный всегда, остальные правила для него не действуют. Русский подтверждает: _доску_ (ъ > о). Так же {тьщѫ} — _тёщу_, {льгъкъ} — _лёгок_, {ръпътъ} — _ропот_.<\/p><\/details>\n<details class=\"ex\"><summary>Предлог и следующее слово — одно фонетическое слово<\/summary><p>Предлоги {къ, въ, съ, отъ} не имели своего ударения и произносились вместе со следующим словом. Поэтому позицию их ера определяют по первому слогу этого слова. В {къ тебѣ} дальше полный гласный е — ер слабый: _к тебе_. В {къ мьнѣ} дальше слабый ь (перед полным ѣ) — ер предлога сильный: _ко мне_. Так у Ивановой (с. 60) и Ремнёвой (§ 34, с. 74–75). Ударные {нъ, тъ, сь} — исключение: в них ер сильный всегда.<\/p><\/details>\n<details class=\"ex\"><summary>«Под ударением» или «в начальном слоге под ударением»?<\/summary><p>На слайде лекции и у Ивановой (с. 60) — «в начальном слоге под ударением»; у Камчатнова (с. 35) и Ремнёвой (§ 34) — просто «под ударением». Примеры у всех одни и те же — ударный ер в первом слоге ({дъ́скѫ}, {ть́щѫ}, {ръ́пътъ}). Смысл правила: ударение отменяет счёт от конца слова, ударный ер сильный всегда.<\/p><\/details>\n<details class=\"ex\"><summary>Проверка русским языком<\/summary><p>Сильный ъ даёт в русском о, сильный ь — е (ё); слабые исчезают: {сънъ} — _сон_, {съна} — _сна_; {отьць} — _отец_, {отьца} — _отца_; {чьтьць} — _чтец_.<\/p><\/details>`,\n ru:[[\"{сънъ} — {съна}\",\"_сон — сна_\",\"сильный ъ > о, слабый исчезает\"],[\"{дьнь} — {дьне}\",\"_день — дня_\",\"сильный ь > е\"],[\"{чьтьць}\",\"_чтец_\",\"слабый — сильный — слабый\"],[\"{пѣсъкъ}\",\"_песок_\",\"ъ перед слабым — сильный\"]],\n tasks:[\n  {t:\"pos\", w:\"сънъ\", ans:[\"s\",\"w\"], ru:\"сон\", e:\"Конечный ъ — слабый (а); ъ перед слогом со слабым — сильный (б). Рус. _сон_.\"},\n  {t:\"pos\", w:\"чьтьць\", ans:[\"w\",\"s\",\"w\"], ru:\"чтец\", e:\"Конечный ь слабый; второй ь перед слабым — сильный; первый перед сильным — слабый (в). Рус. _чтец_.\"},\n  {t:\"pos\", w:\"жьньць\", ans:[\"w\",\"s\",\"w\"], ru:\"жнец\", e:\"Та же схема, что в {чьтьць}: слабый — сильный — слабый. Рус. _жнец_.\"},\n  {t:\"pos\", w:\"мъного\", ans:[\"w\"], ru:\"много\", e:\"Перед слогом с полным гласным — слабый (б). Рус. _много_.\"},\n  {q:\"Почему в {дъскѫ} ъ в сильной позиции?\", o:[\"ер под ударением — сильный всегда\",\"перед слабым редуцированным\",\"это односложное слово\",\"ъ стоит на конце\"], a:0, e:\"Правило (а): ударение отменяет счёт от конца; рус. _доску_.\"},\n  {q:\"Ер в предлоге {къ тебѣ}:\", o:[\"слабый — дальше слог с полным гласным\",\"сильный — предлог однослож

rgin-bottom:4px}\n.term dd{margin:0;font-size:15.5px;line-height:1.5}\n.term .ex{font-family:var(--font-ui);font-size:13px;color:var(--muted);margin-top:8px}\n.term .ex .link{font-family:var(--font-ui);font-size:13px;color:var(--muted)}\n.qa{max-width:780px;display:grid;gap:8px}\n.qa details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}\n.qa summary{cursor:pointer;padding:13px 16px;font-weight:600;font-size:16.5px;line-height:1.4;list-style:none;display:grid;grid-template-columns:2rem 1fr auto;gap:6px;align-items:baseline}\n.qa summary::-webkit-details-marker{display:none}\n.qa summary .no{font-family:var(--font-ui);font-size:13px;font-weight:700;color:var(--kinovar)}\n.qa summary .pm{font-family:var(--font-ui);color:var(--muted);font-weight:400}\n.qa details[open] summary .pm{transform:rotate(45deg)}\n.qa .ans{padding:0 16px 14px calc(16px + 2rem + 6px);font-size:15.5px}\n@media (max-width:480px){.qa .ans{padding-left:16px}}\n.qa .ans p{margin:0 0 8px}\n.qa-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}\n\n/* тетрадь */\n.nb-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}\n.nb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;max-width:780px;font-size:16px;line-height:1.65;\n  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.65em - 1px),color-mix(in srgb,var(--lazur) 14%,transparent) calc(1.65em - 1px),color-mix(in srgb,var(--lazur) 14%,transparent) 1.65em);background-position:0 26px}\n@media (max-width:560px){.nb{padding:18px}}\n.nb h4{font-size:16px;font-weight:700;margin:1.65em 0 0;line-height:1.65;text-transform:uppercase;letter-spacing:.03em}\n.nb h4:first-child{margin-top:0}\n.nb p{margin:0}\n.nb .t{color:var(--kinovar);font-weight:700}\n.nb ol,.nb ul{margin:0;padding-left:1.3em}\n.src.enc{color:var(--lazur);border-color:color-mix(in srgb,var(--lazur) 50%,transparent)}\n.prov{display:grid;gap:4px;margin:8px 0 10px;padding:9px 12px;border-left:2px solid color-mix(in srgb,var(--kinovar) 45%,var(--line));background:color-mix(in srgb,var(--kinovar) 4%,transparent);border-radius:0 6px 6px 0;font-size:15px;line-height:1.45}\n.prov div{display:grid;grid-template-columns:8.6rem minmax(0,1fr);gap:10px}\n.prov dt{font-family:var(--font-ui);font-size:12.5px;font-weight:600;color:var(--muted);padding-top:2px}\n.prov dd{margin:0;min-width:0}\n@media (max-width:560px){.prov div{grid-template-columns:1fr;gap:0}}\n.pvl+.pvl{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}\n.later-pv{display:block;font-family:var(--font-ui);font-size:13px;color:var(--muted);margin-top:2px}\n.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--font-ui);font-size:14px;padding:9px 16px;border-radius:8px;z-index:50}\n.sel-text{width:100%;min-height:200px;font-family:var(--font-ui);font-size:13px;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:10px}\n<\/style>\n\n<header class=\"wrap masthead\">\n  <div class=\"eyebrow\">Старославянский язык · к практическому занятию 5 октября<\/div>\n  <h1><span class=\"ini\">С<\/span>тарославянские памятники<\/h1>\n  <p class=\"lede\">Конспект параграфа по учебнику <b>М. Л. Ремнёвой «Старославянский язык»<\/b> (М., 2004, с. 55–69). Всё, чего нет у Ремнёвой, взято у Т. А. Ивановой (СПб., 1998) и А. М. Камчатнова (2009) и помечено значком <span class=\"src\">Ив.<\/span> или <span class=\"src\">Камч.<\/span> Где, кем создан памятник и откуда вывезен — у каждого памятника; чего нет в учебниках, взято из Православной энциклопедии <span class=\"src enc\">ПЭ<\/span>, Большой российской энциклопедии <span class=\"src enc\">БРЭ<\/span> и Википедии <span class=\"src enc\">Вики<\/span>.<\/p>\n<\/header>\n\n<nav class=\"tabs\" aria-label=\"Разделы\">\n  <div class=\"wrap tabs-in\" role=\"tablist\" id=\"tabs\">\n    <button class=\"tab\" role=\"tab\" data-tab=\"konspekt\">Конспект<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"spisok\">Памятники<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"kartochka\">Карточка<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"trenazher\">Тренажёр<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"vremya\">Время и место<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"glossariy\">Глоссарий<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"voprosy\">Вопросы<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"tetrad\">В тетрадь<\/button>\n  <\/div>\n<\/nav>\n\n<main class=\"wrap\">\n  <\!-- 1. Конспект -->\n  <section class=\"panel\" id=\"p-konspekt\" role=\"tabpanel\">\n    <div class=\"read\">\n      <h2>Конспект параграфа<\/h2>\n      <p class=\"panel-intro\">§ 26–28. Название памятника открывает его карточку.<\/p>\n\n      <h3><span class=\"par\">§ 26<\/span> Общие сведения<\/h3>\n      <div class=\"def\">\n        <div class=\"lbl\">Определение<\/div>\n        <p class=\"q\">«Условно старославянскими памятниками мы называем памятники, созданные до 1100 г. Главным критерием такого приурочения является правильное употребление носовых гласных („юсов“)».<\/p>\n      <\/div>\n      <ul class=\"facts\">\n        <li><span class=\"k\">Время<\/span><span>Сохранились памятники X и главным образом XI в. Первые тексты, созданные Кириллом, Мефодием и их учениками во II половине IX в., <b>не сохранились<\/b>.<\/span><\/li>\n        <li><span class=\"k\">Черты языка<\/span><span>Уже в этих памятниках есть целый ряд черт, свойственных южным, западным и восточным славянам.<\/span><\/li>\n        <li><span class=\"k\">Центры<\/span><span>Основные центры, где создавались памятники, — <b>Македония<\/b> и <b>Восточная Болгария<\/b>.<\/span><\/li>\n        <li><span class=\"k\">Материал<\/span><span>Написаны чернилами на <b>пергамене<\/b> — специально выделанной коже. Две азбуки: <b>глаголица<\/b> и <b>кириллица<\/b>.<\/span><\/li>\n        <li><span class=\"k\">Содержание<\/span><span>Самые ранние памятники (X–XI вв.) — церковные тексты, в основном Евангелия (от греч. «благая весть»):\n          <b>четвероевангелия (тетры)<\/b> — повествование четырёх евангелистов (Матфея, Марка, Луки, Иоанна), первые четыре книги Нового завета;\n          <b>служебные Евангелия (апракосы)<\/b> — отрывки в порядке недельных чтений при церковной службе.\n          Также Псалтирь, евхологии (сборники молитв на разные случаи), требники, Четьи-минеи (фрагменты), патерики, сборники поучений.<\/span><\/li>\n        <li><span class=\"k\">Зачем изучать<\/span><span>Сопоставление старославянских памятников с памятниками других славянских народов, с редакциями церковнославянского языка и с современными славянскими языками позволяет реконструировать фонетическую и морфологическую систему старославянского языка и особенности оригиналов, созданных Первоучителями и их ближайшими учениками.<\/span><\/li>\n      <\/ul>\n\n      <h3><span class=\"par\">§ 27<\/span> Глаголические памятники<\/h3>\n      <div id=\"k-glag\"><\/div>\n\n      <h3><span class=\"par\">§ 28<\/span> Кириллические памятники<\/h3>\n      <p>Старейшие кириллические памятники — <b>надписи на могильных плитах<\/b>. Их появление, по-видимому, служит знаком распространённости кириллического письма.<\/p>\n      <div id=\"k-cyr\"><\/div>\n      <p class=\"note\">Большинство этих текстов издано в 1900–1906 гг. в Петербурге в серии «Памятники старославянского языка». Памятники, связанные с деятельностью Константина и Мефодия, собрал П. А. Лавров в книге «Материалы по истории возникновения древнейшей славянской письменности» (1930).<\/p>\n\n      <h3><span class=\"par\">§ 28<\/span> Памятники других редакций<\/h3>\n      <p>Это уже не старославянские, а церковнославянские памятники: в них отражены черты живой речи восточных славян, чехов или языковые процессы, которых в XI в. ещё не было.<\/p>\n      <div id=\"k-later\"><\/div>\n    <\/div>\n  <\/section>\n\n  <\!-- 2. Список -->\n  <section class=\"panel\" id=\"p-spisok\" role=\"tabpanel\" hidden>\n    <h2>Список памятников<\/h2>\n    <p class=\"panel-intro\">Выбери памятник, чтобы открыть его карточку.<\/p>\n    <div id=\"list\"><\/div>\n  <\/section>\n\n  <\!-- 3. Карточка -->\n  <section class=\"panel\" id=\"p-kartochka\" role=\"tabpanel\" hidden>\n    <div id=\"card\"><\/div>\n  <\/section>\n\n  <\!-- 4. Тренажёр -->\n  <section class=\"panel\" id=\"p-trenazher\" role=\"tabpanel\" hidden>\n    <h2>Тренажёр<\/h2>\n    <p class=\"panel-intro\">Тест строится из фактов Ремнёвой: азбука, датировка, содержание, место хранения, кто нашёл, сколько листов, приметы памятника.<\/p>\n    <div class=\"trainer-top\">\n      <div class=\"seg\" id=\"tmode\" role=\"group\" aria-label=\"Режим\">\n        <button data-mode=\"test\" aria-pressed=\"true\">Тест<\/button>\n        <button data-mode=\"flash\" aria-pressed=\"false\">Карточки<\/button>\n        <button data-mode=\"match\" aria-pressed=\"false\">Сопоставление<\/button>\n      <\/div>\n      <label class=\"ui muted\" style=\"font-size:14px;display:flex;gap:8px;align-items:center\"><input type=\"checkbox\" id=\"incLater\"> включать памятники других редакций<\/label>\n    <\/div>\n    <div id=\"trainer\"><\/div>\n  <\/section>\n\n  <\!-- 5. Время и место -->\n  <section class=\"panel\" id=\"p-vremya\" role=\"tabpanel\" hidden>\n    <h2>Время и место<\/h2>\n    <p class=\"panel-intro\">Памятники по векам с условной границей 1100 года и места, где рукописи хранятся сейчас.<\/p>\n    <div class=\"legend\">\n      <span><i class=\"dot glag\"><\/i>глаголица<\/span><span><i class=\"dot cyr\"><\/i>кириллица<\/span><span><i class=\"dot later\"><\/i>другие редакции<\/span><span><i class=\"dot lost\"><\/i>не сохранилось<\/span><span><i>курсив<\/i> — дата не из Ремнёвой<\/span>\n    <\/div>\n    <div class=\"tm\">\n      <div><h3>Хронология<\/h3><p class=\"sub\">По векам, внутри века — по времени.<\/p><div id=\"timeline\"><\/div><\/div>\n      <div><h3>Места хранения<\/h3><p class=\"sub\">Сгруппировано по городам.<\/p><div id=\"storage\"><\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <\!-- 6. Глоссарий -->\n  <section class=\"panel\" id=\"p-glossariy\" role=\"tabpanel\" hidden>\n    <h2>Глоссарий<\/h2>\n    <p class=\"panel-intro\">Термины параграфа с примерами памятников. Пометка «общ.» означает общепринятое определение, которого нет в учебниках.<\/p>\n    <dl class=\"gloss\" id=\"gloss\"><\/dl>\n  <\/section>\n\n  <\!-- 7. Вопросы -->\n  <section class=\"panel\" id=\"p-voprosy\" role=\"tabpanel\" hidden>\n    <h2>Вопросы к занятию<\/h2>\n    <p class=\"panel-intro\">Вероятные вопросы по содержанию параграфа. Сначала ответь сам, потом открой ответ.<\/p>\n    <div class=\"qa-tools\"><button class=\"btn\" id=\"qaOpen\">Открыть все<\/button><button class=\"btn\" id=\"qaClose\">Свернуть все<\/button><\/div>\n    <div class=\"qa\" id=\"qa\"><\/div>\n  <\/section>\n\n  <\!-- 8. Тетрадь -->\n  <section class=\"panel\" id=\"p-tetrad\" role=\"tabpanel\" hidden>\n    <h2>Версия для тетради<\/h2>\n    <p class=\"panel-intro\">Сжатый конспект, чтобы переписать от руки: по нему можно ответить на вопросы по параграфу. Около четырёх-пяти тетрадных страниц.<\/p>\n    <div class=\"nb-tools\"><button class=\"btn primary\" id=\"nbCopy\">Скопировать текст<\/button><span class=\"ui muted\" style=\"font-size:13.5px\">Старославянские слова копируются обычными буквами.<\/span><\/div>\n    <div class=\"nb\" id=\"nb\"><\/div>\n    <textarea class=\"sel-text\" id=\"nbFallback\" hidden aria-label=\"Текст для копирования\"><\/textarea>\n  <\/section>\n<\/main>\n\n<script>\n/* ===================== ДАННЫЕ ===================== */\n/* {…} — старославянская форма (шрифт-устав). Пункты feats со звёздочкой попадают в конспект. */\nconst M = [\n/* ---------- § 27 Глаголические ---------- */\n{id:\"kiev\", name:\"Киевские листки\", alt:\"Киевский миссал\", alph:\"glag\", group:\"glag\",\n type:\"Отрывок мессы (обедни) по римскому обряду\", typeQ:\"Отрывок обедни по римскому обряду\",\n date:\"X в.\", dateQ:\"X в.\", year:950, cent:10,\n size:\"7 пергаменных листов\", leaves:7,\n origin:\"Вероятно, Моравия; памятник чешской редакции\",\n hist:\"Найден И. И. Срезневским в 1874 г. в библиотеке Киевской духовной академии; попал туда из Иерусалима (пожертвование архимандрита Антонина).\",\n finderQ:\"И. И. Срезневский\",\n store:[{city:\"Киев\", place:\"библиотека Киевской духовной академии\", src:\"Ив\"}],\n ed:\"Лучшее издание — И. В. Ягич, Вена, 1890.\",\n short:\"Отрывок обедни по римскому обряду со службой св. Петру, 7 листов. Самый древний старославянский памятник; написан, вероятно, в Моравии.\",\n feats:[\n  \"*Наиболее древний старославянский памятник: на это указывают язык и палеография (древнейшие начертания ряда глаголических букв — л, м, ъ, ь; параллели есть только в Зографском евангелии).\",\n  \"Правильное употребление ъ и ь — кроме двух написаний {въсѣхъ} вместо {вьсѣхъ} (недосмотр писца).\",\n  \"*Западнославянские черты: вместо щ, жд (из *tj, *dj) — ц и з: {дазь} вместо {даждь}, {обѣцѣниѣ} вместо {обѣщѣниѣ}, {просѧце} вместо {просѧще}.\",\n  \"*Непереведённые латинские термины: {оплата} (oblata), {прѣфации} (praefacio), {мѣша} (missa).\",\n  \"*Не связан непосредственно с Кириллом и Мефодием (они переводили греческие книги); свидетельствует о стремлении части католического духовенства служить по-славянски.\"\n ],\n extra:[\"Иванова: перевод с латинского; хранится в библиотеке Киевской духовной академии. Камчатнов: X в.\"],\n clues:[\"содержит латинские термины {оплата}, {прѣфации}, {мѣша}\",\"найден И. И. Срезневским в 1874 г. в Киеве\"],\n nb:\"7 л., отрывок обедни по римскому обряду (служба св. Петру). Самый древний памятник; чешская редакция, вероятно Моравия. Нашёл И. И. Срезневский (1874) в Киевской духовной академии. Черты: ц, з вместо щ, жд ({дазь} вм. {даждь}), латинские слова ({мѣша}). Не связан прямо с Кириллом и Мефодием. Изд. Ягич, 1890.\"},\n\n{id:\"zograf\", name:\"Зографское евангелие\", alt:\"\", alph:\"glag\", group:\"glag\",\n type:\"Четвероевангелие (тетр)\", typeQ:\"Четвероевангелие (тетр)\",\n date:\"XI в., может быть начало XI в.\", dateQ:\"XI в.\", year:1010, cent:11,\n size:\"304 листа; листы 41–57 вставлены в XII в.\", leaves:304,\n origin:\"Македония; копия с более древнего оригинала\",\n hist:\"Найдено в 1848 г. А. Михановичем; в 1860 г. поднесено Александру II и с тех пор хранится в Публичной библиотеке в Петербурге. Название — от Зографского монастыря на Афоне, где рукопись долго хранилась.\",\n finderQ:\"А. Миханович\",\n store:[{city:\"Санкт-Петербург\", place:\"Российская национальная библиотека\", src:\"Р\"}],\n cityQ:\"Санкт-Петербург, РНБ\",\n ed:\"И. В. Ягич, Берлин, 1879; переиздание — Грац, 1954.\",\n short:\"Глаголическое четвероевангелие, 304 листа: копия с более древнего оригинала, сделанная в Македонии в XI в. Хранится в РНБ (Петербург).\",\n feats:[\n  \"Нет начала, есть пропуски в середине; 17 листов (41–57) написаны в XII в. и заменяют утраченный текст.\",\n  \"*Язык позднее, чем в Киевских листках, но ъ и ь употребляются правильнее, чем в других памятниках.\",\n  \"*Датировка: не X в. (отражены позднейшие фонетические изменения) и не XII в. (нет мены носовых, общей для поздних болгарских памятников).\",\n  \"*Древнее Мариинского: старые начертания букв; ещё различаются ръ, лъ и рь, ль — {бръвь}, {плъть} и {крьстъ}, {пльвати} (в Мариинском уже {кръстити}, {слъзами}).\",\n  \"*Много непереведённых греческих слов: {алавастръ}, {архисинагогъ}, {архитриклинъ}, {игемонъ}, {геена}.\"\n ],\n extra:[\"Иванова: памятник конца X — XI в.; 303 листа. Камчатнов: X–XI в.\"],\n clues:[\"в 1860 г. поднесено Александру II\",\"листы 41–57 в нём вставлены в XII в.\"],\n nb:\"четвероевангелие, 304 л. (л. 41–57 — вставка XII в.). Копия с более древнего оригинала, Македония, XI в. Название — от Зографского монастыря на Афоне. Нашёл А. Миханович (1848), в 1860 г. подарено Александру II; хранится в РНБ. Ъ и ь правильнее, чем в других памятниках; различает ръ/рь, лъ/ль ({крьстъ}); много греческих слов без перевода ({архисинагогъ}). Изд. Ягич, 1879.\"},\n\n{id:\"marin\", name:\"Мариинское евангелие\", alt:\"\", alph:\"glag\", group:\"glag\",\n type:\"Четвероевангелие (тетр)\", typeQ:\"Четвероевангелие (тетр)\",\n date:\"в учебнике Ремнёвой не указана\", dateAlt:\"XI в.\", dateAltSrc:\"Ив\", year:1020, cent:11,\n size:\"173 листа; нет шести первых и двух последних\", leaves:173,\n origin:\"Македония; писец — южный славянин (серб или болгарин)\",\n hist:\"Вывезено В. И. Григоровичем из афонского монастыря Пресвятой Богородицы Марии (отсюда название), где было обнаружено в 1842 г.\",\n finderQ:\"В. И. Григорович\",\n store:[{city:\"Москва\", place:\"Российская государственная библиотека\", src:\"Р\"}],\n cityQ:\"Москва, РГБ\",\n ed:\"И. В. Ягич, Санкт-Петербург, 1883 (со статьёй о языке и полным словарём); Грац, 1960.\",\n short:\"Глаголическое четвероевангелие, 173 листа, написано в Македонии. Вывезено В. И. Григоровичем с Афона; хранится в РГБ (Москва).\",\n feats:[\n  \"*Начертания л, ъ, ь, оу — более поздние, чем в Зографском евангелии.\",\n  \"Лексика близка к Зографскому, но некоторые греческие слова оставлены без перевода: {кринъ}, {сикера}, {миса} (в Зографском соответственно {цвѣтъ сельныи}, {творена кваса}, {гребище}, {блюдо}).\",\n  \"*Редуцированные в сильной позиции заменяются гласными полного образования: {золъ} вместо {зълъ}, {день} вместо {дьнь}.\",\n  \"*Мена ъ и ь в слабой позиции ({вьнѣ}; {дьвѣ}, ср. {дъва}; {зьлѣ}, ср. {зъло}): в речи писца редуцированных уже не было.\",\n  \"*Сохраняет букву ѕ (зело) [d’z’]: {польѕа}, {помоѕи}, {подвиѕати}.\"\n ],\n extra:[\"Иванова: XI в., с некоторыми чертами сербского языка; 172 листа; привезено в 1845 г.\",\"Камчатнов: X–XI в.; найдено Григоровичем в 1845 г.\"],\n clues:[\"сохраняет букву ѕ: {польѕа}, {помоѕи}\",\"вывезено В. И. Григоровичем из афонского монастыря Пресвятой Богородицы\"],\n nb:\"четвероевангелие, 173 л. (нет 6 первых и 2 последних). Македония, писец — серб или болгарин. Вывез В. И. Григорович с Афона (монастырь Пресвятой Богородицы, 1842); хранится в РГБ. Начертания позднее, чем в Зографском; {золъ}, {день} вм. {зълъ}, {дьнь}; мена ъ/ь — редуцированных в речи писца уже нет; сохраняет ѕ ({польѕа}). Изд. Ягич, 1883.\"},\n\n{id:\"cloz\", name:\"Сборник Клоца\", alt:\"Glagolita Clozianus, Клоцов сборник\", alph:\"glag\", group:\"glag\",\n type:\"Сборник поучений и похвальных слов\", typeQ:\"Сборник поучений и похвальных слов\",\n date:\"в учебнике Ремнёвой не указана\", dateAlt:\"XI в.\", dateAltSrc:\"Камч\", year:1040, cent:11,\n size:\"14 листов (12 + 2)\", leaves:14,\n origin:\"По Ивановой — Македония\",\n hist:\"12 листов нашёл словенский филолог В. Копитар в библиотеке графа Клоца в Триденте (изданы в 1836 г.); ещё два листа позднее нашёл Ф. Миклошич в библиотеке в Инсбруке (изданы в 1860 г.).\",\n finderQ:\"В. Копитар\",\n store:[{city:\"Тренто (Тридент)\", place:\"12 листов\", src:\"Ив\"},{city:\"Инсбрук\", place:\"2 листа\", src:\"Ив\"}],\n ed:\"В. Вондрак, Прага, 1893 (полное, с палеографией и словарём); А. Достал, Прага, 1959 (фотокопии всех листов и текст кириллицей); последнее — Любляна.\",\n short:\"Глаголический сборник поучений и похвальных слов, 14 листов. Автором анонимной гомилии из его состава многие учёные считают Мефодия.\",\n feats:[\n  \"*Глаголица более округлой формы, чем хорватская; язык показывает, что глаголица была известна болгарам ещё в очень древнюю эпоху.\",\n  \"*Лексические инновации, которых нет в более древних памятниках: {гробъ} (вместо {жаль}), {трѣбище} (вместо {олътарь}), {испрьва} (вместо {искони}).\",\n  \"*Автор анонимной гомилии (проповеди) из сборника — Мефодий (так считают Гривец, Вайан, Вашица).\",\n  \"Некоторыми чертами языка сближается с Мариинским евангелием.\"\n ],\n extra:[\"Иванова: переписан в Македонии; 12 листов хранятся в Тренто (Триденте), 2 — в Инсбруке. Камчатнов: XI в.\"],\n clues:[\"найден В. Копитаром в библиотеке графа в Триденте\",\"автором гомилии из его состава считают Мефодия\"],\n nb:\"сборник поучений и похвальных слов, 14 л. 12 л. нашёл В. Копитар у графа Клоца в Триденте (изд. 1836), 2 л. — Ф. Миклошич в Инсбруке (1860). Глаголица округлее хорватской. Инновации: {гробъ} вм. {жаль}, {трѣбище} вм. {олътарь}. Автор гомилии — Мефодий (Гривец, Вайан, Вашица). Изд. Вондрак, 1893.\"},\n\n{id:\"assem\", name:\"Ассеманиево евангелие\", alt:\"Ассеманиев кодекс, Ватиканское евангелие\", alph:\"glag\", group:\"glag\",\n type:\"Апракос (служебное евангелие)\", typeQ:\"Апракос (служебное евангелие)\",\n date:\"в учебнике Ремнёвой не указана\", dateAlt:\"XI в.\", dateAltSrc:\"Ив\", year:1040, cent:11,\n size:\"158 листов\", leaves:158,\n origin:\"Македония\",\n hist:\"Привезено в Рим в 1736 г. учёным-ориенталистом патером Иосифом Ассемани из Иерусалима.\",\n finderQ:\"И. Ассемани (вывез, 1736)\",\n store:[{city:\"Ватикан\", place:\"Ватиканская библиотека\", src:\"Р\"}],\n cityQ:\"Ватикан, Ватиканская библиотека\",\n ed:\"Рачки, 1865 (глаголицей, с введением И. В. Ягича); Чернчич, 1878 (латиницей); лучшее, фототипическое — И. Вайс и И. Курц, Прага, 1929; И. Курц, 1955 (кириллицей).\",\n short:\"Глаголический апракос, 158 листов, создан в Македонии. В 1736 г. И. Ассемани привёз его из Иерусалима в Рим; хранится в Ватиканской библиотеке.\",\n feats:[\n  \"Апракос — сборник евангельских чтений по христианскому календарю.\",\n  \"*На полях — кириллические записи XII–XIII вв. и позднее; интересны записи о «злых днях» каждого месяца (статья М. Н. Сперанского).\",\n  \"*И начертания букв, и язык — более поздние, чем в Киевском миссале и Зографском евангелии.\"\n ],\n extra:[\"Иванова: XI в., Македония. Лучшее издание — Вайс и Курц, т. 1–2, Прага, 1929–1955.\"],\n clues:[\"привезено в Рим в 1736 г. из Иерусалима\",\"на его полях — записи о «злых днях» каждого месяца\"],\n nb:\"апракос, 158 л., Македония. Привёз в Рим из Иерусалима патер И. Ассемани (1736); хранится в Ватиканской библиотеке. На полях — кириллические записи XII–XIII вв. о «злых днях». Начертания и язык позднее, чем в Киевских листках и Зографском. Изд. Вайс и Курц, 1929.\"},\n\n{id:\"sinps\", name:\"Синайская псалтирь\", alt:\"\", alph:\"glag\", group:\"glag\",\n type:\"Псалтирь\", typeQ:\"Псалтирь\",\n date:\"в учебнике Ремнёвой не указана\", dateAlt:\"XI в.\", dateAltSrc:\"Ив\", year:1050, cent:11,\n size:\"177 листов, 137 псалмов\", leaves:177,\n origin:\"По Ивановой — Македония\",\n hist:\"Находится в монастыре св. Екатерины на горе Синай, откуда и название.\",\n store:[{city:\"Синай\", place:\"монастырь св. Екатерины\", src:\"Р\"}],\n cityQ:\"Синай, монастырь св. Екатерины\",\n ed:\"Лучшее — С. Северьянов, Пг., 1922; переиздание — Грац, 1954.\",\n short:\"Глаголическая псалтирь, 137 псалмов на 177 листах; хранится в монастыре св. Екатерины на Синае. По содержанию и языку связана с кирилло-мефодиевской традицией.\",\n feats:[\n  \"Псалтирь — книга псалмов, одна из книг Ветхого завета: 150 песен, а по греческой и славянской Библии — 151. Автором обычно считают царя Давида.\",\n  \"Поэтический сборник: псалмы сложены по правилам еврейской поэзии, то есть на синтаксическом параллелизме.\",\n  \"*Считается, что Псалтирь перевёл на старославянский сам Мефодий (IX в.); в древнерусских списках она известна с XI в., впервые напечатана по-славянски в Кракове в 1491 г.\",\n  \"Входила в каждое богослужение; в Древней Руси — основная книга для обучения грамоте.\",\n  \"*По содержанию и особенностям языка связана с кирилло-мефодиевской традицией.\"\n ],\n extra:[\"Иванова: XI в., написана в Македонии.\"],\n clues:[\"содержит 137 псалмов на 177 листах\"],\n nb:\"137 псалмов, 177 л.; хранится в монастыре св. Екатерины на Синае. Псалтирь — книга Ветхого завета (150/151 псалом, автор — царь Давид), переведена, как считается, Мефодием. Памятник связан с кирилло-мефодиевской традицией. Изд. Северьянов, 1922.\"},\n\n{id:\"euch\", name:\"Синайский требник\", alt:\"Синайский евхологий\", alph:\"glag\", group:\"glag\",\n type:\"Евхологий (требник, молитвенник)\", typeQ:\"Евхологий (требник)\",\n date:\"в учебнике Ремнёвой не указана; оригинал — моравско-паннонского периода\", dateAlt:\"XI в.\", dateAltSrc:\"Ив\", year:1050, cent:11,\n size:\"106 листов\", leaves:106,\n origin:\"Оригинал создан, вероятно, в моравско-паннонский период\",\n hist:\"Назван по монастырю св. Екатерины на Синае. Три листа вывезли с Синая П. Успенский и Н. Крылов в 1853 г.; их издал И. И. Срезневский в серии «Древние глаголические памятники» (СПб., 1866).\",\n finderQ:\"П. Успенский и Н. Крылов (3 листа)\",\n store:[{city:\"Синай\", place:\"монастырь св. Екатерины, основная часть\", src:\"Ив\"},{city:\"Санкт-Петербург\", place:\"РНБ, 4 листа\", src:\"Ив\"}],\n ed:\"Первое — Гейтлер, Загреб, 1882 (поправки И. В. Ягича); лучшее — Р. Нахтигал, Любляна, 1941–1942.\",\n short:\"Глаголический евхологий, 106 листов — самый старый славянский молитвенник. Есть переводы не только с греческого, но и с немецкого и латинского: оригинал восходит к моравско-паннонскому периоду.\",\n feats:[\n  \"Евхологий (греч. «молитвенник») — книга молитв и треб, то есть церковных служб на разные случаи жизни.\",\n  \"*Самый старый славянский молитвенник.\",\n  \"*В основном перевод с греческого, но некоторые части переведены с немецкого и латинского; вероятно, оригинал создан в моравско-паннонский период.\"\n ],\n extra:[\"Иванова: XI в., переписан с моравско-паннонского оригинала в Македонии; основная часть — на Синае, 4 листа — в РНБ (Петербург).\"],\n clues:[\"самый старый славянский молитвенник\",\"в нём есть переводы с немецкого и латинского\"],\n nb:\"евхологий (молитвы и требы), 106 л. Самый старый славянский молитвенник. Переводы с греческого, а частично с немецкого и латинского — оригинал моравско-паннонского периода. 3 л. вывезли с Синая П. Успенский и Н. Крылов (1853). Изд. Нахтигал, 1941–1942.\"},\n\n{id:\"ohrid\", name:\"Охридские листки\", alt:\"\", alph:\"glag\", group:\"glag\",\n type:\"Отрывки евангелия\", typeQ:\"Отрывки евангелия\",\n date:\"вероятно, конец XI — может быть, начало XII в.\", dateQ:\"конец XI — нач. XII в.\", year:1095, cent:11,\n size:\"полтора листа\",\n origin:\"—\",\n hist:\"Найдены В. И. Григоровичем в Охриде.\",\n finderQ:\"В. И. Григорович\",\n store:[{city:\"Одесса\", place:\"\", src:\"Р\"}],\n cityQ:\"Одесса\",\n ed:\"Лучшее — «Памятники старославянского языка» (Ч. 3. Вып. 2. Пг., 1915).\",\n short:\"Полтора листа глаголических отрывков евангелия; найдены В. И. Григоровичем в Охриде, хранятся в Одессе.\",\n feats:[\"*Полтора листа — отрывки из евангелия XI в.; рукопись, вероятно, конца XI — может быть, начала XII в.\"],\n extra:[\"Иванова: XI в., 2 листа, найдены в 1845 г.; хранятся в Одесской государственной научной библиотеке.\"],\n clues:[\"полтора листа отрывков евангелия, хранятся в Одессе\"],\n nb:\"полтора листа отрывков евангелия; конец XI — нач. XII в. Нашёл В. И. Григорович в Охриде; хранятся в Одессе.\"},\n\n{id:\"macglag\", name:\"Македонский глаголический листок\", alt:\"\", alph:\"glag\", group:\"glag\",\n type:\"Листок с отрывком поучения\", typeQ:\"Отрывок из произведения Иоанна Экзарха (предположительно)\",\n date:\"XI в. (по палеографическим данным)\", dateQ:\"XI в.\", year:1050, cent:11,\n size:\"1 лист\",\n origin:\"—\",\n hist:\"Найден В. И. Григоровичем.\",\n finderQ:\"В. И. Григорович\",\n store:[{city:\"Санкт-Петербург\", place:\"Библиотека Российской академии наук\", src:\"Р\"}],\n cityQ:\"Санкт-Петербург, БАН\",\n ed:\"—\",\n short:\"Глаголический листок XI в., найден В. И. Григоровичем; хранится в БАН (Петербург). Предположительно — отрывок из произведения Иоанна, экзарха болгарского.\",\n feats:[\"*Предположительно содержит отрывок из произведения Иоанна, экзарха болгарского; по палеографии — XI в.\"],\n extra:[\"Расхождение. Камчатнов: в листке — отрывок из Слова Ефрема Сирина. Иванова считает его первым из Рыльских листков, а отрывок из Иоанна Экзарха находит в кириллическом Македонском листке. На занятии называй версию Ремнёвой.\"],\n clues:[\"глаголический листок из БАН, предположительно с текстом Иоанна Экзарха\"],\n nb:\"1 л., XI в. Нашёл В. И. Григорович; хранится в БАН (Петербург). Предположительно — отрывок из Иоанна, экзарха болгарского.\"},\n\n/* ---------- § 28 Кириллические ---------- */\n{id:\"dobr\", name:\"Добруджанская надпись\", alt:\"\", alph:\"cyr\", group:\"cyr\", sub:\"Надписи\",\n type:\"Надпись на могильной плите\",\n date:\"943 г.\", dateQ:\"943 г.\", year:943, cent:10,\n size:\"—\",\n origin:\"По мнению Ф. В. Мареша — болгарского происхождения\",\n hist:\"Найдена в Румынии в 1950 г.; прочитана славистом Ф. В. Марешем.\",\n store:[],\n ed:\"—\",\n short:\"Древнейшая из кириллических надписей на могильных плитах: датирована 943 г., найдена в Румынии в 1950 г., прочитана Ф. В. Марешем.\",\n feats:[\"*Древнейшая из надписей на могильных плитах, которые и есть старейшие кириллические памятники.\",\"*Ф. В. Мареш считает её болгарской по происхождению.\"],\n extra:[\"Иванова: камень найден в Добрудже при строительстве канала Дунай — Чёрное море. Надписи малы по объёму и мало дают для изучения языка, зато важны для вопроса о двух азбуках.\"],\n clues:[\"найдена в Румынии в 1950 г., датирована 943 г.\"],\n nb:\"943 г., найдена в Румынии (1950), прочитана Ф. В. Марешем; древнейшая надпись на могильной плите, болгарского происхождения.\"},\n\n{id:\"most\", name:\"Надпись чергубыля Мостича\", alt:\"\", alph:\"cyr\", group:\"cyr\", sub:\"Надписи\",\n type:\"Надпись на могиле\",\n date:\"не датирована; не позднее 960-х гг.\", dateQ:\"около 960-х гг.\", year:965, cent:10,\n origin:\"Болгария\",\n hist:\"Обнаружена в 1952 г. в Болгарии.\",\n store:[],\n ed:\"—\",\n short:\"Надпись на могиле чергубыля Мостича, выполненная не позднее 960-х гг.; обнаружена в 1952 г. в Болгарии. По объёму превосходит большинство древнейших славянских граффити.\",\n feats:[\"*Датировка — по начертаниям букв и содержанию: не позднее 960-х гг.\",\"*По объёму превосходит большинство древнейших славянских граффити.\",\"Упомянуты цари Симеон и Пётр (Пётр правил Болгарией в 927–969 гг.).\"],\n inscr:[\"сьде лежить мо-\",\"стичь чрьгоубы-\",\"лꙗ бывыи при\",\"сѵмеонѣ цр҃и\",\"и при петрѣ цр҃и [о]\",\"с[м]иѭ же десѧ-\",\"ть лѣтъ сы оста-\",\"вивъ чрьгоубль-\",\"ство ї въсе імѣни-\",\"ѥ бысть чрьнори-\",\"зьць і въ томь сь-\",\"врьши жизнь своѭ.\"],\n inscrT:\"«Здесь лежит Мостич, бывший чергубылем при царе Симеоне и при царе Петре. На восьмидесятом году, оставив чергубыльство и всё имение, стал черноризцем и в том завершил жизнь свою». Перевод наш, в учебнике его нет.\",\n extra:[\"Камчатнов: около 60-х гг. X в.\"],\n clues:[\"надпись на могиле сановника, служившего царям Симеону и Петру\"],\n nb:\"не позднее 960-х гг., найдена в Болгарии (1952); надпись на могиле сановника царей Симеона и Петра; больше по объёму, чем большинство древнейших граффити.\"},\n\n{id:\"samuil\", name:\"Надпись царя Самуила\", alt:\"\", alph:\"cyr\", group:\"cyr\", sub:\"Надписи\",\n type:\"Надгробная надпись\",\n date:\"993 г.\", dateQ:\"993 г.\", year:993, cent:10,\n size:\"11 строк; правая сторона плиты отломана\",\n origin:\"Юго-западная Македония\",\n hist:\"Камень поставлен по распоряжению Самуила, царя юго-западной Болгарии и Македонии, у могил умерших членов его семьи. Найден в 1894 г. в селе Герман (юго-западная Македония).\",\n store:[],\n ed:\"—\",\n short:\"Надгробная надпись 993 г., поставленная по распоряжению царя Самуила у могил членов его семьи; 11 строк. Ремнёва называет её старейшим кириллическим памятником с точной датой.\",\n feats:[\"*«Старейший кириллический памятник, имеющий точную датировку — 993 г.»\",\"*Важна палеографически: начертания букв, сделанные в точно известном году, служат исходной точкой при выяснении сравнительной древности кириллических памятников.\",\"Правая сторона плиты отломана, поэтому в надписи есть пробелы.\"],\n warn:\"В том же параграфе Добруджанская надпись датирована 943 г., то есть она старше. Если спросят о старейшей датированной надписи, назови обе даты.\",\n extra:[\"Иванова: надпись на могильной плите родственников царя Самуила, 993 г.\"],\n clues:[\"найдена в селе Герман в 1894 г., 11 строк\"],\n nb:\"993 г., найдена в селе Герман (Македония, 1894); 11 строк, у могил родных царя Самуила. Точно датирована → начертания букв — исходная точка для датировки кириллических рукописей.\"},\n\n{id:\"bitola\", name:\"Битольская надпись\", alt:\"\", alph:\"cyr\", group:\"cyr\", sub:\"Надписи\",\n type:\"Надпись на мраморной плите\",\n date:\"1015–1016 гг.\", dateQ:\"1015–1016 гг.\", year:1015, cent:11,\n size:\"довольно большая по объёму\",\n origin:\"Южная Македония\",\n hist:\"Открыта в 1956 г. в южномакедонском городе Битоле при разборе мечети.\",\n store:[],\n ed:\"Наиболее полная публикация — Й. Заимов (фотоснимок, прорись, выборочное воспроизведение и перевод).\",\n short:\"Датированная надпись 1015–1016 гг. на мраморной плите, открыта в 1956 г. в Битоле при разборе мечети. Ценна исторически: в ней славянское население Балкан впервые названо болгарами.\",\n feats:[\"*Мраморная плита с довольно большой по объёму датированной надписью XI в.\",\"*В ней впервые славянское население Балканского полуострова называется болгарами.\"],\n extra:[],\n clues:[\"в ней впервые славяне Балкан названы болгарами\",\"открыта в 1956 г. при разборе мечети\"],\n nb:\"1015–1016 гг., открыта в Битоле (1956) при разборе мечети; мраморная плита; впервые славяне Балкан названы болгарами. Публикация Й. Заимова.\"},\n\n{id:\"savva\", name:\"Саввина книга\", alt:\"\", alph:\"cyr\", group:\"cyr\", sub:\"Рукописи\",\n type:\"Апракос (служебное евангелие)\", typeQ:\"Апракос (служебное евангелие)\",\n date:\"XI в., может быть начало или первая половина\", dateQ:\"XI в. (начало или 1-я половина)\", year:1020, cent:11,\n size:\"129 листов\", leaves:129,\n origin:\"Восточная Болгария\",\n hist:\"Названа по двум припискам с упоминанием попа Саввы.\",\n store:[{city:\"Москва\", place:\"Российский государственный архив древних актов\", src:\"Р\"}],\n cityQ:\"Москва, РГАДА\",\n ed:\"В. Н. Щепкин, СПб., 1903 («Памятники старославянского языка», т. 1, вып. 2); Грац, 1959. Исследование: В. Н. Щепкин, «Рассуждение о языке Саввиной книги» (1899).\",\n short:\"Кириллический апракос, 129 листов, написан в Восточной Болгарии в XI в. Назван по припискам попа Саввы; хранится в РГАДА (Москва).\",\n feats:[\"Служебное евангелие: фрагменты Евангелия в порядке недельных чтений.\",\"*По орфографии и палеографии — один из ранних кириллических памятников; начертания букв совпадают с надписью Самуила.\",\"*Язык подробно описан в исследовании В. Н. Щепкина «Рассуждение о языке Саввиной книги» (1899).\"],\n extra:[\"Иванова: приписки попа Саввы — на л. 49 и 54. Камчатнов: начало XI в.\"],\n clues:[\"названа по припискам попа\",\"начертания букв в ней совпадают с надписью Самуила\"],\n nb:\"апракос, 129 л., Восточная Болгария, XI в. (нач. или 1-я пол.). Названа по двум припискам попа Саввы; хранится в РГАДА. Один из ранних кириллических памятников, начертания как в надписи Самуила. Изд. Щепкин, 1903.\"},\n\n{id:\"supr\", name:\"Супрасльская рукопись\", alt:\"\", alph:\"cyr\", group:\"cyr\", sub:\"Рукописи\",\n type:\"Мартовская минея\", typeQ:\"Мартовская минея\",\n date:\"первая половина XI в.\", dateQ:\"1-я половина XI в.\", year:1030, cent:11,\n size:\"285 листов\", leaves:285,\n origin:\"Восточная Болгария\",\n hist:\"Найдена в начале XIX в. в Супрасльском монастыре около Белостока (отсюда название). 118 листов поступили в Любляну в 1845 г. вместе с бумагами Копитара; 16 листов купил в 1856 г. академик А. Бычков.\",\n store:[{city:\"Любляна\", place:\"118 листов\", src:\"Р\"},{city:\"Варшава\", place:\"151 лист\", src:\"Р\"},{city:\"Санкт-Петербург\", place:\"РНБ, 16 листов\", src:\"Р\"}],\n cityQ:\"Любляна, Варшава и Санкт-Петербург\",\n ed:\"Лучшее и полное — С. Северьянов, СПб., 1904 («Памятники старославянского языка», т. 2, вып. 1); Грац, 1956.\",\n short:\"Кириллическая мартовская минея, 285 листов, восточноболгарская, первой половины XI в. Найдена в Супрасльском монастыре; разделена между Любляной, Варшавой и Петербургом.\",\n feats:[\"*Минея — книга церковных чтений на все дни месяца: жития святых, легенды о мученичестве и подвижничестве, беседы и слова Иоанна Златоуста, творения отцов церкви — в порядке дней.\",\"*По состоянию языка не может быть отнесена к начальной эпохе славянской письменности.\"],\n extra:[\"Иванова: в Любляне 113 листов (у Ремнёвой 118); новое издание с греческими параллелями — София, 1982–1983.\"],\n clues:[\"мартовская минея, разделённая между тремя городами\",\"найдена около Белостока\"],\n nb:\"мартовская минея (жития, слова Иоанна Златоуста и др. по дням месяца), 285 л., Восточная Болгария, 1-я пол. XI в. Найдена в Супрасльском монастыре у Белостока (нач. XIX в.). Хранение: Любляна 118 л., Варшава 151 л., РНБ 16 л. Изд. Северьянов, 1904.\"},\n\n{id:\"enina\", name:\"Енинский апостол\", alt:\"\", alph:\"cyr\", group:\"cyr\", sub:\"Рукописи\",\n type:\"Апостол (апостольские чтения)\", typeQ:\"Апостол\",\n date:\"XI в. (по мнению издателей)\", dateQ:\"XI в.\", year:1050, cent:11,\n size:\"39 листов, большинство очень плохо сохранилось\", leaves:39,\n origin:\"Болгария; отражает древнеболгарский язык\",\n hist:\"Найден в декабре 1960 г. при реставрации церкви св. Параскевы в селе Енина близ Казанлыка (Болгария).\",\n store:[],\n ed:\"К. Мирчев и Хр. Кодов, София, 1965 (фотографии каждого листа, лингвистическое описание, словник).\",\n short:\"Кириллический сборник апостольских чтений XI в., 39 плохо сохранившихся листов; найден в 1960 г. при реставрации церкви в селе Енина (Болгария).\",\n feats:[\"*Отражает особенности древнеболгарского языка.\"],\n extra:[\"Иванова: до его находки апостол был известен только в поздних списках (Охридский, Слепченский апостолы XII в.); издание датировано 1966 г.\"],\n clues:[\"найден в 1960 г. при реставрации церкви св. Параскевы\"],\n nb:\"апостольские чтения, 39 л. (плохо сохранились), XI в. Найден в 1960 г. при реставрации церкви св. Параскевы в с. Енина (Болгария). Изд. Мирчев и Кодов, 1965.\"},\n\n{id:\"hiland\", name:\"Хиландарские листки\", alt:\"\", alph:\"cyr\", group:\"cyr\", sub:\"Рукописи\",\n type:\"Отрывок поучения Кирилла Иерусалимского\", typeQ:\"Отрывок поучения Кирилла Иерусалимского\",\n date:\"в учебнике Ремнёвой не указана\", dateAlt:\"XI в.\", dateAltSrc:\"Ив\", year:1050, cent:11,\n size:\"по Ивановой — 2 листа\",\n origin:\"По Ивановой — восточноболгарского происхождения\",\n hist:\"Найдены В. И. Григоровичем в Хиландарском монастыре на Афоне.\",\n finderQ:\"В. И. Григорович\",\n store:[{city:\"Одесса\", place:\"\", src:\"Ив\"}],\n ed:\"«Памятники старославянского языка», т. 1, вып. 1, СПб., 1900 (по Ивановой).\",\n short:\"Кириллический отрывок поучения Кирилла Иерусалимского; найдены В. И. Григоровичем в Хиландарском монастыре на Афоне.\",\n feats:[\"*Древнее Листков Ундольского.\"],\n extra:[\"Иванова: XI в., 2 листа, восточноболгарские; хранятся в Одессе.\"],\n clues:[\"отрывок поучения Кирилла Иерусалимского\"],\n nb:\"отрывок поучения Кирилла Иерусалимского; нашёл В. И. Григорович в Хиландарском монастыре на Афоне.\"},\n\n{id:\"undol\", name:\"Листки Ундольского\", alt:\"\", alph:\"cyr\", group:\"cyr\", sub:\"Рукописи\",\n type:\"Отрывки евангелия\", typeQ:\"Отрывки евангелия\",\n date:\"в учебнике Ремнёвой не указана; позднее Хиландарских листков, Саввиной книги и Супрасльской рукописи\", dateAlt:\"XI в.\", dateAltSrc:\"Ив\", year:1070, cent:11,\n size:\"по Ивановой — 2 листа\",\n origin:\"—\",\n hist:\"Принадлежали книголюбу В. М. Ундольскому (отсюда название).\",\n store:[{city:\"Москва\", place:\"РГБ\", src:\"Ив\"}],\n ed:\"Е. Ф. Карский, «Памятники старославянского языка», т. 1, вып. 3, СПб., 1904 (по Ивановой).\",\n short:\"Кириллические отрывки евангелия, принадлежавшие книголюбу В. М. Ундольскому. Памятник более поздний, чем Хиландарские

[\"писцы Иосиф, Тихота, Белослав и ещё один\",\"ПЭ\"]],\n from:[[\"в Битоле книгу продали иеромонаху Даниилу (запись XIII–XIV вв.)\",\"ПЭ\"],[\"к 1698 г. она уже в библиотеке августинского монастыря в Болонье; кто привёз её в Италию, неизвестно\",\"ПЭ\"],[\"ныне — Библиотека Болонского университета\",\"Ив\"]],\n sq:\"Иосиф, Тихота, Белослав\"},\nbittr:{\n where:[[\"по Й. Иванову — село Световраче (Македония)\",\"Вики\"]],\n who:[[\"по Й. Иванову — Георгий Грамматик\",\"Вики\"]],\n from:[[\"в 1898 г. принесена из соседнего села в болгарское торговое агентство в Битоле; в 1907 г. её нашёл там Й. Иванов; ныне — библиотека БАН (София)\",\"Вики\"]]},\nboyan:{\n where:[[\"нижний глаголический слой — вероятно, Западная Болгария, XI в.; верхний кириллический — XIII в.\",\"Вики\"]],\n who:[[\"писцы не названы\",\"\"]],\n from:[[\"из Бояны близ Софии: найдено В. И. Григоровичем в 1845 г.\",\"Ив\"],[\"ныне РГБ (Москва)\",\"Ив\"]]}\n};\n\nM.forEach(m=>{ const p=PROV[m.id]; if(!p) return; m.prov=p; if(p.wq) m.wq=p.wq; if(p.sq) m.sq=p.sq; });\nbyId.savva.finderQ=\"И. И. Срезневский\";\n\n\nconst GLOSS = [\n {t:\"Памятники старославянской письменности\", d:\"Условно — памятники, созданные до 1100 г. Главный критерий — правильное употребление носовых гласных (юсов).\", s:\"Р\"},\n {t:\"Пергамен\", d:\"Специально выделанная кожа, на которой чернилами написаны старославянские памятники.\", s:\"Р\"},\n {t:\"Евангелие\", d:\"(Греч. «благая весть») Повествование о земной жизни Иисуса Христа.\", s:\"Р\", ex:[\"zograf\",\"savva\"]},\n {t:\"Тетр, четвероевангелие\", d:\"Евангелие, содержащее повествования четырёх евангелистов (Матфея, Марка, Луки, Иоанна) — первые четыре книги Нового завета.\", s:\"Р\", ex:[\"zograf\",\"marin\"]},\n {t:\"Апракос, служебное евангелие\", d:\"Отрывки из Евангелия, расположенные в порядке недельных чтений при церковной службе. По Ивановой — от греч. «недельный».\", s:\"Р\", ex:[\"assem\",\"savva\"]},\n {t:\"Псалтирь\", d:\"Книга псалмов, одна из книг Ветхого завета: 150 (по греческой и славянской Библии — 151) песен, автором которых обычно считают царя Давида.\", s:\"Р\", ex:[\"sinps\"]},\n {t:\"Евхологий, требник\", d:\"(Греч. «молитвенник») Книга, содержащая молитвы и требы — церковные службы на разные случаи жизни.\", s:\"Р\", ex:[\"euch\"]},\n {t:\"Минея\", d:\"(От греч. «месяц») Книга церковных чтений на все дни месяца: жития святых, легенды о мученичестве и подвижничестве, беседы, творения отцов церкви. Четьи-минеи предназначены для чтения.\", s:\"Р\", ex:[\"supr\"]},\n {t:\"Апостол\", d:\"Сборник апостольских чтений: деяния и послания апостолов (по Ивановой).\", s:\"Р\", ex:[\"enina\"]},\n {t:\"Миссал\", d:\"Книга для католической мессы (обедни по римскому обряду).\", s:\"общ.\", ex:[\"kiev\"]},\n {t:\"Патерик\", d:\"Сборник рассказов о жизни и подвигах монахов.\", s:\"общ.\"},\n {t:\"Гомилия\", d:\"Проповедь. Анонимную гомилию из Сборника Клоца приписывают Мефодию.\", s:\"Р\", ex:[\"cloz\"]},\n {t:\"Триодь\", d:\"Богослужебная книга с песнопениями периода Великого поста и Пасхи.\", s:\"общ.\", ex:[\"bittr\"]},\n {t:\"Палимпсест\", d:\"Рукопись, написанная по смытому или соскобленному прежнему тексту. Смытых кириллических текстов с глаголицей поверх не найдено.\", s:\"Камч\", ex:[\"boyan\"]},\n {t:\"Редакция (извод)\", d:\"Местный вариант старославянского языка с чертами живой речи писцов: чешская, восточнославянская, среднеболгарская и др. Язык памятников разных изводов называют церковнославянским.\", s:\"Ив\", ex:[\"ostrom\",\"prag\"]},\n {t:\"Юсы\", d:\"Носовые гласные (буквы {ѫ}, {ѧ} и йотированные). Их правильное употребление — главный критерий старославянского памятника; мена носовых — признак поздних болгарских рукописей.\", s:\"Р\", ex:[\"zograf\"]},\n {t:\"Ѕ (зело)\", d:\"Буква для звука [d’z’]; сохраняется, например, в Мариинском евангелии: {польѕа}, {помоѕи}.\", s:\"Р\", ex:[\"marin\"]},\n {t:\"Граффити\", d:\"Надписи, процарапанные на стенах или камне. Надпись Мостича больше по объёму, чем большинство древнейших славянских граффити.\", s:\"общ.\", ex:[\"most\"]},\n {t:\"Чергубыль\", d:\"Высокий придворный титул в Первом Болгарском царстве; его носил Мостич.\", s:\"общ.\", ex:[\"most\"]},\n {t:\"Черноризец\", d:\"Монах (букв. «носящий чёрные ризы»): {бысть чрьноризьць} в надписи Мостича.\", s:\"общ.\", ex:[\"most\"]}\n];\n\nconst QA = [\n {q:\"Какие памятники называют старославянскими?\", a:\"<p>«Условно старославянскими памятниками мы называем памятники, <b>созданные до 1100 г.<\/b>» Главный критерий — <b>правильное употребление носовых гласных (юсов)<\/b>.<\/p><p>Уже в этих памятниках есть черты, свойственные южным, западным и восточным славянам.<\/p>\"},\n {q:\"К какому времени относятся сохранившиеся памятники? Дошли ли до нас тексты Кирилла и Мефодия?\", a:\"<p>Сохранились памятники <b>X и главным образом XI в.<\/b> Первые тексты, созданные Кириллом, Мефодием и их учениками во II половине IX в., <b>не сохранились<\/b>: дошедшие рукописи — более поздние копии (например, Зографское евангелие — копия с более древнего оригинала).<\/p>\"},\n {q:\"Где создавались памятники?\", a:\"<p>Основные центры — <b>Македония<\/b> (Зографское, Мариинское, Ассеманиево евангелия) и <b>Восточная Болгария<\/b> (Саввина книга, Супрасльская рукопись). Киевские листки написаны, вероятно, в Моравии.<\/p>\", links:[\"zograf\",\"savva\",\"kiev\"]},\n {q:\"На чём, чем и какими азбуками написаны памятники?\", a:\"<p>Чернилами на <b>пергамене<\/b> — специально выделанной коже. Две азбуки: <b>глаголица<\/b> и <b>кириллица<\/b>.<\/p>\"},\n {q:\"Каково содержание древнейших памятников?\", a:\"<p>Это церковные тексты, в основном Евангелия: <b>тетры<\/b> (четвероевангелия) и <b>апракосы<\/b> (служебные). Кроме того — Псалтирь, евхологии, требники, Четьи-минеи (фрагменты), патерики, сборники поучений.<\/p>\"},\n {q:\"Чем тетр отличается от апракоса? Приведите примеры.\", a:\"<p><b>Тетр<\/b> (четвероевангелие) — повествования четырёх евангелистов подряд, первые четыре книги Нового завета: Зографское и Мариинское евангелия.<\/p><p><b>Апракос<\/b> (служебное евангелие) — отрывки из Евангелия в порядке недельных чтений при службе: Ассеманиево евангелие, Саввина книга.<\/p>\", links:[\"zograf\",\"marin\",\"assem\",\"savva\"]},\n {q:\"Зачем изучать старославянские памятники в сопоставлении?\", a:\"<p>Сравнение с памятниками других славянских народов, с редакциями церковнославянского языка и с современными славянскими языками позволяет <b>реконструировать<\/b> фонетическую и морфологическую систему старославянского языка и особенности оригиналов, созданных Первоучителями и их ближайшими учениками.<\/p>\"},\n {q:\"Назовите глаголические памятники.\", a:\"<p>Киевские листки, Зографское евангелие, Мариинское евангелие, Сборник Клоца, Ассеманиево евангелие, Синайская псалтирь, Синайский требник (евхологий), Охридские листки, Македонский глаголический листок.<\/p>\"},\n {q:\"Назовите кириллические памятники.\", a:\"<p><b>Надписи:<\/b> Добруджанская (943 г.), Мостича (не позднее 960-х гг.), царя Самуила (993 г.), Битольская (1015–1016 гг.).<\/p><p><b>Рукописи:<\/b> Саввина книга, Супрасльская рукопись, Енинский апостол, Хиландарские листки, Листки Ундольского, Македонский (кириллический) листок.<\/p>\"},\n {q:\"Какой памятник самый древний? Почему его связывают с Моравией?\", a:\"<p><b>Киевские листки<\/b> (Киевский миссал), X в. — древнейшие начертания глаголических букв, правильное употребление ъ и ь.<\/p><p>Моравия и чешская редакция: вместо щ, жд стоят ц, з ({дазь} вместо {даждь}, {просѧце} вместо {просѧще}); непереведённые латинские термины ({оплата}, {прѣфации}, {мѣша}); обедня по римскому обряду. С Кириллом и Мефодием памятник прямо не связан: он говорит о стремлении части католического духовенства служить по-славянски.<\/p>\", links:[\"kiev\"]},\n {q:\"Сравните Зографское и Мариинское евангелия.\", a:\"<p>Оба — глаголические четвероевангелия, написанные в Македонии и найденные на Афоне.<\/p><p><b>Зографское<\/b> древнее: старые начертания букв, правильнее ъ и ь, различаются ръ, лъ и рь, ль ({бръвь}, {крьстъ}). Хранится в РНБ.<\/p><p><b>Мариинское<\/b> позднее: новые начертания; {золъ}, {день} вместо {зълъ}, {дьнь}; мена ъ и ь (редуцированных в речи писца уже нет). Некоторые греческие слова не переведены там, где Зографское их переводит ({кринъ} — {цвѣтъ сельныи}). Сохраняет ѕ. Хранится в РГБ.<\/p>\", links:[\"zograf\",\"marin\"]},\n {q:\"Чем важна надпись царя Самуила?\", a:\"<p>Она точно датирована — <b>993 г.<\/b> Начертания букв, сделанные в известном году, — исходная точка для определения сравнительной древности кириллических памятников (например, с ней совпадают начертания в Саввиной книге). 11 строк, найдена в селе Герман в 1894 г.<\/p><p>Учти: Ремнёва называет её старейшим точно датированным кириллическим памятником, хотя Добруджанская надпись в том же параграфе датирована 943 г.<\/p>\", links:[\"samuil\",\"dobr\",\"savva\"]},\n {q:\"Чем ценна Битольская надпись?\", a:\"<p>Датирована 1015–1016 гг., открыта в 1956 г. в Битоле при разборе мечети. Исторически ценна: в ней <b>впервые славянское население Балканского полуострова названо болгарами<\/b>.<\/p>\", links:[\"bitola\"]},\n {q:\"Какие памятники связывают с Мефодием и кирилло-мефодиевской традицией?\", a:\"<p><b>Синайская псалтирь<\/b>: Псалтирь, как считается, перевёл сам Мефодий, а памятник по содержанию и языку связан с кирилло-мефодиевской традицией.<\/p><p><b>Сборник Клоца<\/b>: автором анонимной гомилии многие учёные (Гривец, Вайан, Вашица) считают Мефодия.<\/p><p><b>Синайский требник<\/b>: его оригинал создан, вероятно, в моравско-паннонский период.<\/p>\", links:[\"sinps\",\"cloz\",\"euch\"]},\n {q:\"Какие памятники нашёл В. И. Григорович и откуда их вывез?\", a:\"<p>Во время поездки по Балканам и Афону в 1844–1847 гг.: <b>Мариинское евангелие<\/b> — с Афона, из монастыря (скита) Пресвятой Богородицы; <b>Хиландарские листки<\/b> — из Хиландарского монастыря на Афоне; <b>Охридские листки<\/b> — из Охрида; <b>Македонский глаголический листок<\/b>. По Ивановой — ещё <b>Боянское евангелие<\/b> из Бояны близ Софии; по справочникам — и <b>Охридский апостол<\/b>.<\/p><p>Теперь они в Москве (РГБ), Одессе и Петербурге (БАН).<\/p>\", links:[\"marin\",\"hiland\",\"ohrid\",\"macglag\",\"boyan\"]},\n {q:\"Откуда и как главные памятники попали туда, где хранятся сейчас?\", a:\"<p><b>С Афона:<\/b> Зографское евангелие монастырь подарил Александру II (1860), оно в РНБ; Мариинское вывез Григорович (РГБ).<\/p><p><b>Из Иерусалима:<\/b> Ассеманиево евангелие привёз в Рим И. Ассемани (1736), теперь оно в Ватикане; Киевские листки подарил Киевской духовной академии архимандрит Антонин (по ПЭ, сам он нашёл их на Синае).<\/p><p><b>С Синая:<\/b> 3 листа Синайского требника вывезли П. Успенский и Н. Крылов (1853); Синайская псалтирь и основная часть требника остались в монастыре св. Екатерины.<\/p><p><b>Из Супрасля:<\/b> Супрасльская рукопись разошлась по Любляне (через Копитара), Варшаве и Петербургу.<\/p><p><b>Из Москвы:<\/b> Саввину книгу И. И. Срезневский нашёл в Типографской библиотеке (Камчатнов); она в РГАДА.<\/p>\", links:[\"zograf\",\"marin\",\"assem\",\"kiev\",\"euch\",\"supr\",\"savva\"]},\n {q:\"В каких памятниках сохранились имена писцов?\", a:\"<p><b>Саввина книга<\/b> — поп Савва (приписки на л. 49 и 54). <b>Остромирово евангелие<\/b> — дьякон Григорий, писал для новгородского посадника Остромира. По справочникам: <b>Изборник 1073 г.<\/b> — дьяк Иоанн, для князя Святослава; <b>Добромирово евангелие<\/b> — поп Добромир; <b>Болонская псалтирь<\/b> — Иосиф, Тихота, Белослав; в <b>Супрасльской рукописи<\/b> есть приписка «Господи, помилуй Ретька» — возможно, имя писца.<\/p><p>У большинства старославянских рукописей имена писцов не сохранились.<\/p>\", links:[\"savva\",\"ostrom\",\"izb\",\"supr\"]},\n {q:\"Какие памятники хранятся в Петербурге?\", a:\"<p><b>РНБ:<\/b> Зографское евангелие, 16 листов Супрасльской рукописи, Остромирово евангелие; по Ивановой — ещё 4 листа Синайского требника.<\/p><p><b>БАН:<\/b> Македонский глаголический листок; по Ивановой — и Македонский кириллический листок.<\/p>\", links:[\"zograf\",\"supr\",\"ostrom\",\"macglag\"]},\n {q:\"Что такое Остромирово евангелие и почему это не старославянский памятник?\", a:\"<p>1056–1057 гг., написано дьяконом Григорием для новгородского посадника Остромира; 294 листа; РНБ. Это <b>самый ранний датированный древнерусский памятник<\/b>: в нём отражены черты живой восточнославянской речи (первый писец пишет {скърбь}, {мьртвъ} вместо {скръбь}, {мрьтвъ}). Поэтому это памятник восточнославянской редакции.<\/p>\", links:[\"ostrom\"]},\n {q:\"Что такое палимпсест? Пример.\", a:\"<p>Рукопись, написанная по смытому или соскобленному тексту. <b>Боянское евангелие<\/b> (XIII в.) написано кириллицей по пергамену, с которого смыто, хотя не везде чисто, глаголическое письмо.<\/p>\", links:[\"boyan\"]},\n {q:\"Что такое среднеболгарские рукописи?\", a:\"<p>Памятники XII–XIV вв. из болгарских областей; в них отражены языковые процессы, которых не было в XI в.: Добромирово евангелие (XII в.), Охридский апостол (конец XII в.), Болонская псалтирь (начало XIII в.), Битольская триодь (XIII в.), Боянское евангелие (XIII в.).<\/p>\"}\n];\n\n/* ===================== УТИЛИТЫ ===================== */\nconst $ = (s,el=document)=>el.querySelector(s);\nconst $$ = (s,el=document)=>[...el.querySelectorAll(s)];\nconst ocs = s => (s||\"\").replace(/\\{([^}]+)\\}/g,'<span class=\"ocs\">$1<\/span>');\nconst plain = s => (s||\"\").replace(/[{}]/g,\"\").replace(/\\*/g,\"\");\nconst shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };\nconst ALPH = {glag:\"Глаголица\", cyr:\"Кириллица\"};\nconst SRC = {\"Ив\":\"Ив.\",\"Камч\":\"Камч.\",\"Р\":\"\",\"общ.\":\"общ.\",\"ПЭ\":\"ПЭ\",\"БРЭ\":\"БРЭ\",\"Вики\":\"Вики\",\"РГБ\":\"РГБ\"};\nconst SRCT = {\"Ив\":\"по Т. А. Ивановой\",\"Камч\":\"по А. М. Камчатнову\",\"общ.\":\"общепринятое\",\"ПЭ\":\"Православная энциклопедия\",\"БРЭ\":\"Большая российская энциклопедия\",\"Вики\":\"Википедия / Рувики\",\"РГБ\":\"каталог Российской государственной библиотеки\"};\nconst srcTag = s => s && s!==\"Р\" && SRC[s] ? `<span class=\"src${[\"ПЭ\",\"БРЭ\",\"Вики\",\"РГБ\"].includes(s)?\" enc\":\"\"}\" title=\"${SRCT[s]}\">${SRC[s]}<\/span>` : \"\";\n/* где, кем, откуда */\nconst PV = {where:\"Где создан\", who:\"Кем создан\", from:\"Откуда вывезен\"};\nconst pvFirst = (m,k) => (m.prov&&m.prov[k]&&m.prov[k][0]) ? m.prov[k][0] : [\"в учебниках не указано\",\"\"];\nconst pvLines = (m,k) => (m.prov&&m.prov[k]&&m.prov[k].length) ? m.prov[k].map(([t,s])=>`<div class=\"pvl\">${t}${srcTag(s)}<\/div>`).join(\"\") : '<span class=\"muted\">в учебниках не указано<\/span>';\nconst pvShort = m => `<dl class=\"prov\">${Object.entries(PV).map(([k,l])=>{const [t,s]=pvFirst(m,k); return `<div><dt>${l}<\/dt><dd>${t}${srcTag(s)}<\/dd><\/div>`;}).join(\"\")}<\/dl>`;\nconst pvPlain = m => Object.entries({where:\"создан\",who:\"кем\",from:\"откуда\"}).map(([k,l])=>l+\": \"+pvFirst(m,k)[0]).join(\"; \");\nconst store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};\nfunction toast(msg){const t=document.createElement(\"div\");t.className=\"toast\";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}\nfunction chipFor(m){\n  if(m.group===\"later\") return `<span class=\"chip later\">${m.red}<\/span>`;\n  return `<span class=\"chip ${m.alph}\">${ALPH[m.alph]}<\/span>`;\n}\nfunction dateText(m){ return m.dateQ || (m.dateAlt ? m.dateAlt : m.date); }\nfunction dateHTML(m){\n  if(m.dateQ) return m.date;\n  if(m.dateAlt) return `${m.date}; ${m.dateAlt}${srcTag(m.dateAltSrc)}`;\n  return m.date;\n}\nfunction storeText(m){ return (m.store||[]).map(s=>s.city+(s.place?\", \"+s.place:\"\")).join(\"; \"); }\nfunction storeHTML(m){\n  if(!m.store||!m.store.length) return '<span class=\"muted\">в учебниках не указано<\/span>';\n  return m.store.map(s=>`${s.city}${s.place?\", \"+s.place:\"\"}${srcTag(s.src)}`).join(\"<br>\");\n}\n\n/* ===================== ВКЛАДКИ ===================== */\nconst TABS=[\"konspekt\",\"spisok\",\"kartochka\",\"trenazher\",\"vremya\",\"glossariy\",\"voprosy\",\"tetrad\"];\nfunction show(tab, scroll=true){\n  if(!TABS.includes(tab)) tab=\"konspekt\";\n  $$(\".tab\").forEach(b=>b.setAttribute(\"aria-selected\", b.dataset.tab===tab));\n  TABS.forEach(t=>{ $(\"#p-\"+t).hidden = t!==tab; });\n  store.set(\"sp-tab\",tab);\n  try{ history.replaceState(null,\"\",\"#\"+tab); }catch(e){}\n  const btn=$(`.tab[data-tab=\"${tab}\"]`), bar=$(\"#tabs\");\n  if(btn&&bar){ const l=btn.offsetLeft-bar.offsetLeft, r=l+btn.offsetWidth; if(l<bar.scrollLeft||r>bar.scrollLeft+bar.clientWidth) bar.scrollLeft=Math.max(0,l-16); }\n  if(scroll){ const top=$(\".masthead\").getBoundingClientRect().bottom + window.scrollY; if(window.scrollY>top) window.scrollTo({top:top}); }\n}\n$(\"#tabs\").addEventListener(\"click\",e=>{const b=e.target.closest(\".tab\"); if(b) show(b.dataset.tab);});\ndocument.addEventListener(\"click\",e=>{\n  const o=e.target.closest(\"[data-open]\"); if(o){ e.preventDefault(); openCard(o.dataset.open); }\n});\n\n/* ===================== 1. КОНСПЕКТ ===================== */\nfunction kItem(m){\n  const key=(m.feats||[]).filter(f=>f.startsWith(\"*\"));\n  const meta=[m.dateQ||m.dateAlt?`<span>${m.dateQ?m.date:m.dateAlt+srcTag(m.dateAltSrc)}<\/span>`:\"\", m.size&&m.size!==\"—\"?`<span>${m.size}<\/span>`:\"\", m.store&&m.store.length?`<span>${m.store.map(s=>s.city+srcTag(s.src)).join(\", \")}<\/span>`:\"\"].filter(Boolean).join(\"\");\n  return `<article class=\"kitem\"><h4><button class=\"link\" data-open=\"${m.id}\">${m.name}<\/button>${m.alt?`<span class=\"alt\">${m.alt}<\/span>`:\"\"}<\/h4>\n  <div class=\"kmeta\">${chipFor(m)}${meta}<\/div><p>${ocs(m.short)}<\/p>${pvShort(m)}${key.length?`<ul>${key.map(f=>`<li>${ocs(f.slice(1))}<\/li>`).join(\"\")}<\/ul>`:\"\"}<\/article>`;\n}\nfunction renderKonspekt(){\n  $(\"#k-glag\").innerHTML = M.filter(m=>m.group===\"glag\").map(kItem).join(\"\");\n  const cyr=M.filter(m=>m.group===\"cyr\");\n  $(\"#k-cyr\").innerHTML = `<div class=\"subh\">Надписи<\/div>`+cyr.filter(m=>m.sub===\"Надписи\").map(kItem).join(\"\")+`<div class=\"subh\">Рукописи<\/div>`+cyr.filter(m=>m.sub===\"Рукописи\").map(kItem).join(\"\");\n  const later=M.filter(m=>m.group===\"later\");\n  const reds=[...new Set(later.map(m=>m.red))];\n  $(\"#k-later\").innerHTML = kItem(byId.ostrom) + reds.map(r=>{\n    const items=later.filter(m=>m.red===r && m.id!==\"ostrom\");\n    return `<div class=\"subh\">${r}<\/div><ul>${items.map(m=>{const k=(m.feats||[]).filter(f=>f.startsWith(\"*\")).map(f=>f.slice(1)); return `<li><button class=\"link\" data-open=\"${m.id}\">${m.name}<\/button> — ${m.date}${k.length?\". \"+ocs(k.join(\" \")):\"\"}<span class=\"later-pv\">${Object.entries({where:\"Создан\",who:\"Кем\",from:\"Откуда\"}).map(([kk,l])=>{const [t,s]=pvFirst(m,kk); return `<b>${l}:<\/b> ${t}${srcTag(s)}`;}).join(\" · \")}<\/span><\/li>`;}).join(\"\")}<\/ul>`;\n  }).join(\"\");\n}\n\n/* ===================== 2. СПИСОК ===================== */\nfunction renderList(){\n  const card=m=>`<button class=\"mcard\" data-open=\"${m.id}\"><span class=\"t\">${m.name}<\/span><span class=\"chips\">${chipFor(m)}<span class=\"chip\">${m.type}<\/span><\/span><span class=\"m\">${dateText(m)}${m.dateQ?\"\":m.dateAlt?\" (по \"+(m.dateAltSrc===\"Ив\"?\"Ивановой\":\"Камчатнову\")+\")\":\"\"}${m.leaves?\" · \"+m.leaves+\" л.\":\"\"}<\/span><span class=\"s\">${ocs(m.short.split(\". \")[0])}.<\/span><\/button>`;\n  const g=(title,dot,items,par)=>`<div class=\"grp\"><div class=\"grp-h\"><h3><i class=\"dot ${dot}\"><\/i>${title}<\/h3><span class=\"cnt\">${par} · ${items.length} ${items.length<5?\"памятника\":\"памятников\"}<\/span><\/div><div class=\"grid\">${items.map(card).join(\"\")}<\/div><\/div>`;\n  const later=M.filter(m=>m.group===\"later\");\n  $(\"#list\").innerHTML =\n    g(\"Глаголические\",\"glag\",M.filter(m=>m.group===\"glag\"),\"§ 27\")+\n    g(\"Кириллические\",\"cyr\",M.filter(m=>m.group===\"cyr\"),\"§ 28\")+\n    `<div class=\"grp\"><div class=\"grp-h\"><h3><i class=\"dot later\"><\/i>Других редакций<\/h3><span class=\"cnt\">§ 28 · ${later.length} памятников<\/span><\/div>\n     <ul class=\"compact\">${later.map(m=>`<li><button data-open=\"${m.id}\"><span class=\"t\">${m.name}<\/span><span class=\"m\">${m.date}<\/span><span class=\"s\">${m.red}${m.alph===\"glag\"?\" · глаголица\":\"\"}<\/span><\/button><\/li>`).join(\"\")}<\/ul><\/div>`;\n}\n\n/* ===================== 3. КАРТОЧКА ===================== */\nlet sel = store.get(\"sp-sel\"); if(!byId[sel]) sel=\"kiev\";\nfunction openCard(id){ sel=id; store.set(\"sp-sel\",id); renderCard(); show(\"kartochka\"); }\nfunction renderCard(){\n  const m=byId[sel]; const idx=M.indexOf(m);\n  const sameGroup=M.filter(x=>x.group===m.group); const pos=sameGroup.indexOf(m)+1;\n  const gname={glag:\"§ 27 · глаголические\",cyr:\"§ 28 · кириллические\",later:\"§ 28 · другие редакции\"}[m.group];\n  const prev=M[(idx-1+M.length)%M.length], next=M[(idx+1)%M.length];\n  const rows=[\n    [\"Азбука\", m.group===\"later\" ? `${ALPH[m.alph]}; ${m.red.toLowerCase()}` : ALPH[m.alph]],\n    [\"Что это\", m.type],\n    [\"Датировка\", dateHTML(m)],\n    m.size?[\"Объём\", m.size]:null,\n    [\"Где создан\", pvLines(m,\"where\")],\n    [\"Кем создан\", pvLines(m,\"who\")],\n    [\"Откуда вывезен\", pvLines(m,\"from\")],\n    [\"Хранение\", storeHTML(m)],\n    m.ed&&m.ed!==\"—\"?[\"Издания\", m.ed]:null\n  ].filter(Boolean);\n  const feats=(m.feats||[]).map(f=>`<li>${ocs(f.replace(/^\\*/,\"\"))}<\/li>`).join(\"\");\n  $(\"#card\").innerHTML = `\n  <div class=\"cardnav\"><button class=\"btn\" data-goto=\"spisok\">← К списку<\/button>\n    <div class=\"pn\"><button class=\"btn\" data-open=\"${prev.id}\" title=\"${prev.name}\">← Предыдущий<\/button><button class=\"btn\" data-open=\"${next.id}\" title=\"${next.name}\">Следующий →<\/button><\/div><\/div>\n  <article class=\"catalog\">\n    <div class=\"cat-head\"><div class=\"cat-no\">${gname} · ${pos} из ${sameGroup.length}<\/div>\n      <h2>${m.name}<\/h2>${m.alt?`<div class=\"alt\">Другие названия: ${m.alt}<\/div>`:\"\"}\n      <div class=\"chips\">${chipFor(m)}<span class=\"chip\">${m.type}<\/span><\/div>\n      <p class=\"lead\">${ocs(m.short)}<\/p><\/div>\n    <dl class=\"fields\">${rows.map(r=>`<dt>${r[0]}<\/dt><dd>${ocs(r[1])}<\/dd>`).join(\"\")}<\/dl>\n    ${feats?`<div class=\"cat-sec\"><h3>Что важно знать<\/h3><ul>${feats}<\/ul><\/div>`:\"\"}\n    ${m.warn||(m.prov&&m.prov.note)?`<div class=\"cat-sec\"><h3 style=\"color:var(--kinovar)\">Обрати внимание<\/h3>${[m.warn,m.prov&&m.prov.note].filter(Boolean).map(x=>`<p style=\"margin:0 0 8px;max-width:72ch\">${x}<\/p>`).join(\"\")}<\/div>`:\"\"}\n    ${m.inscr?`<div class=\"cat-sec\"><h3>Текст надписи (по учебнику)<\/h3><div class=\"inscr\">${m.inscr.join(\"<br>\")}<\/div><p class=\"trans\">${m.inscrT}<\/p><\/div>`:\"\"}\n    ${m.extra&&m.extra.length?`<div class=\"cat-sec extra\"><h3>Дополнения из других учебников<\/h3><ul>${m.extra.map(x=>`<li>${ocs(x)}<\/li>`).join(\"\")}<\/ul><\/div>`:\"\"}\n  <\/article>`;\n}\ndocument.addEventListener(\"click\",e=>{const g=e.target.closest(\"[data-goto]\"); if(g) show(g.dataset.goto);});\n\n/* ===================== 4. ТРЕНАЖЁР ===================== */\nlet tmode=\"test\";\nconst CONCEPT=[\n {q:\"Какие памятники условно называют старославянскими?\", a:\"созданные до 1100 г.\", w:[\"созданные до 1000 г.\",\"только созданные самими Кириллом и Мефодием\",\"созданные до 1300 г.\"], e:\"«Условно старославянскими памятниками мы называем памятники, созданные до 1100 г.»\"},\n {q:\"Что служит главным критерием, чтобы отнести памятник к старославянским?\", a:\"правильное употребление носовых гласных (юсов)\", w:[\"написание глаголицей\",\"наличие точной даты\",\"перевод с греческого языка\"], e:\"Главный критерий — правильное употребление юсов.\"},\n {q:\"Где находились основные центры создания старославянских памятников?\", a:\"Македония и Восточная Болгария\", w:[\"Моравия и Паннония\",\"Киев и Новгород\",\"Афон и Синай\"], e:\"Ремнёва: основные центры — Македония и Восточная Болгария.\"},\n {q:\"Сохранились ли тексты, созданные самими Кириллом и Мефодием?\", a:\"нет, тексты II половины IX в. не сохранились\", w:[\"да, это Киевские листки\",\"да, это Синайская псалтирь\",\"сохранились только их надписи на камне\"], e:\"Первые тексты Кирилла, Мефодия и их учеников не сохранились; дошли памятники X–XI вв.\"},\n {q:\"На каком материале написаны старославянские памятники?\", a:\"на пергамене\", w:[\"на бересте\",\"на бумаге\",\"на папирусе\"], e:\"Чернилами на пергамене — специально выделанной коже.\"},\n {q:\"Что такое тетр?\", a:\"четвероевангелие — повествования четырёх евангелистов\", w:[\"служебное евангелие с чтениями по неделям\",\"книга псалмов\",\"книга молитв и треб\"], e:\"Тетр — четвероевангелие (Матфей, Марк, Лука, Иоанн).\"},\n {q:\"Что такое апракос?\", a:\"служебное евангелие: отрывки в порядке недельных чтений\", w:[\"четвероевангелие\",\"книга чтений на все дни месяца\",\"сборник апостольских чтений\"], e:\"Апракос — служебное евангелие.\"},\n {q:\"Что считается старейшими кириллическими памятниками?\", a:\"надписи на могильных плитах\", w:[\"Саввина книга\",\"Супрасльская рукопись\",\"Енинский апостол\"], e:\"§ 28: старейшие кириллические памятники — надписи на могильных плитах.\"},\n {q:\"Что отличает Остромирово евангелие от старославянских памятников?\", a:\"оно древнерусское и отражает живую восточнославянскую речь\", w:[\"оно написано глаголицей\",\"оно создано до 1000 г.\",\"в нём нет ни одного писца\"], e:\"Это самый ранний датированный древнерусский памятник (1056–1057 гг.).\"},\n {q:\"Какую букву сохраняет Мариинское евангелие?\", a:\"{ѕ} (зело)\", w:[\"{ѳ} (фита)\",\"{ѵ} (ижица)\",\"{ѯ} (кси)\"], e:\"Мариинское сохраняет {ѕ} [d’z’]: {польѕа}, {помоѕи}.\"}\n];\nconst RN={IX:9,X:10,XI:11,XII:12,XIII:13,XIV:14};\nfunction dateDistr(m, ms){\n  const precise=/\\d{3,4}/;\n  if(precise.test(m.dateQ)) return pick3(m.dateQ, ms.filter(x=>x.dateQ&&precise.test(x.dateQ)).map(x=>x.dateQ));\n  const avoid=new Set([m.cent]); (m.dateQ.match(/\\b(XIV|XIII|XII|XI|IX|X)\\b/g)||[]).forEach(r=>avoid.add(RN[r]));\n  return shuffle(Object.entries(RN).filter(([r,c])=>!avoid.has(c)).map(([r])=>r+\" в.\")).slice(0,3);\n}\nfunction pick3(correct, pool){ return shuffle([...new Set(pool.filter(v=>v&&v!==correct))]).slice(0,3); }\nfunction buildPool(incLater){\n  const ms=M.filter(m=>(incLater||m.group!==\"later\"));\n  const P=[];\n  CONCEPT.forEach(c=>P.push({q:c.q, a:c.a, opts:shuffle([c.a,...c.w]), e:c.e}));\n  ms.forEach(m=>{\n    const N=`«${m.name}»`;\n    if(m.group!==\"later\" && !/глагол|кирилл/i.test(m.name)) P.push({q:`Какой азбукой написан памятник ${N}?`, a:m.alph===\"glag\"?\"Глаголицей\":\"Кириллицей\", opts:[\"Глаголицей\",\"Кириллицей\"], e:m.short, open:m.id});\n    if(m.typeQ){ const d=pick3(m.typeQ, ms.map(x=>x.typeQ)); if(d.length===3) P.push({q:`Что представляет собой ${N}?`, a:m.typeQ, opts:shuffle([m.typeQ,...d]), e:m.short, open:m.id}); }\n    if(m.dateQ){ const d=dateDistr(m, ms); P.push({q:`К какому времени относится ${N}?`, a:m.dateQ, opts:shuffle([m.dateQ,...d]), e:`${m.name}: ${m.date}.`, open:m.id}); }\n    if(m.cityQ){ const d=pick3(m.cityQ, ms.map(x=>x.cityQ).filter(v=>v&&!m.cityQ.includes(v.split(\",\")[0])&&!v.includes(m.cityQ.split(\",\")[0]))); P.push({q:`Где хранится ${N}?`, a:m.cityQ, opts:shuffle([m.cityQ,...d]), e:`${m.name}: ${storeText(m)}.`, open:m.id}); }\n    if(m.finderQ){ const d=pick3(m.finderQ, ms.map(x=>x.finderQ)); P.push({q:`Кто нашёл или вывез ${N}?`, a:m.finderQ, opts:shuffle([m.finderQ,...d]), e:m.prov?m.prov.from.map(x=>x[0]).join(\". \")+\".\":m.hist, open:m.id}); }\n    if(m.wq){ const d=pick3(m.wq, ms.map(x=>x.wq).concat([\"Моравия\",\"Македония\",\"Восточная Болгария\",\"Древняя Русь\"])); P.push({q:`Где создан памятник ${N}?`, a:m.wq, opts:shuffle([m.wq,...d]), e:m.prov.where.map(x=>x[0]).join(\". \")+\".\", open:m.id}); }\n    if(m.sq){ const d=pick3(m.sq, ms.map(x=>x.sq).concat([\"поп Савва\",\"дьякон Григорий\",\"Константин Преславский\",\"Климент Охридский\"])); P.push({q:`Чьё имя как писца сохранилось в памятнике ${N}?`, a:m.sq, opts:shuffle([m.sq,...d]), e:m.prov.who.map(x=>x[0]).join(\". \")+\".\", open:m.id}); }\n    if(m.leaves){ const a=String(m.leaves); const d=pick3(a, ms.filter(x=>x.leaves).map(x=>String(x.leaves))); P.push({q:`Сколько листов в памятнике ${N}?`, a, opts:shuffle([a,...d]), e:`${m.name}: ${m.size}.`, open:m.id}); }\n    (m.clues||[]).forEach(c=>{ const d=pick3(m.name, ms.filter(x=>x.group===m.group||Math.random()<.3).map(x=>x.name)); P.push({q:`Узнай памятник по примете: ${c}.`, a:m.name, opts:shuffle([m.name,...d]), e:m.short, open:m.id}); });\n  });\n  return P;\n}\nlet quiz=null;\nfunction newQuiz(){\n  const P=buildPool($(\"#incLater\").checked);\n  const concept=shuffle(P.filter(p=>!p.open)).slice(0,3);\n  const rest=shuffle(P.filter(p=>p.open));\n  const used=new Set(), picked=[];\n  for(const p of rest){ if(picked.length>=7) break; if(used.has(p.open)) continue; used.add(p.open); picked.push(p); }\n  quiz={qs:shuffle([...concept,...picked]), i:0, score:0, answered:false, wrong:[]};\n  renderQuiz();\n}\nfunction holdHeight(T){ T.style.minHeight=Math.max(T.offsetHeight, parseFloat(T.style.minHeight)||0)+\"px\"; }\nfunction keepInView(el){ if(!el) return; const top=el.getBoundingClientRect().top, bar=$(\".tabs\").getBoundingClientRect().bottom; if(top<bar+8) window.scrollBy(0, top-bar-12); }\nfunction renderQuiz(){\n  const T=$(\"#trainer\"); holdHeight(T);\n  if(quiz.i>=quiz.qs.length){\n    const n=quiz.qs.length;\n    T.innerHTML=`<div class=\"qbox\"><div class=\"qmeta\"><span>Раунд окончен<\/span><\/div><div class=\"score\">${quiz.score} / ${n}<\/div>\n    <p>${quiz.score===n?\"Без ошибок.\":quiz.score>=n*0.7?\"Хороший результат. Посмотри карточки, где ошибся.\":\"Стоит перечитать конспект и пройти ещё раунд.\"}<\/p>\n    ${quiz.wrong.length?`<p class=\"ui muted\" style=\"font-size:14px;margin-bottom:6px\">Повторить:<\/p><div class=\"chips\">${[...new Set(quiz.wrong)].map(id=>`<button class=\"chip\" style=\"cursor:pointer\" data-open=\"${id}\">${byId[id].name}<\/button>`).join(\"\")}<\/div>`:\"\"}\n    <div class=\"qactions\"><button class=\"btn primary\" id=\"qAgain\">Новый раунд<\/button><\/div><\/div>`;\n    $(\"#qAgain\").onclick=newQuiz; return;\n  }\n  const q=quiz.qs[quiz.i];\n  T.innerHTML=`<div class=\"qbox\"><div class=\"qmeta\"><span>Вопрос ${quiz.i+1} из ${quiz.qs.length}<\/span><span>Верно: ${quiz.score}<\/span><\/div>\n   <div class=\"qbar\"><i style=\"width:${quiz.i/quiz.qs.length*100}%\"><\/i><\/div>\n   <p class=\"qtext\">${ocs(q.q)}<\/p>\n   <div class=\"opts\">${q.opts.map((o,k)=>`<button class=\"opt\" data-k=\"${k}\"><span class=\"l\">${\"АБВГ\"[k]}<\/span><span>${ocs(o)}<\/span><\/button>`).join(\"\")}<\/div>\n   <div id=\"qfb\"><\/div><\/div>`;\n  $$(\".opt\",T).forEach(b=>b.onclick=()=>{\n    if(quiz.answered) return; quiz.answered=true;\n    const chosen=q.opts[+b.dataset.k], ok=chosen===q.a;\n    if(ok) quiz.score++; else if(q.open) quiz.wrong.push(q.open);\n    $$(\".opt\",T).forEach(x=>{ x.disabled=true; const v=q.opts[+x.dataset.k]; if(v===q.a) x.classList.add(\"right\"); else if(x===b) x.classList.add(\"wrong\"); });\n    $(\"#qfb\").innerHTML=`<div class=\"fb\"><b class=\"${ok?\"okc\":\"badc\"}\">${ok?\"Верно.\":\"Неверно. Правильно: \"+ocs(q.a)+\".\"}<\/b> ${ocs(q.e||\"\")}<\/div>\n      <div class=\"qactions\"><button class=\"btn primary\" id=\"qNext\">${quiz.i+1<quiz.qs.length?\"Дальше\":\"Итог\"}<\/button>${q.open?`<button class=\"btn\" data-open=\"${q.open}\">Открыть карточку<\/button>`:\"\"}<\/div>`;\n    $(\"#qNext\").onclick=()=>{quiz.i++; quiz.answered=false; renderQuiz(); keepInView($(\".qbox\",$(\"#trainer\")));};\n    $(\"#qNext\").focus({preventScroll:true});\n  });\n}\n\n/* карточки */\nlet fl=null;\nfunction newFlash(){\n  const deck=shuffle(M.filter(m=>m.group!==\"later\" || ($(\"#incLater\").checked && m.feats && m.feats.length)).map(m=>m.id));\n  fl={q:deck, total:deck.length, known:0, flip:false};\n  renderFlash();\n}\nfunction renderFlash(){\n  const T=$(\"#trainer\"); holdHeight(T);\n  if(!fl.q.length){\n    T.innerHTML=`<div class=\"flash-wrap\"><div class=\"qbox\"><div class=\"score\">${fl.total} / ${fl.total}<\/div><p>Все карточки отмечены как «Помню».<\/p><div class=\"qactions\"><button class=\"btn primary\" id=\"fAgain\">Начать заново<\/button><\/div><\/div><\/div>`;\n    $(\"#fAgain\").onclick=newFlash; return;\n  }\n  const m=byId[fl.q[0]];\n  const key=(m.feats||[]).filter(f=>f.startsWith(\"*\")).slice(0,3);\n  const front=`<span class=\"side\">Памятник · нажми, чтобы перевернуть<\/span><span class=\"front-name\">${m.name}<\/span><span class=\"hint\">Вспомни: азбука, время, содержание, где и кем создан, откуда вывезен, где хранится.<\/span>`;\n  const back=`<span class=\"side\">Ответ<\/span><span class=\"bk-t\">${m.name}<\/span><span class=\"chips\">${chipFor(m)}<span class=\"chip\">${dateText(m)}<\/span>${m.leaves?`<span class=\"chip\">${m.leaves} л.<\/span>`:\"\"}<\/span>\n    <span>${ocs(m.short)}<\/span>${key.length?`<ul>${key.map(f=>`<li>${ocs(f.slice(1))}<\/li>`).join(\"\")}<\/ul>`:\"\"}${pvShort(m)}${m.store&&m.store.length?`<span class=\"hint\">Хранение: ${m.store.map(s=>s.city+srcTag(s.src)).join(\", \")}<\/span>`:\"\"}`;\n  T.innerHTML=`<div class=\"flash-wrap\"><button class=\"flash\" id=\"fcard\" aria-label=\"Перевернуть карточку\">${fl.flip?back:front}<\/button>\n   <div class=\"flash-ctl\">${fl.flip?`<button class=\"btn\" id=\"fAgainOne\">Ещё раз<\/button><button class=\"btn primary\" id=\"fKnow\">Помню<\/button>`:`<button class=\"btn primary\" id=\"fFlip\">Показать ответ<\/button>`}\n   <span class=\"prog\">Осталось ${fl.q.length} из ${fl.total}<\/span><\/div><\/div>`;\n  const flip=()=>{fl.flip=!fl.flip; renderFlash();};\n  $(\"#fcard\").onclick=flip; if($(\"#fFlip\")) $(\"#fFlip\").onclick=flip;\n  if($(\"#fKnow\")) $(\"#fKnow\").onclick=()=>{fl.q.shift(); fl.known++; fl.flip=false; renderFlash();};\n  if($(\"#fAgainOne\")) $(\"#fAgainOne\").onclick=()=>{fl.q.push(fl.q.shift()); fl.flip=false; renderFlash();};\n}\n\n/* сопоставление */\nconst MATTR={typeQ:\"Содержание\", cityQ:\"Хранение\", dateQ:\"Датировка\", finderQ:\"Кто нашёл\", wq:\"Где создан\"};\nlet mt=null;\nfunction newMatch(attr){\n  attr=attr||(mt&&mt.attr)||\"typeQ\";\n  const cand=shuffle(M.filter(m=>m[attr] && ($(\"#incLater\").checked||m.group!==\"later\")));\n  const seen=new Set(), items=[];\n  for(const m of cand){ if(items.length>=5) break; if(seen.has(m[attr])) continue; seen.add(m[attr]); items.push(m); }\n  mt={attr, items, right:shuffle(items.map(m=>m[attr])), done:new Set(), selL:null, errors:0};\n  renderMatch();\n}\nfunction renderMatch(){\n  const T=$(\"#trainer\"); holdHeight(T);\n  const all=mt.done.size===mt.items.length;\n  T.innerHTML=`<div class=\"trainer-top\" style=\"margin-bottom:14px\"><div class=\"seg\" role=\"group\" aria-label=\"Что сопоставлять\">${Object.entries(MATTR).map(([k,v])=>`<button data-attr=\"${k}\" aria-pressed=\"${k===mt.attr}\">${v}<\/button>`).join(\"\")}<\/div>\n   <span class=\"prog\">Найдено ${mt.done.size} из ${mt.items.length} · ошибок: ${mt.errors}<\/span><\/div>\n   <p class=\"ui muted\" style=\"font-size:14px;margin:0 0 12px\">Выбери памятник слева, затем подходящий ответ справа.<\/p>\n   <div class=\"match\"><div class=\"mcol\"><h4>Памятник<\/h4><div class=\"opts\">${mt.items.map(m=>`<button class=\"mi ${mt.done.has(m.id)?\"done\":\"\"} ${mt.selL===m.id?\"sel\":\"\"}\" data-l=\"${m.id}\" ${mt.done.has(m.id)?\"disabled\":\"\"}>${m.name}<\/button>`).join(\"\")}<\/div><\/div>\n   <div class=\"mcol\"><h4>${MATTR[mt.attr]}<\/h4><div class=\"opts\">${mt.right.map((v,k)=>{const d=mt.items.find(m=>m[mt.attr]===v); const isDone=mt.done.has(d.id); return `<button class=\"mi ${isDone?\"done\":\"\"}\" data-r=\"${k}\" ${isDone?\"disabled\":\"\"}>${v}<\/button>`;}).join(\"\")}<\/div><\/div><\/div>\n   ${all?`<div class=\"qactions\"><span class=\"ui\" style=\"font-size:15px;align-self:center\"><b style=\"color:var(--ok)\">Готово.<\/b> Ошибок: ${mt.errors}.<\/span><button class=\"btn primary\" id=\"mNew\">Новый набор<\/button><\/div>`:`<div class=\"qactions\"><button class=\"btn\" id=\"mNew\">Другой набор<\/button><\/div>`}`;\n  $$(\"[data-attr]\",T).forEach(b=>b.onclick=()=>newMatch(b.dataset.attr));\n  $(\"#mNew\").onclick=()=>newMatch();\n  $$(\"[data-l]\",T).forEach(b=>b.onclick=()=>{mt.selL=b.dataset.l; renderMatch();});\n  $$(\"[data-r]\",T).forEach(b=>b.onclick=()=>{\n    if(!mt.selL){ b.classList.add(\"err\"); setTimeout(()=>b.classList.remove(\"err\"),350); return; }\n    const v=mt.right[+b.dataset.r], m=byId[mt.selL];\n    if(m[mt.attr]===v){ mt.done.add(m.id); mt.selL=null; renderMatch(); }\n    else { mt.errors++; b.classList.add(\"err\"); const p=$(\".prog\",T); if(p) p.textContent=`Найдено ${mt.done.size} из ${mt.items.length} · ошибок: ${mt.errors}`; setTimeout(()=>b.classList.remove(\"err\"),350); }\n  });\n}\nfunction renderTrainer(){\n  $$(\"#tmode button\").forEach(b=>b.setAttribute(\"aria-pressed\", b.dataset.mode===tmode));\n  if(tmode===\"test\"){ if(!quiz) newQuiz(); else renderQuiz(); }\n  if(tmode===\"flash\"){ if(!fl) newFlash(); else renderFlash(); }\n  if(tmode===\"match\"){ if(!mt) newMatch(\"typeQ\"); else renderMatch(); }\n}\n$(\"#tmode\").addEventListener(\"click\",e=>{const b=e.target.closest(\"button\"); if(!b) return; tmode=b.dataset.mode; $(\"#trainer\").style.minHeight=\"\"; renderTrainer();});\n$(\"#incLater\").addEventListener(\"change\",()=>{ quiz=null; fl=null; mt=null; $(\"#trainer\").style.minHeight=\"\"; renderTrainer(); });\n\n/* ===================== 5. ВРЕМЯ И МЕСТО ===================== */\nconst ROMAN={9:\"IX\",10:\"X\",11:\"XI\",12:\"XII\",13:\"XIII\"};\nfunction renderTimeline(){\n  const row=m=>{\n    const alt=!m.dateQ;\n    const d=alt?(m.dateAlt||\"—\"):m.dateQ;\n    return `<div class=\"trow\"><span class=\"d ${alt?\"alt\":\"\"}\">${d}${alt&&m.dateAltSrc?srcTag(m.dateAltSrc):\"\"}<\/span><i class=\"dot ${m.group===\"later\"?\"later\":m.alph}\"><\/i><span class=\"n\"><button class=\"link\" data-open=\"${m.id}\">${m.name}<\/button><small>${m.type}<\/small><\/span><\/div>`;\n  };\n  const byC=c=>M.filter(m=>m.cent===c).sort((a,b)=>a.year-b.year);\n  const sec=(c,lbl,items)=>`<div class=\"cent\"><div class=\"cent-h\"><span class=\"rn\">${ROMAN[c]}<\/span><span class=\"lbl\">${lbl}<\/span><\/div>${items}<\/div>`;\n  $(\"#timeline\").innerHTML =\n    sec(9,\"век\",\"<div class=\\\"trow\\\"><span class=\\\"d\\\">II пол. IX в.<\/span><i class=\\\"dot lost\\\"><\/i><span class=\\\"n\\\">Переводы Кирилла, Мефодия и их учеников<small>не сохранились<\/small><\/span><\/div>\")+\n    sec(10,\"век\",byC(10).map(row).join(\"\"))+\n    sec(11,\"век\",byC(11).map(row).join(\"\"))+\n    `<div class=\"border1100\"><b>1100 г.<\/b> Условная граница: памятники, созданные до 1100 г., называют старославянскими. Дальше — среднеболгарские и другие церковнославянские рукописи.<\/div>`+\n    sec(12,\"век\",byC(12).map(row).join(\"\"))+\n    sec(13,\"век\",byC(13).map(row).join(\"\"));\n}\nfunction renderStorage(){\n  const map=new Map();\n  M.forEach(m=>(m.store||[]).forEach(s=>{ if(!map.has(s.city)) map.set(s.city,[]); map.get(s.city).push({m,s}); }));\n  const cities=[...map.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],\"ru\"));\n  const none=main.filter(m=>!m.store||!m.store.length);\n  $(\"#storage\").innerHTML = cities.map(([city,arr])=>`<div class=\"city\"><div class=\"city-h\"><b>${city}<\/b><span>${arr.length}<\/span><\/div><ul>${arr.map(({m,s})=>`<li><i class=\"dot ${m.group===\"later\"?\"later\":m.alph}\"><\/i><span><button class=\"link\" data-open=\"${m.id}\">${m.name}<\/button>${srcTag(s.src)}${s.place?`<small>${s.place}<\/small>`:\"\"}<small>${(([t,sr])=>\"Откуда: \"+t+srcTag(sr))(pvFirst(m,\"from\"))}<\/small><\/span><\/li>`).join(\"\")}<\/ul><\/div>`).join(\"\")+\n   `<div class=\"city\"><div class=\"city-h\"><b>Место хранения не указано<\/b><span>${none.length}<\/span><\/div><ul>${none.map(m=>`<li><i class=\"dot ${m.alph}\"><\/i><span><button class=\"link\" data-open=\"${m.id}\">${m.name}<\/button><small>${(([t,sr])=>t+srcTag(sr))(pvFirst(m,\"from\"))}<\/small><\/span><\/li>`).join(\"\")}<\/ul><\/div>`;\n}\n\n/* ===================== 6–7. ГЛОССАРИЙ, ВОПРОСЫ ===================== */\nfunction renderGloss(){\n  $(\"#gloss\").innerHTML = GLOSS.map(g=>`<div class=\"term\"><dt>${g.t}${srcTag(g.s)}<\/dt><dd>${ocs(g.d)}<\/dd>${g.ex?`<div class=\"ex\">Примеры: ${g.ex.map(id=>`<button class=\"link\" data-open=\"${id}\">${byId[id].name}<\/button>`).join(\", \")}<\/div>`:\"\"}<\/div>`).join(\"\");\n}\nfunction renderQA(){\n  $(\"#qa\").innerHTML = QA.map((x,i)=>`<details><summary><span class=\"no\">${i+1}<\/span><span>${x.q}<\/span><span class=\"pm\">+<\/span><\/summary><div class=\"ans\">${ocs(x.a)}${x.links?`<p class=\"ui\" style=\"font-size:13.5px;color:var(--muted)\">Карточки: ${x.links.map(id=>`<button class=\"link ui\" style=\"font-size:13.5px\" data-open=\"${id}\">${byId[id].name}<\/button>`).join(\", \")}<\/p>`:\"\"}<\/div><\/details>`).join(\"\");\n  $(\"#qaOpen\").onclick=()=>$$(\"#qa details\").forEach(d=>d.open=true);\n  $(\"#qaClose\").onclick=()=>$$(\"#qa details\").forEach(d=>d.open=false);\n}\n\n/* ===================== 8. ТЕТРАДЬ ===================== */\nconst NB_INTRO=[\n \"Старославянскими условно называют памятники, созданные до 1100 г. Критерий — правильное употребление носовых гласных (юсов).\",\n \"Сохранились памятники X и главным образом XI в. Первые переводы Кирилла, Мефодия и учеников (II пол. IX в.) не сохранились.\",\n \"Уже в этих памятниках есть черты южных, западных и восточных славян.\",\n \"Центры создания — Македония и Восточная Болгария.\",\n \"Написаны чернилами на пергамене (выделанной коже); две азбуки — глаголица и кириллица.\",\n \"Содержание — церковные тексты: Евангелия — тетры (четвероевангелия: Матфей, Марк, Лука, Иоанн) и апракосы (служебные, отрывки по порядку недельных чтений); Псалтирь, евхологии, требники, Четьи-минеи, патерики, сборники поучений.\",\n \"Значение: сопоставление с памятниками других славян, редакциями церковнославянского языка и совр. славянскими языками → реконструкция фонетики и морфологии старославянского языка и языка оригиналов Первоучителей.\"\n];\nfunction nbData(){\n  const glag=M.filter(m=>m.group===\"glag\"), cyr=M.filter(m=>m.group===\"cyr\"), later=M.filter(m=>m.group===\"later\");\n  return [\n    {h:\"1. Общие сведения (§ 26)\", list:NB_INTRO, ul:true},\n    {h:\"2. Глаголические памятники (§ 27)\", items:glag},\n    {h:\"3. Кириллические памятники (§ 28)\", pre:\"Старейшие кириллические памятники — надписи на могильных плитах (знак распространения кириллицы).\", items:cyr},\n    {h:\"4. Памятники других редакций\", items:[byId.ostrom], tail2:later.filter(m=>m.id!==\"ostrom\"), tail:[\n      \"Восточнославянская редакция: Чудовская псалтирь (XI в.), Архангельское евангелие (конец XI в.), Изборники 1073 и 1076 гг.\",\n      \"Чешская редакция: Пражские отрывки (XI–XII вв.; Шафарик ошибочно относил к концу IX в.).\",\n      \"Среднеболгарские (XII–XIV вв., черты, которых не было в XI в.): Добромирово евангелие (XII в.), Охридский апостол (конец XII в.), Болонская псалтирь (нач. XIII в.), Битольская триодь (XIII в., вкрапления глаголицы), Боянское евангелие (XIII в., палимпсест: кириллица по смытой глаголице).\"]}\n  ];\n}\nfunction renderNB(){\n  const D=nbData();\n  const head=m=>m.name+(m.alt&&m.id!==\"maccyr\"?\" (\"+m.alt.split(\",\")[0]+\")\":\"\")+\", \"+(m.dateQ?m.dateQ:m.dateAlt?m.dateAlt+\" (Ив.)\":\"дата не указана\");\n  $(\"#nb\").innerHTML = `<h4>Старославянские памятники<\/h4><p><i>Ремнёва М. Л. Старославянский язык. М., 2004. С. 55–69.<\/i><\/p>`+\n    D.map(sec=>`<h4>${sec.h}<\/h4>${sec.pre?`<p>${sec.pre}<\/p>`:\"\"}${sec.list?`<ul>${sec.list.map(x=>`<li>${x}<\/li>`).join(\"\")}<\/ul>`:\"\"}${sec.items?`<ol>${sec.items.map(m=>`<li><span class=\"t\">${head(m)}<\/span> — ${ocs(m.nb)} <i>${pvPlain(m)}.<\/i><\/li>`).join(\"\")}<\/ol>`:\"\"}${sec.tail?`<ul>${sec.tail.map(x=>`<li>${x}<\/li>`).join(\"\")}<\/ul>`:\"\"}${sec.tail2?`<p><b>Где, кем созданы и откуда вывезены:<\/b><\/p><ul>${sec.tail2.map(m=>`<li>${m.name} — ${pvPlain(m)}.<\/li>`).join(\"\")}<\/ul>`:\"\"}`).join(\"\");\n}\nfunction nbPlain(){\n  const D=nbData(); const head=m=>m.name+(m.alt&&m.id!==\"maccyr\"?\" (\"+m.alt.split(\",\")[0]+\")\":\"\")+\", \"+(m.dateQ?m.dateQ:m.dateAlt?m.dateAlt+\" (Ив.)\":\"дата не указана\");\n  let s=\"СТАРОСЛАВЯНСКИЕ ПАМЯТНИКИ\\nРемнёва М. Л. Старославянский язык. М., 2004. С. 55–69.\\n\";\n  D.forEach(sec=>{ s+=\"\\n\"+sec.h.toUpperCase()+\"\\n\"; if(sec.pre) s+=sec.pre+\"\\n\"; if(sec.list) sec.list.forEach(x=>s+=\"• \"+x+\"\\n\"); if(sec.items) sec.items.forEach((m,i)=>s+=`${i+1}) ${head(m)} — ${plain(m.nb)} ${pvPlain(m)}.\\n`); if(sec.tail) sec.tail.forEach(x=>s+=\"• \"+x+\"\\n\"); if(sec.tail2){ s+=\"Где, кем созданы и откуда вывезены:\\n\"; sec.tail2.forEach(m=>s+=`• ${m.name} — ${pvPlain(m)}.\\n`); } });\n  return s;\n}\n$(\"#nbCopy\").onclick=()=>{\n  const txt=nbPlain();\n  const fallback=()=>{const ta=$(\"#nbFallback\"); ta.hidden=false; ta.value=txt; ta.focus(); ta.select(); toast(\"Текст выделен — скопируй вручную\");};\n  try{ navigator.clipboard.writeText(txt).then(()=>toast(\"Скопировано\"),fallback); }catch(e){ fallback(); }\n};\n\n/* ===================== СТАРТ ===================== */\nrenderKonspekt(); renderList(); renderCard(); renderTimeline(); renderStorage(); renderGloss(); renderQA(); renderNB(); renderTrainer();\nconst h=(location.hash||\"\").slice(1);\nshow(TABS.includes(h)?h:(store.get(\"sp-tab\")||\"konspekt\"), false);\n<\/script>\n\n\n<\/body><\/html>";
</script>
<script>
(function(){
  var F = {fon:{f:document.getElementById("f-fon"),doc:DOC_FON},
           noun:{f:document.getElementById("f-noun"),doc:DOC_NOUN},
           pam:{f:document.getElementById("f-pam"),doc:DOC_PAM}};
  var tabT=document.getElementById("tab-temy"), tabP=document.getElementById("tab-pam"), topics=document.getElementById("topics");
  var HASH={fon:"fonetika",noun:"sushchestvitelnoe",pam:"pamyatniki"};
  var root=document.documentElement;
  function syncTheme(f){
    try{
      var d=f.contentDocument&&f.contentDocument.documentElement; if(!d) return;
      var t=root.getAttribute("data-theme");
      if(t) d.setAttribute("data-theme",t); else d.removeAttribute("data-theme");
    }catch(e){}
  }
  function load(k){
    var s=F[k]; if(s.loaded) return; s.loaded=true;
    s.f.addEventListener("load",function(){ syncTheme(s.f); });
    var fonts=document.getElementById("ssl-offline-fonts").outerHTML;
    s.f.srcdoc=s.doc.replace(/&family=(?:Ponomar|Noto\+Sans\+Glagolitic)(?=&)/g,"")
      .replace("</head>",fonts+"</head>");
    s.doc=null;
  }
  new MutationObserver(function(){ for(var k in F) if(F[k].loaded) syncTheme(F[k].f); })
    .observe(root,{attributes:true,attributeFilter:["data-theme"]});
  function get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
  function put(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
  var topic=get("sl-topic")==="noun"?"noun":"fon";
  function show(k){
    if(!F[k]) k="fon";
    if(k!=="pam"){ topic=k; put("sl-topic",k); }
    load(k);
    for(var j in F) F[j].f.hidden = j!==k;
    var isT=k!=="pam";
    tabT.setAttribute("aria-selected",isT); tabT.tabIndex=isT?0:-1;
    tabP.setAttribute("aria-selected",!isT); tabP.tabIndex=isT?-1:0;
    topics.hidden=!isT;
    topics.querySelectorAll("button[data-t]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.t===k); });
    tabT.setAttribute("aria-controls","f-"+topic);
    put("sl-section", isT?"temy":"pam");
    try{ history.replaceState(null,"","#"+HASH[k]); }catch(e){}
  }
  document.getElementById("seg").addEventListener("click",function(e){
    var b=e.target.closest("button[data-s]"); if(!b) return;
    show(b.dataset.s==="pam"?"pam":topic);
  });
  document.getElementById("seg").addEventListener("keydown",function(e){
    if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight") return;
    var n=F.pam.f.hidden?"pam":topic; show(n); (n==="pam"?tabP:tabT).focus();
  });
  topics.addEventListener("click",function(e){ var b=e.target.closest("button[data-t]"); if(b) show(b.dataset.t); });
  var h=(location.hash||"").slice(1), start;
  if(h==="pamyatniki") start="pam"; else if(h==="sushchestvitelnoe") start="noun"; else if(h==="fonetika"||h==="temy") start=h==="temy"?topic:"fon";
  else start = get("sl-section")==="pam" ? "pam" : topic;
  show(start);
  window.addEventListener("load",function(){ setTimeout(function(){ ["fon","noun","pam"].forEach(function(k){ if(k!==start) load(k); }); },1200); });
})();
</script>

<script>
(() => {
  const install = document.getElementById('app-install');
  const check = document.getElementById('app-check');
  const status = document.getElementById('app-status');
  const notice = document.getElementById('app-notice');
  const apply = document.getElementById('app-apply');
  const later = document.getElementById('app-later');
  const offlineReady = 'Все разделы доступны без интернета.';
  let installPrompt;
  let registration;
  let readyRevision;
  let dismissedRevision;
  let checking = false;

  install.hidden = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    installPrompt = event;
  });
  window.addEventListener('appinstalled', () => {
    install.hidden = true;
    installPrompt = null;
  });
  install.addEventListener('click', async () => {
    if (installPrompt) {
      const prompt = installPrompt;
      installPrompt = null;
      try {
        await prompt.prompt();
        return;
      } catch { /* The browser menu also offers installation. */ }
    }
    const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    status.textContent = ios
      ? 'В Safari нажмите «Поделиться» → «На экран Домой».'
      : 'В меню браузера выберите «Установить приложение» или «Добавить на главный экран».';
  });

  if (location.protocol === 'file:') {
    for (const id of ['app-install', 'app-check', 'app-download']) document.getElementById(id).hidden = true;
    document.getElementById('app-website').hidden = false;
    status.textContent = 'Скачанная копия. Чтобы установить приложение с обновлениями, откройте сайт.';
    return;
  }
  if (!window.isSecureContext || !('serviceWorker' in navigator)) {
    install.hidden = true;
    check.hidden = true;
    status.textContent = 'Установка и обновления доступны в браузере с поддержкой Service Worker.';
    return;
  }

  async function send(type, revision) {
    const worker = navigator.serviceWorker.controller || registration?.active;
    if (!worker) throw new Error('Service worker is not ready');
    const { port1, port2 } = new MessageChannel();
    let timeout;
    try {
      return await new Promise((resolve, reject) => {
        timeout = setTimeout(() => reject(new Error('Update check timed out')), 18000);
        port1.onmessage = ({ data }) => resolve(data);
        worker.postMessage({ type, revision }, [port2]);
      });
    } finally {
      clearTimeout(timeout);
      port1.close();
    }
  }

  function showUpdate(result, force = false) {
    readyRevision = result.revision;
    if (force || readyRevision !== dismissedRevision) notice.hidden = false;
    status.textContent = 'Новая версия уже скачана.';
  }

  async function checkForUpdates(manual = false) {
    if (!registration?.active || checking) return;
    checking = true;
    check.disabled = true;
    if (manual) status.textContent = 'Проверяем обновления…';
    try {
      const result = await send(navigator.onLine ? 'CHECK_UPDATE' : 'GET_UPDATE');
      if (result.state === 'ready') showUpdate(result, manual);
      else if (result.state === 'current') {
        notice.hidden = true;
        status.textContent = !navigator.onLine ? 'Нет сети. ' + offlineReady :
          manual ? 'Установлена актуальная версия.' : offlineReady;
      } else if (manual) status.textContent = 'Не удалось проверить обновления. ' + offlineReady;
    } catch {
      if (manual) status.textContent = 'Не удалось проверить обновления. ' + offlineReady;
    } finally {
      checking = false;
      check.disabled = false;
    }
  }

  check.addEventListener('click', () => checkForUpdates(true));
  later.addEventListener('click', () => {
    dismissedRevision = readyRevision;
    notice.hidden = true;
  });
  apply.addEventListener('click', async () => {
    apply.disabled = true;
    try {
      const result = await send('APPLY_UPDATE', readyRevision);
      if (result.state === 'applied') location.reload();
      else if (result.state === 'ready') showUpdate(result, true);
      else if (result.state === 'current') {
        notice.hidden = true;
        status.textContent = offlineReady;
      } else {
        status.textContent = 'Не удалось применить обновление. Попробуйте ещё раз.';
      }
    } catch {
      status.textContent = 'Не удалось применить обновление. Попробуйте ещё раз.';
    } finally {
      apply.disabled = false;
    }
  });

  navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
    .then(async registered => {
      registration = registered;
      const worker = registered.installing;
      worker?.addEventListener('statechange', () => {
        if (worker.state === 'redundant' && !registered.active) {
          status.textContent = 'Не удалось подготовить офлайн-доступ. Обновите страницу при наличии сети.';
        }
      });
      await navigator.serviceWorker.ready;
      status.textContent = offlineReady;
      check.disabled = false;
      try {
        const staged = await send('GET_UPDATE');
        if (staged.state === 'ready') showUpdate(staged);
      } finally {
        await checkForUpdates();
      }
    })
    .catch(() => {
      if (!registration?.active) status.textContent = 'Не удалось подготовить офлайн-доступ.';
    });
  window.addEventListener('online', () => checkForUpdates());
  window.addEventListener('offline', () => {
    if (registration?.active) status.textContent = 'Нет сети. ' + offlineReady;
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdates();
  });
  window.setInterval(() => {
    if (document.visibilityState === 'visible') checkForUpdates();
  }, 30 * 60 * 1000);
})();
</script>

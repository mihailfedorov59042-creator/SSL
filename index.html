ный\",\"сильный — под ударением\",\"слабый — на конце слова\"], a:0, e:\"Предлог читается со следующим словом: {къ-те-бѣ}. Рус. _к тебе_.\"},\n  {q:\"Ер в предлоге {къ мьнѣ}:\", o:[\"сильный — дальше слабый ь\",\"слабый — предлоги всегда слабые\",\"слабый — дальше полный гласный\",\"сильный — под ударением\"], a:0, e:\"{мь} перед полным ѣ — слабый, значит, ер предлога сильный: _ко мне_.\"}\n ]},\n\n{id:\"tense\", topic:6, tend:\"r\", title:\"Напряжённые редуцированные\",\n lead:\"Перед j и i ъ и ь изменились в краткие ы и и.\",\n news:[\"ъ > ы̆, ь > ӣ перед j\",\"после падения — обычные и, ы\"],\n tbl:\"v\", v:{\"ы\":[\"напряжённый ъ перед j (краткий)\"],\"и\":[\"напряжённый ь перед j (краткий)\"]},\n from:[{id:\"pos\",why:\"редуцированные и их позиции\"}],\n to:[{id:\"fall\",why:\"после падения совпали с и, ы\"}],\n body:`<p>Находясь перед звуками <b>j<\/b> и <b>i<\/b>, редуцированные {ъ} и {ь} изменялись в звуки {ы} и {и}: ^*novъi^ > {новыи}, ^*sinьi^ > {синии}. Однако с ы и и они не совпадали количественно — оставались <b>краткими<\/b>. После падения редуцированных эти напряжённые звуки совпали с гласными полного образования {и} и {ы}.<\/p>\n<details class=\"ex\"><summary>Где встречаются напряжённые редуцированные<\/summary><p>Прежде всего в полных (местоименных) прилагательных: краткая форма + местоимение ^*jь^ — ^*novъ + jь^ > {новыи}. Поэтому у полных прилагательных окончания {-ыи}, {-ии}: {добрыи}, {синии}. Русские _новый, синий_ продолжают эти формы.<\/p><\/details>\n<details class=\"ex\"><summary>Почему «напряжённые»?<\/summary><p>Перед j язык уже поднят к нёбу. Краткий ъ или ь произносился напряжённее и сближался с ы, и, оставаясь кратким. Отсюда название.<\/p><\/details>`,\n ru:[[\"{новыи}\",\"_новый_\",\"ъ перед j > ы\"],[\"{синии}\",\"_синий_\",\"ь перед j > и\"]],\n tasks:[\n  {q:\"^*novъi^ > ?\", o:[\"{новыи}\",\"{новъи}\",\"{новои}\",\"{нови}\"], a:0, e:\"ъ перед j > напряжённый ы.\"},\n  {q:\"Чем напряжённые ы, и отличались от обычных?\", o:[\"были краткими\",\"были носовыми\",\"были долгими\",\"ничем\"], a:0, e:\"Совпали с полными и, ы только после падения редуцированных.\"}\n ]},\n\n{id:\"fall\", topic:6, tend:\"r\", title:\"Падение редуцированных\",\n lead:\"В X–XI вв. слабые ъ, ь утрачивались, сильные прояснялись в о и е.\",\n news:[\"слабые утрачены\",\"сильные: ъ > о, ь > е\",\"о // #, е // #\",\"новые группы согласных\"],\n tbl:\"v\", vLost:[\"ъ\",\"ь\"],\n from:[{id:\"pos\",why:\"сильная и слабая позиция\"},{id:\"tense\",why:\"напряжённые совпали с и, ы\"},{id:\"ideal\",why:\"закон открытого слога перестаёт действовать\"}],\n to:[{why:\"беглые гласные в русском: сон — сна, день — дня\"},{id:\"groups\",why:\"новые группы согласных нарушают прежние запреты\"}],\n body:`<p>В зависимости от позиции редуцированные в <b>X–XI вв.<\/b> подверглись двум изменениям: в одних условиях они <b>утрачивались<\/b>, в других — <b>прояснялись<\/b> в гласные полного образования.<\/p>\n<ul>\n<li><b>Слабые.<\/b> Как следствие редукции в старославянских памятниках встречаются написания {кто, что, много} вм. {къто, чьто, мъного} и смешение ъ и ь: {правъда, мьного, въсѣхъ} вм. {правьда, мъного, вьсѣхъ}.<\/li>\n<li><b>Сильные<\/b> переходят в гласные полного образования: ь > {е}, ъ > {о}: {конець} вм. {коньць}, {день} вм. {дьнь}.<\/li>\n<\/ul>\n<p><b>Следствия:<\/b> образовались чередования <b>о // ноль<\/b> и <b>е // ноль<\/b>, а также группы согласных, ранее невозможные в старославянском: {къде} > {кде} > {где}.<\/p>\n<details class=\"ex\"><summary>Почему падение редуцированных — конец закона открытого слога<\/summary><p>Пока ъ, ь были гласными, каждый слог оканчивался гласным. Когда слабые исчезли, слоги стали закрытыми (_сон_), а согласные встретились в новых группах: {къде} > {кде} (к перед д озвончился) > {где}. Принцип восходящей звучности перестал быть законом — ровно в тот срок, который назван на этапе «Идеальный слог».<\/p><\/details>\n<details class=\"ex\"><summary>Откуда беглые гласные в русском<\/summary><p>_Сон — сна, день — дня, отец — отца_: в начальной форме ъ/ь был сильным и стал о/е, в косвенной — слабым и исчез. Так возникли чередования о // #, е // #.<\/p><\/details>\n<details class=\"ex\"><summary>Падение редуцированных в памятниках<\/summary><p>Мариинское евангелие уже даёт {золъ} вм. {зълъ}, {день} вм. {дьнь} и мену ъ/ь — значит, писец редуцированных уже не произносил (модуль «Старославянские памятники»).<\/p><\/details>`,\n ru:[[\"{сънъ} — {съна}\",\"_сон — сна_\",\"о // #\"],[\"{дьнь} — {дьне}\",\"_день — дня_\",\"е // #\"],[\"{къде}\",\"_где_\",\"новая группа гд\"],[\"{коньць}\",\"_конец_\",\"сильный ь > е\"]],\n tasks:[\n  {q:\"{день} вм. {дьнь} в памятнике свидетельствует о:\", o:[\"прояснении сильного ь в е\",\"утрате слабого ь\",\"смешении ѣ и е\",\"второй палатализации\"], a:0, e:\"Первый ь — сильный, он прояснился.\"},\n  {q:\"{кто} вм. {къто}:\", o:[\"утрата слабого ъ\",\"прояснение сильного ъ\",\"упрощение группы согласных\",\"протеза\"], a:0, e:\"ъ перед слогом с полным гласным — слабый.\"},\n  {q:\"Какое чередование возникло после падения редуцированных?\", o:[\"о // ноль (_сон — сна_)\",\"е // о\",\"к // ч\",\"ѧ // ен\"], a:0, e:\"Беглые гласные.\"},\n  {q:\"Когда, по лекции, редуцированные изменились в старославянских памятниках?\", o:[\"в X–XI вв.\",\"в VIII–IX вв.\",\"в XIII–XIV вв.\",\"в IX в.\"], a:0, e:\"X–XI вв.\"}\n ]},\n\n/* ================= ТЕМА 7 ================= */\n{id:\"ablaut\", topic:7, tend:\"r\", title:\"Качественные и количественные чередования\",\n lead:\"Древние чередования: е || о, долгота || краткость и ступень редукции.\",\n news:[\"качественные: е || о\",\"количественные: ĕ || ē\",\"ступень редукции α, ə\",\"продление: ь || и, ъ || ы\"],\n tbl:\"ladder\",\n from:[{id:\"qq\",why:\"ĭ > ь, ī > и — рефлексы ступеней\"}],\n to:[{id:\"row\",why:\"полный ряд е || о || ѣ || а || ь || и\"}],\n body:`<p>В древнем чередовании гласных различают <b>качественные<\/b> и <b>количественные<\/b>.<\/p>\n<ul>\n<li><b>Качественные<\/b> — чередования гласных, разных по артикуляции: ĕ || ŏ или ē || ō. Например: {берѫ} — {съборъ}, {текѫ} — {въстокъ}, где гласный е определяет глагольную основу, а о — именную.<\/li>\n<li><b>Количественные<\/b> — по долготе и краткости гласных одной артикуляции: ĕ || ē или ŏ || ō.<\/li>\n<\/ul>\n<p>Качественное чередование имело <b>ступень редукции<\/b> — ослабленную ступень. Условно для кратких её обозначают α, для долгих — ə. Ряды: <b>ĕ || ŏ || α<\/b> (кратких) и <b>ē || ō || ə<\/b> (долгих).<\/p>\n<p>На ступени ослабления кратких в праславянском возможны рефлексы: ĭ > {ь}, реже ŭ > {ъ}, в единичных случаях — ноль звука. Отсюда старославянский ряд <b>е || о || ь (ъ, ноль)<\/b>: {берѫ} || {съборъ} || {бьрати}; {текѫ} || {въстокъ} || {тьци} (2 л. повел. накл.).<\/p>\n<p>Ступень ослабления могла получать <b>продление<\/b>: ĭ (ь) || ī (и), ŭ (ъ) || ū (ы): {рьци} || {нарицати}; {льнѫти} || {прилипати}; {съхнѫти} || {засыхати}.<\/p>\n<details class=\"ex\"><summary>Что такое «ступень»?<\/summary><p>Корень мог выступать в нескольких вариантах — ступенях: с е, с о, с долгим гласным, с ослабленным или без гласного. Корень ‘брать’: {бер-} (е), {-бор-} (о), {бьр-} (ь — ступень редукции); в русском есть и продление — _собирать_ (и).<\/p><\/details>\n<details class=\"ex\"><summary>Откуда здесь ь и и?<\/summary><p>Из соответствий темы 2: краткий ĭ дал {ь}, долгий ī — {и}. Поэтому ступень редукции в старославянском — ь, а её продление — и.<\/p><\/details>`,\n ru:[[\"{берѫ} — {съборъ}\",\"_беру — сбор_\",\"е || о\"],[\"{текѫ} — {въстокъ}\",\"_теку — восток_\",\"е || о\"],[\"{бьрати}\",\"_брать_\",\"ступень редукции (ь позже утрачен)\"],[\"{съхнѫти} — {засыхати}\",\"_сохнуть — засыхать_\",\"ъ || ы — продление\"]],\n tasks:[\n  {q:\"{берѫ} — {съборъ}: какое чередование?\", o:[\"качественное е || о\",\"количественное\",\"ступень редукции\",\"продление\"], a:0, e:\"Разные по артикуляции гласные.\"},\n  {q:\"Какой рефлекс ступени ослабления кратких в праславянском основной?\", o:[\"ĭ > ь (реже ŭ > ъ, ноль)\",\"ē > ѣ\",\"ŏ > а\",\"ū > ы\"], a:0, e:\"Отсюда ряд е || о || ь.\"},\n  {q:\"{рьци} || {нарицати}:\", o:[\"продление ступени редукции: ь || и\",\"е || о\",\"количественное ĕ || ē\",\"йотовое смягчение\"], a:0, e:\"ĭ || ī.\"},\n  {q:\"Какую основу определяет е в чередовании е || о?\", o:[\"глагольную\",\"именную\",\"наречную\",\"местоименную\"], a:0, e:\"е — глагол, о — имя.\"}\n ]},\n\n{id:\"row\", topic:7, tend:\"r\", title:\"Основной ряд чередований\",\n lead:\"е || о || ѣ || а || ь (ъ, ноль) || и (ы): шесть ступеней одного корня.\",\n news:[\"ступени краткости, долготы, редукции, продления\",\"ряд выводится из темы 2\"],\n tbl:\"ladder\",\n from:[{id:\"ablaut\",why:\"качественные и количественные чередования\"},{id:\"qq\",why:\"ĕ > е, ŏ > о, ē > ѣ, ō > а, ĭ > ь, ī > и\"}],\n to:[{id:\"diphalt\",why:\"тот же ряд в составе дифтонгов\"},{id:\"func\",why:\"для чего служили чередования\"}],\n body:`<p>Часто чередование в словах одного корня бывает <b>качественно-количественным<\/b>. Основной ряд в старославянском:<\/p>\n<p class=\"bigrow\">{е} || {о} || {ѣ} || {а} || {ь} (ъ, ноль) || {и} (ы)<\/p>\n<p>В этом ряду различаются <b>ступень краткости<\/b> е || о, <b>ступень долготы<\/b> ѣ || а, <b>ступень редукции<\/b> ь (ъ, ноль) и <b>ступень продления редукции<\/b> и (ы).<\/p>\n<p>Примеры: {погребѫ} || {гробъ} || {погрѣбати} || {грабити}; {рекѫ} || {пророкъ} || {нарѣкати} || {рьци} || {нарицати}.<\/p>\n<details class=\"ex\"><summary>Ряд можно не заучивать, а вывести<\/summary><p>Индоевропейские ступени ĕ || ŏ || ē || ō || ĭ || ī по правилам темы 2 дают: ĕ > {е}, ŏ > {о}, ē > {ѣ}, ō > {а}, ĭ > {ь}, ī > {и}. Это и есть старославянский ряд.<\/p><\/details>\n<details class=\"ex\"><summary>Разбор: {рекѫ} — {пророкъ} — {нарѣкати} — {рьци} — {нарицати}<\/summary><p>рек- (е, краткость) — -рок- (о, краткость) — -рѣк- (ѣ < ē, долгота) — рьц- (ь, редукция; к > ц — вторая палатализация перед и < oi̯) — -риц- (и < ī, продление; к > ц — третья палатализация после и). В одном гнезде — следы трёх тем.<\/p><\/details>`,\n ru:[[\"{погребѫ} — {гробъ}\",\"_погребать — гроб_\",\"е || о\"],[\"{нарѣкати} — {нарицати}\",\"_нарекать — нарицательный_\",\"ѣ || и\"],[\"{грабити}\",\"_грабить_\",\"а — ступень долготы о\"]],\n tasks:[\n  {q:\"Какая ступень в {погрѣбати}?\", o:[\"долготы (ѣ < ē)\",\"краткости\",\"редукции\",\"продления\"], a:0, e:\"ѣ || а — ступень долготы.\"},\n  {q:\"Из какого гласного а в {грабити}?\", o:[\"ō\",\"ŏ\",\"ĕ\",\"ĭ\"], a:0, e:\"ō > а: долгая о-ступень.\"},\n  {q:\"Продолжите ряд: {рекѫ} || {пророкъ} || {нарѣкати} || {рьци} || …\", o:[\"{нарицати}\",\"{нарекати}\",\"{нарокати}\",\"{нарыкати}\"], a:0, e:\"Ступень продления редукции — и.\"}\n ]},\n\n{id:\"diphalt\", topic:7, tend:\"r\", title:\"Чередования в составе дифтонгов и сочетаний\",\n lead:\"Одна ступень — два варианта: в закрытом и в открытом слоге.\",\n news:[\"закрытый слог — монофтонг\",\"открытый слог — гласный + j, в, н, р\"],\n tbl:null,\n from:[{id:\"row\",why:\"основной ряд\"},{id:\"diph\",why:\"ei̯, oi̯, eu̯, ou̯\"},{id:\"nas\",why:\"en, on\"},{id:\"tort\",why:\"er, or\"}],\n to:[{id:\"func\",why:\"функции чередований\"}],\n body:`<p>Если чередующийся гласный находился в составе дифтонга (ei̯ || oi̯, eu̯ || ou̯) или дифтонгического сочетания (en || on, er || or), основной ряд осложнялся: на одной и той же ступени возможны <b>два варианта<\/b> — в зависимости от того, в каком слоге (открытом или закрытом) оказался чередующийся гласный.<\/p>\n<p>Схема по ярусам, как на доске: столбцы — ступени (е, о, ослабление), строки — где оказался гласный. Верхний ярус — закрытый слог, средний — открытый, нижний — долгая ступень о и продление ослабленной ступени (Иванова §38, с. 106–108).<\/p>\n<div data-w=\"dtier\"><\/div>\n<h4>Ряды и примеры по лекции<\/h4>\n<table class=\"rules wide\">\n<tr><td>1<\/td><td>ei̯ || oi̯<\/td><td>{и}, {ьj} || {ѣ}, {оj} || {аj} || {ь} || {и}<\/td><td>{вити}, {вьѭ} || {повои} || {вѣнець}; {пити}, {пьѭ} || {напои} || {напаꙗти}<\/td><\/tr>\n<tr><td>2<\/td><td>eu̯ || ou̯<\/td><td>{ю}, {ев} || {у}, {ов} || {ав} || {ъ} || {ы}<\/td><td>{блюсти} || {будити} || {бъдѣти}, {бъдръ}; {плути}, {пловѫ} || {плавати} || {плыти}; {кровъ}, {съкровище} || {съкръвенъ} || {съкрыти}<\/td><\/tr>\n<tr><td>3<\/td><td>en || on, em || om<\/td><td>{ѧ}, {ен} || {ѫ}, {он} || {ьн} || {ин}; {ѧ}, {ем} || {ѫ}, {ом} || {ьм} || {им}<\/td><td>{звѧкъ} || {звѫкъ}, {звонъ} || {звьнѣти}; {запрѧгати} || {сѫпрѫгъ}; {трѧсти} || {трѫсъ}; {начѧти}, {начѧло} || {коньць} || {начьнѫ} || {начинати}<\/td><\/tr>\n<tr><td>4<\/td><td>er || or, el || ol<\/td><td>{рѣ}, {ер} || {ра}, {ор} || {рь}, {ьр} || {ир}; {лѣ}, {ел} || {ла}, {ол} || {ль}, {ьл} || {ил}<\/td><td>{стрѣгѫ} || {стража}; {умрѣти} || {моръ}, {морити} || {умьрѫ}, {съмрьть} || {умирати}; {позоръ}, {зракъ} || {зьрѣти}, {зрьцало} || {възирати}<\/td><\/tr>\n<\/table>\n<p>В каждом ряду первая форма пары — из <b>закрытого<\/b> слога (монофтонг: {и, ѣ, у, ѧ, ѫ, рѣ, ра}), вторая — из <b>открытого<\/b> (гласный + j, в, н, м, р, л: {ьj, оj, ов, ен, он, ер, ор}). {ь} (ъ, ьн, рь) — ступень редукции, {и} (ы, ин, ир) — продление редукции.<\/p>\n<details class=\"ex\"><summary>Главное правило этапа<\/summary><p>Закрытый слог → монофтонг; открытый слог → гласный + неслоговой элемент, ушедший в следующий слог. Это те же законы, что на этапах «Дифтонги», «Дифтонгические сочетания» и «tort/tolt», — только применённые к разным ступеням одного корня.<\/p><\/details>\n<details class=\"ex\"><summary>Разбор: {вѣнець} и {повои}<\/summary><p>Обе формы — о-ступень дифтонга oi̯. В {вѣнець} после дифтонга согласный: слог закрыт, oi̯ > {ѣ}. В {повои} после дифтонга гласный: i̯ ушёл в следующий слог, осталось {оj}.<\/p><\/details>\n<details class=\"ex\"><summary>Разбор: {звонъ} и {звѫкъ}<\/summary><p>Обе формы — о-ступень сочетания on. В {зво-нъ} n начинает следующий слог — сочетание сохраняется. В ^*zvon-kъ^ слог закрыт — on > {ѫ}: {звѫкъ}.<\/p><\/details>`,\n ru:[[\"{пѣти} — {поѭ}\",\"_петь — пою_\",\"oi̯: закрытый / открытый слог\"],[\"{плыти} — {плавати} — {пловѫ}\",\"_плыть — плавать — пловец_\",\"ы || ав || ов\"],[\"{звонъ} — {звѫкъ}\",\"_звон — звук_\",\"он || ѫ\"],[\"{умрѣти} — {моръ} — {умирати}\",\"_умереть — мор — умирать_\",\"рѣ || ор || ир\"]],\n tasks:[\n  {q:\"{звѫкъ} — {звонъ}: почему разные формы?\", o:[\"on перед согласным > ѫ, перед гласным сохраняется\",\"это разные корни\",\"ѫ появился под ударением\",\"на звонъ подействовала палатализация\"], a:0, e:\"Закрытый и открытый слог.\"},\n  {q:\"{вѣнець} — {повои}: ѣ и оj — это\", o:[\"один дифтонг oi̯ в закрытом и открытом слоге\",\"разные дифтонги\",\"ѣ из ē, оj из ō\",\"ѣ из ai̯, оj из au̯\"], a:0, e:\"о-ступень ei̯ || oi̯.\"},\n  {q:\"Какая ступень в {умирати}?\", o:[\"продление редукции (ир)\",\"краткости\",\"долготы\",\"редукции\"], a:0, e:\"ир — продление.\"}\n ]},\n\n{id:\"func\", topic:7, tend:\"r\", title:\"Функции чередований\",\n lead:\"Чередования различали глагол и имя, падежи и числа, виды основ.\",\n news:[\"е — глагол, о — имя\",\"краткие / долгие — ед. и дв. ч.\",\"долгие — длительность\"],\n tbl:null,\n from:[{id:\"ablaut\",why:\"качественные и количественные\"},{id:\"row\",why:\"основной ряд\"},{id:\"diphalt\",why:\"ряды в дифтонгах\"}],\n to:[{why:\"словообразование в русском: везти — возить, нести — носить\"}],\n body:`<p>Древние чередования имели <b>грамматическое значение<\/b>: служили средством словообразования и словоизменения. Левая колонка — одна ступень, правая — другая, посередине — какие гласные чередуются (Иванова §38, с. 108).<\/p>\n<div data-w=\"funcs\"><\/div>\n<details class=\"ex\"><summary>Почему {плодъ}, но {плода}?<\/summary><p>Им. п. ед. ч. — краткий гласный основы + s: ^*plodŏs^ > {плодъ}. Им. п. дв. ч. — долгий: ^*plodō^ > {плода} (ō > а — тема 2). Одно количественное различие — две разные формы.<\/p><\/details>\n<details class=\"ex\"><summary>Долгая ступень и вид глагола в русском<\/summary><p>_Спросить — спрашивать, звать — созывать, ждать — ожидать, плести — сплетать_: долгие ступени (а, ы, и, ѣ > е) отмечают длительность или повторяемость, а в русском — несовершенный вид.<\/p><\/details>\n<details class=\"ex\"><summary>{рьци} — двойной след<\/summary><p>В {рьци} одновременно ступень редукции (ь вместо е) и вторая палатализация (к > ц перед и < oi̯).<\/p><\/details>`,\n ru:[[\"{везѫ} — {возъ}\",\"_везу — воз_\",\"е — глагол, о — имя\"],[\"{нести} — {носити}\",\"_нести — носить_\",\"первичный || вторичный глагол\"],[\"{въпросити} — {въпрашати}\",\"_спросить — спрашивать_\",\"о || а: длительность\"],[\"{зъвати} — {съзывати}\",\"_звать — созывать_\",\"ъ || ы\"]],\n tasks:[\n  {q:\"{лежати} — {ложе}: функция чередования?\", o:[\"различает глагольную (е) и именную (о) основы\",\"различает падежи\",\"образует аорист\",\"образует повелительное наклонение\"], a:0, e:\"е — глагол, о — имя.\"},\n  {q:\"{нѣсъ} (аорист) при {нести}: какое чередование?\", o:[\"количественное ĕ || ē\",\"качественное е || о\",\"е || ь\",\"ступень продления\"], a:0, e:\"Древний сигматический аорист — долгая ступень.\"},\n  {q:\"{сынъ} — {сыны}: им. п. ед. ч. и …\", o:[\"им. п. двойственного числа\",\"им. п. множественного числа\",\"род. п. ед. ч.\",\"зв. п.\"], a:0, e:\"Краткий ŭ || долгий ū.\"},\n  {q:\"{жьдати} — {ожидати}: значение долгой ступени\", o:[\"длительность или повторяемость\",\"прошедшее время\",\"множественное число\",\"именная основа\"], a:0, e:\"ĭ || ī: первичный || длительный глагол.\"}\n ]},\n\n{id:\"consalt\", topic:7, tend:\"r\", title:\"Чередования согласных — итог\",\n lead:\"Все чередования согласных — следы трёх палатализаций и йотового смягчения.\",\n news:[\"13 рядов\",\"4 источника\"],\n tbl:\"c\",\n from:[{id:\"jot\",why:\"сочетания с j\"},{id:\"pal1\",why:\"шипящие\"},{id:\"pal2\",why:\"свистящие\"},{id:\"pal3\",why:\"свистящие\"},{id:\"soft\",why:\"к, г, х только твёрдые\"}],\n to:[{why:\"русские чередования: рука — ручной, друг — друзья, ходить — хожу — хождение\"}],\n body:`<p>Чередования согласных в старославянском и других славянских языках возникли в результате <b>трёх палатализаций<\/b> и <b>йотовой палатализации<\/b> (сочетаний с j). Нажмите на источник, чтобы вернуться к этапу.<\/p>\n<div data-w=\"consalt\"><\/div>\n<details class=\"ex\"><summary>Как по чередованию узнать процесс<\/summary><p>Шипящий (ч, ж, ш) на месте заднеязычного — первая палатализация или kj, gj, chj. Свистящий (ц, з/ѕ, с) — вторая (перед ѣ, и из дифтонгов) или третья (после и, ь, ѧ, рь). Шт, жд — сочетания с j (tj, dj, stj, zdj, skj, zgj) или ск, зг, кт перед гласными переднего ряда. Л’ после губного — эпентетический л.<\/p><\/details>`,\n ru:[[\"{рекѫ} — {речетъ} — {рьци}\",\"_реку — речёт — рцы_\",\"к // ч // ц\"],[\"{ходити} — {хождѫ}\",\"_ходить — хожу — хождение_\",\"д // жд (ж)\"],[\"{любити} — {люблѭ}\",\"_любить — люблю_\",\"б // бл’\"],[\"{другъ} — {друже} — {друзи}\",\"_друг — дружба — друзья_\",\"г // ж // з\"]],\n tasks:[\n  {q:\"т // шт ({хотѣти} — {хоштѫ}) возникло из:\", o:[\"сочетания tj\",\"первой палатализации\",\"второй палатализации\",\"третьей палатализации\"], a:0, e:\"tj > шт’.\"},\n  {q:\"в // вл’ ({ловити} — {ловлѭ}):\", o:[\"эпентетический л’ при vj\",\"первая палатализация\",\"упрощение группы\",\"протеза\"], a:0, e:\"vj > vl’.\"},\n  {q:\"г // ѕ в {кънѧѕь} — {кънѧгыни}:\", o:[\"третья палатализация\",\"вторая палатализация\",\"первая палатализация\",\"сочетание gj\"], a:0, e:\"г после ѧ > ѕ; перед ы — без изменения.\"},\n  {q:\"с // ш в {носити} — {ношѫ}:\", o:[\"сочетание sj\",\"первая палатализация\",\"вторая палатализация\",\"ск > шт\"], a:0, e:\"sj > ш’.\"}\n ]}\n];\n\n/* =========================================================\n   ЛАБОРАТОРИЯ СЛОВА: пошаговый вывод формы.\n   step: q — вопрос, o — варианты (первый верный, перемешиваются), f — форма после шага, e — пояснение, st — этап\n   ========================================================= */\nconst LAB = [\n {id:\"gord\", start:\"*gordъ\", gloss:\"город\", res:\"{градъ}\", ru:\"_город_ (полногласие)\",\n  steps:[\n   {q:\"Слог ^*gor-^ закрыт: после o стоит r, затем согласный. Что происходит у южных славян?\", o:[\"удлинение гласного: o > ō\",\"развивается второй гласный: or > oro\",\"r выпадает\",\"o > ѫ\"], f:\"*gōrdъ\", e:\"Первый шаг метатезы по лекции — удлинение гласного.\", st:\"tort\"},\n   {q:\"Во что переходит долгий ō?\", o:[\"а\",\"о\",\"ы\",\"ѫ\"], f:\"*gardъ\", e:\"ō > а — правило темы 2.\", st:\"qq\"},\n   {q:\"Как теперь открыть слог ^*gar-^?\", o:[\"перестановка гласного и плавного: ar > ra\",\"r переходит в л\",\"а выпадает\",\"перед r развивается гласный\"], f:\"*gradъ\", e:\"Метатеза: слог ^gra-^ открыт.\", st:\"tort\"}\n  ], note:\"У восточных славян вместо метатезы — полногласие: ^*gordъ > *gorodъ^ > _город_.\"},\n {id:\"melko\", start:\"*melko\", gloss:\"молоко\", res:\"{млѣко}\", ru:\"_молоко_\",\n  steps:[\n   {q:\"Сочетание el в закрытом слоге ^*mel-^. Что происходит у южных славян?\", o:[\"удлинение и перестановка: el > lē\",\"полногласие: el > olo\",\"l выпадает\",\"e > ѧ\"], f:\"*mlēko\", e:\"Метатеза с удлинением.\", st:\"tort\"},\n   {q:\"Во что переходит долгий ē?\", o:[\"ѣ\",\"е\",\"и\",\"а\"], f:\"*mlѣko\", e:\"ē > ѣ — правило темы 2.\", st:\"qq\"}\n  ], note:\"У восточных славян e перед l перешёл в o, затем развился второй гласный: _молоко_.\"},\n {id:\"vremen\", start:\"*vertmen\", gloss:\"время\", res:\"{врѣмѧ}\", ru:\"_время_ (старославянизм; др.-рус. _веремя_)\",\n  steps:[\n   {q:\"Какая группа согласных нарушает строение слога?\", o:[\"tm\",\"rt\",\"er\",\"en\"], f:\"*vermen\", e:\"tm > m: группа упрощается.\", st:\"groups\"},\n   {q:\"Слог ^*ver-^ закрыт. Что происходит?\", o:[\"метатеза с удлинением: er > rē > рѣ\",\"полногласие: er > ere\",\"r выпадает\",\"e > ь\"], f:\"*vrѣmen\", e:\"Как в {брѣгъ}.\", st:\"tort\"},\n   {q:\"Сочетание en на конце слова:\", o:[\"даёт носовой ѧ\",\"сохраняется\",\"даёт ѫ\",\"выпадает\"], f:\"*vrѣmę\", e:\"Гласный переднего ряда + n в закрытом слоге > ѧ.\", st:\"nas\"}\n  ], note:\"В косвенных падежах n уходит в следующий слог: {врѣмене}. Русское _время_ пришло из старославянского; исконное древнерусское — _веремя_.\"},\n {id:\"chodjo\", start:\"*chodjǫ\", gloss:\"хожу\", res:\"{хождѫ}\", ru:\"_хожу_ / _хождение_\",\n  steps:[\n   {q:\"Слог ^*chod-^ закрыт. Куда уходит d?\", o:[\"в следующий слог: *cho-djǫ\",\"выпадает\",\"остаётся на месте\",\"переходит в т\"], f:\"*cho-djǫ\", e:\"Закон открытого слога: согласный отходит к следующему слогу.\", st:\"ideal\"},\n   {q:\"Сочетание dj у южных славян:\", o:[\"жд’\",\"ж’\",\"dz’\",\"д’\"], f:\"*chožd’ǫ\", e:\"dj > жд’; у восточных — ж’ (_хожу_), у западных — dz’.\", st:\"jot\"}\n  ], note:\"Конечный ǫ ({ѫ}) — из сочетания гласного с носовым (тема 3).\"},\n {id:\"kaina\", start:\"*kai̯na\", gloss:\"цена\", res:\"{цѣна}\", ru:\"_цена_\",\n  steps:[\n   {q:\"Дифтонг ai̯ перед согласным:\", o:[\"ai̯ > ѣ\",\"ai̯ > a + j\",\"ai̯ > и\",\"ai̯ > у\"], f:\"*kěna\", e:\"Монофтонгизация в закрытом слоге.\", st:\"diph\"},\n   {q:\"Что происходит с к перед новым ѣ?\", o:[\"к > ц (вторая палатализация)\",\"к > ч (первая палатализация)\",\"не меняется\",\"к > ш\"], f:\"*cěna\", e:\"Новый ѣ из дифтонга появился после первой палатализации.\", st:\"pal2\"}\n  ], note:\"Сравните {вѣкъ} — {вѣчьнъ}: там к стоит перед исконным ь, и сработала первая палатализация.\"},\n {id:\"begeti\", start:\"*bēgēti\", gloss:\"бежать\", res:\"{бѣжати}\", ru:\"_бежать_\",\n  steps:[\n   {q:\"г перед гласным переднего ряда ē:\", o:[\"г > ж (первая палатализация)\",\"г > з (вторая)\",\"г > ѕ (третья)\",\"не меняется\"], f:\"*bēžēti\", e:\"Исконный гласный переднего ряда — первая палатализация.\", st:\"pal1\"},\n   {q:\"Что происходит с ē после нового шипящего ж?\", o:[\"ē > а\",\"ē > ѣ\",\"ē > и\",\"ē > е\"], f:\"*bēžati\", e:\"Особый источник а: «ē после шипящих».\", st:\"pal1\"},\n   {q:\"А корневой ē?\", o:[\"ē > ѣ\",\"ē > а\",\"ē > е\",\"ē > и\"], f:\"*bѣžati\", e:\"Обычное правило темы 2.\", st:\"qq\"}\n  ], note:\"Так же {крикъ} — {кричати}, {слухъ} — {слышати}.\"},\n {id:\"otьkъ\", start:\"*otьkъ\", gloss:\"отец\", res:\"{отьць}\", ru:\"_отец_\",\n  steps:[\n   {q:\"к стоит после ь. Что происходит?\", o:[\"к > ц (третья палатализация)\",\"к > ч (первая)\",\"к > ц (вторая)\",\"не меняется\"], f:\"*otьcъ\", e:\"Прогрессивная палатализация: влияет предшествующий ь.\", st:\"pal3\"},\n   {q:\"Что происходит с конечным ъ после мягкого ц?\", o:[\"заменяется на ь\",\"выпадает\",\"переходит в о\",\"остаётся ъ\"], f:\"*otьcь\", e:\"После мягких согласных ъ сменялся на ь.\", st:\"pal3\"}\n  ], note:\"Русское _отец_: первый ь сильный (> е), конечный слабый (исчез).\"},\n {id:\"pekti\", start:\"*pekti\", gloss:\"печь\", res:\"{пешти}\", ru:\"_печь_\",\n  steps:[\n   {q:\"Группа kt перед гласным переднего ряда i:\", o:[\"kt > шт\",\"kt > т\",\"kt > ч\",\"kt > ст\"], f:\"*pešti\", e:\"Перед гласным переднего ряда kt даёт шт; в остальных случаях k выпадает ({плетѫ}).\", st:\"groups\"}\n  ], note:\"У восточных славян kt здесь дал ч: _печь, мочь, речь_.\"},\n {id:\"vedti\", start:\"*vedti\", gloss:\"вести\", res:\"{вести}\", ru:\"_вести_\",\n  steps:[\n   {q:\"Группа dt:\", o:[\"dt > st (расподобление)\",\"dt > t\",\"dt > d\",\"dt > жд\"], f:\"*vesti\", e:\"Два зубных взрывных подряд (tt, dt): первый становится щелевым с — расподобление.\", st:\"groups\"}\n  ], note:\"Корень с д виден в {ведѫ}, _веду_.\"},\n {id:\"orvьnъ\", start:\"*orvьnъ\", gloss:\"ровный / равный\", res:\"{равьнъ}\", ru:\"_ровный_ / _равный_\",\n  steps:[\n   {q:\"Начальное or перед согласным у южных славян:\", o:[\"ра- (при любой интонации)\",\"ро-\",\"оро-\",\"ре-\"], f:\"*ravьnъ\", e:\"Перестановка с удлинением, ō > а.\", st:\"ort\"}\n  ], note:\"У восточных славян при нисходящей интонации — ро-: _ровный_. _Равный_ — старославянизм.\"},\n {id:\"pъlnъ\", start:\"*pъlnъ\", gloss:\"полный\", res:\"{плънъ}\", ru:\"_полный_\",\n  steps:[\n   {q:\"Сочетание ъl между согласными у южных славян:\", o:[\"перестановка: lъ, l становится слоговым\",\"полногласие\",\"ъ выпадает, l остаётся >Редукция<\/th><th>Продление<\/th><\/tr>\n<tr><td>основной<\/td><td>е || о<\/td><td>ѣ || а<\/td><td>ь (ъ, ноль)<\/td><td>и (ы)<\/td><\/tr>\n<\/table><p class=\"sum-note\">Ряды в составе дифтонгов и сочетаний — по ярусам (Иванова §38, с. 106–108):<\/p><div data-w=\"dtier\"><\/div>`},\n {id:\"s-cons\", t:\"Чередования согласных и их источники\", st:\"consalt\", html:`<div data-w=\"consalt\"><\/div>`}\n];\n\n/* =========================================================\n   ГЛОССАРИЙ И ЗНАКИ\n   ========================================================= */\nconst SIGNS = [\n [\"*\",\"реконструированная (незасвидетельствованная) форма\",\"^*gordъ^\"],\n [\">\",\"перешло в\",\"ē > ѣ\"],\n [\"<\",\"произошло из\",\"ѣ < ē\"],\n [\"|| , //\",\"чередуется с\",\"е || о; к // ч\"],\n [\"#\",\"ноль звука\",\"о // #: _сон — сна_\"],\n [\"˘ (ĭ, ŭ, ĕ, ă, ŏ)\",\"краткий гласный\",\"ĭ > ь\"],\n [\"¯ (ī, ū, ē, ā, ō)\",\"долгий гласный\",\"ī > и\"],\n [\"i̯, u̯\",\"неслоговые элементы дифтонга (близки к j, v)\",\"ai̯, ou̯\"],\n [\"ę, ǫ\",\"носовые гласные (= ѧ, ѫ)\",\"en > ę\"],\n [\"r̥, l̥\",\"слоговые плавные\",\"^tr̥gъ^ ({тръгъ})\"],\n [\"<span class='lr'>r<sup>ъ<\/sup><\/span>, <span class='lr'>l<sup>ь<\/sup><\/span>\",\"долгий плавный с призвуком редуцированного: ъ, ь мелко сверху, одна черта — долгота всего сочетания\",\"^t<span class='lr'>r<sup>ъ<\/sup><\/span>t^\"],\n [\"’\",\"мягкость согласного\",\"č’, р’\"],\n [\"˙\",\"полумягкость\",\"{раб˙и}\"],\n [\"α, ə\",\"ступень редукции кратких / долгих гласных\",\"ĕ || ŏ || α\"],\n [\"´\",\"ударение\",\"{дъ́скѫ}\"],\n [\"-\",\"граница слога или морфемы\",\"^*pla-kjǫ^\"]\n];\nconst ABBR = [[\"ст.-сл.\",\"старославянский\"],[\"др.-рус.\",\"древнерусский\"],[\"юж.-сл.\",\"южнославянский\"],[\"вост.-сл.\",\"восточнославянский\"],[\"зап.-сл.\",\"западнославянский\"],[\"польск., чеш., слвц., словен., серб., болг.\",\"польский, чешский, словацкий, словенский, сербский, болгарский\"],[\"лат.\",\"латинский\"],[\"им. п., в. п., зв. п.\",\"имени \"a\">→<\/div><div class=\"b\" style=\"--tc:var(--umbra)\"><b>3. Вторая палатализация<\/b>к > ц перед новыми ѣ, и: {цѣна}<\/div><\/div>`,\n  yus:()=>`<div class=\"tbl-scroll\"><table class=\"sum\"><tr><th>Юс<\/th><th>Рефлексы по лекции<\/th><\/tr>\n    <tr><td>{ѧ}<\/td><td>е — южнославянские; я [’а] — восточнославянские; носовой сохранился — польский, кашубский<\/td><\/tr>\n    <tr><td>{ѫ}<\/td><td>ъ — болгарский; о — словенский; у — сербский, чешский, словацкий, восточнославянские; носовой сохранился — польский, кашубский<\/td><\/tr><\/table><\/div>`,\n  havlik:()=>`<div class=\"havlik\"><h5>Как определить позицию: идём от конца слова<\/h5><ol>\n    <li>Конечный ъ или ь — <b>слабый<\/b> (а).<\/li><li>Двигаемся к началу. Редуцированный перед слогом с <b>полным<\/b> гласным — слабый (б).<\/li>\n    <li>Перед слогом со <b>слабым<\/b> редуцированным — сильный (б).<\/li><li>Перед слогом с <b>сильным<\/b> — слабый (в).<\/li>\n    <li>Особые случаи: ер <b>под ударением<\/b> — сильный всегда; ударные {нъ, тъ, сь} — сильные всегда; ер в предлоге — по первому слогу следующего слова (обычно слабый).<\/li><\/ol>\n    <h5>Разобрать слово<\/h5><div class=\"hv-words\">${HV_WORDS.map(w=>`<button class=\"chipb\" data-hv=\"${w}\" aria-pressed=\"false\">${w}<\/button>`).join(\"\")}<\/div><div class=\"hv-out\" id=\"hvOut\">Выбери слово — разбор пойдёт с конца.<\/div><\/div>`,\n  consalt:()=>`<div class=\"cons\">${CONSALT.map(r=>`<div class=\"r\"><b>${r[0]}<\/b><div class=\"src\">${r[1].map(x=>`<button data-go=\"${x[1]}\" data-t=\"${byId[x[1]].tend}\">${x[0]}: ${fmt(x[2])}<\/button>`).join(\"\")}<\/div><\/div>`).join(\"\")}<\/div>`\n};\nconst HV_WORDS=[\"сънъ\",\"съна\",\"отьць\",\"отьца\",\"чьтьць\",\"жьньць\",\"пѣсъкъ\",\"дьнь\",\"мъного\",\"ловьць\",\"шьвьць\",\"дъва\"];\nconst HV_RU={\"сънъ\":\"сон\",\"съна\":\"сна\",\"отьць\":\"отец\",\"отьца\":\"отца\",\"чьтьць\":\"чтец\",\"жьньць\":\"жнец\",\"пѣсъкъ\":\"песок\",\"дьнь\":\"день\",\"мъного\":\"много\",\"ловьць\":\"ловец\",\"шьвьць\":\"швец\",\"дъва\":\"два\"};\nconst VOW=\"аеиоуыѣѧѫюꙗѥѩѭъь\";\nfunction havlik(w){\n  const ch=[...w], vi=ch.map((c,i)=>VOW.includes(c)?i:-1).filter(i=>i>=0), res={}, steps=[];\n  if(vi.length===1 && \"ъь\".includes(ch[vi[0]])){ if([\"нъ\",\"тъ\",\"сь\"].includes(w)){ res[vi[0]]=\"s\"; steps.push(`{${w}} — ударное односложное слово: ер сильный всегда (в).`); } else { res[vi[0]]=\"w\"; steps.push(`{${w}} — безударное односложное слово: позицию определяют по следующему слову, обычно слабая.`); } return {res,steps}; }\n  for(let k=vi.length-1;k>=0;k--){\n    const i=vi[k], c=ch[i]; if(!\"ъь\".includes(c)) continue;\n    if(k===vi.length-1){ res[i]=\"w\"; steps.push(`{${c}} на конце слова — слабый (а).`); continue; }\n    const nx=vi[k+1], nc=ch[nx];\n    if(!\"ъь\".includes(nc)){ res[i]=\"w\"; steps.push(`{${c}} перед слогом с полным гласным {${nc}} — слабый (б).`); }\n    else if(res[nx]===\"w\"){ res[i]=\"s\"; steps.push(`{${c}} перед слогом со слабым {${nc}} — сильный (б).`); }\n    else { res[i]=\"w\"; steps.push(`{${c}} перед слогом с сильным {${nc}} — слабый (в).`); }\n  }\n  return {res,steps};\n}\nfunction fillWidgets(root){\n  $$(\"[data-w]\",root).forEach(d=>{ const f=W[d.dataset.w]; if(f) d.outerHTML=fmt(f()); });\n  $$(\"[data-hv]\",root).forEach(b=>b.addEventListener(\"click\",()=>{\n    $$(\"[data-hv]\",root).forEach(x=>x.setAttribute(\"aria-pressed\",x===b));\n    const w=b.dataset.hv, {res,steps}=havlik(w);\n    const word=[...w].map((c,i)=>res[i]?`<span class=\"${res[i]===\"s\"?\"s\":\"wk\"}\">${c}<\/span>`:c).join(\"\");\n    $(\"#hvOut\").innerHTML=`<div class=\"w\">${word}<\/div><ol>${steps.map(s=>`<li>${fmt(s)}<\/li>`).join(\"\")}<\/ol>Русский: <i class=\"ru\">${HV_RU[w]}<\/i> — сильные дали о / е, слабые исчезли.`;\n  }));\n}\n\n/* ---------- лаборатория ---------- */\nlet lab={id:null,pos:0,orders:{},msg:\"\"};\nfunction renderLabList(){\n  $(\"#labList\").innerHTML=LAB.map(w=>`<button class=\"lw\" data-lab=\"${w.id}\" aria-current=\"${lab.id===w.id}\"><span class=\"f\">${w.start}<\/span><small>${w.gloss}${S.labDone.includes(w.id)?' · <span class=\"d\">выведено ✓<\/span>':\"\"}<\/small><\/button>`).join(\"\");\n}\nfunction startLab(id){ lab={id,pos:0,orders:{},msg:\"\"}; renderLabList(); renderLabWork(); }\nfunction renderLabWork(){\n  const w=LAB.find(x=>x.id===lab.id);\n  if(!w){ $(\"#labWork\").innerHTML=`<p class=\"muted\" style=\"font-family:var(--font-ui);margin:0\">Выбери слово слева. На каждом шаге нужно назвать процесс, который действует на форму; форма будет меняться у тебя на глазах.<\/p>`; return; }\n  const forms=[w.start, ...w.steps.slice(0,lab.pos).map(s=>s.f)];\n  const chain=forms.map((f,i)=>`<span class=\"${i===forms.length-1?\"cur\":\"\"}\">${f}<\/span>`).join('<span class=\"ar\">→<\/span>');\n  const done=w.steps.slice(0,lab.pos).map((s,i)=>`<div>Шаг ${i+1}: <b>${fmt(s.o[0])}<\/b> — ${fmt(s.e)} <button class=\"link\" data-go=\"${s.st}\">${byId[s.st].title}<\/button><\/div>`).join(\"\");\n  let cur=\"\";\n  if(lab.pos<w.steps.length){\n    const s=w.steps[lab.pos]; const ord=lab.orders[lab.pos]||(lab.orders[lab.pos]=shuffle(s.o.map((o,i)=>i)));\n    cur=`<div class=\"lab-step\"><p class=\"q\">Шаг ${lab.pos+1} из ${w.steps.length}. ${fmt(s.q)}<\/p><div class=\"opts\">${ord.map(i=>`<button class=\"opt\" data-lo=\"${i}\">${fmt(s.o[i])}<\/button>`).join(\"\")}<\/div>${lab.msg}<\/div>`;\n  } else {\n    const sts=[...new Set(w.steps.map(s=>s.st))];\n    cur=`<div class=\"lab-res\"><div class=\"big\">${fmt(w.res)}<\/div><p>Русский: ${fmt(w.ru)}<\/p><p>${fmt(w.note)}<\/p>\n      <p class=\"muted\" style=\"font-family:var(--font-ui);font-size:13px;margin-top:10px\">Сработавшие этапы маршрута:<\/p><div class=\"chips\">${sts.map(id=>`<button class=\"stchip\" data-go=\"${id}\" data-t=\"${byId[id].tend}\">${byId[id].title}<\/button>`).join(\"\")}<\/div>\n      <div style=\"display:flex;gap:8px;margin-top:14px;flex-wrap:wrap\"><button class=\"btn\" data-labreset>Пройти заново<\/button>${nextLabId(w.id)?`<button class=\"btn primary\" data-labnext=\"${nextLabId(w.id)}\">Следующее слово<\/button>`:\"\"}<\/div><\/div>`;\n  }\n  $(\"#labWork\").innerHTML=`<div class=\"eyebrow\">Праформа · ${w.gloss}<\/div><div class=\"lab-chain\">${chain}<\/div>${done?`<div class=\"lab-done\">${done}<\/div>`:\"\"}${cur}`;\n}\nfunction nextLabId(id){ const i=LAB.findIndex(x=>x.id===id); return LAB[i+1]?LAB[i+1].id:null; }\n$(\"#labList\").addEventListener(\"click\",e=>{ const b=e.target.closest(\"[data-lab]\"); if(b) startLab(b.dataset.lab); });\n$(\"#labWork\").addEventListener(\"click\",e=>{\n  const o=e.target.closest(\"[data-lo]\");\n  if(o){\n    const w=LAB.find(x=>x.id===lab.id), s=w.steps[lab.pos];\n    if(+o.dataset.lo===0){ lab.pos++; lab.msg=\"\"; if(lab.pos>=w.steps.length && !S.labDone.includes(w.id)){ S.labDone.push(w.id); save(); } renderLabList(); renderLabWork(); }\n    else { lab.msg=`<div class=\"fb\"><b class=\"no\">Не то.<\/b> Подсказка: ${fmt(s.e)} Этап: <button class=\"link\" data-go=\"${s.st}\">${byId[s.st].title}<\/button>.<\/div>`; renderLabWork(); }\n    return;\n  }\n  if(e.target.closest(\"[data-labreset]\")){ startLab(lab.id); return; }\n  const n=e.target.closest(\"[data-labnext]\"); if(n) startLab(n.dataset.labnext);\n});\n\n/* ---------- сводные таблицы, глоссарий ---------- */\nfunction renderSummary(){\n  $(\"#sumToc\").innerHTML=SUMMARY.map(x=>`<button data-sum=\"${x.id}\">${x.t}<\/button>`).join(\"\");\n  $(\"#sumBody\").innerHTML=SUMMARY.map(x=>`<section class=\"sumcard\" id=\"${x.id}\"><h3>${x.t}<button class=\"link\" data-go=\"${x.st}\">к этапу «${byId[x.st].title}»<\/button><\/h3>${x.html.startsWith(\"<table\")?`<div class=\"tbl-scroll\">${x.html.replace(/(<\\/table>)([\\s\\S]*)$/,\"$1<\/div>$2\")}`:x.html}<\/section>`).join(\"\");\n  $(\"#sumBody\").innerHTML=fmt($(\"#sumBody\").innerHTML);\n  fillWidgets($(\"#sumBody\"));\n  linkChains($(\"#sumBody\"));\n  $(\"#sumToc\").addEventListener(\"click\",e=>{ const b=e.target.closest(\"[data-sum]\"); if(b){ const el=document.getElementById(b.dataset.sum); window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-60}); } });\n}\nfunction renderGloss(){\n  $(\"#signs\").innerHTML=SIGNS.map(s=>`<tr><td>${s[0]}<\/td><td>${s[1]}<\/td><td>${fmt(s[2])}<\/td><\/tr>`).join(\"\");\n  $(\"#abbr\").innerHTML=ABBR.map(s=>`<tr><td style=\"font-family:var(--font-ui);font-size:14.5px\">${s[0]}<\/td><td>${s[1]}<\/td><\/tr>`).join(\"\");\n  $(\"#terms\").innerHTML=TERMS.map(t=>`<div class=\"term\"><dt>${t.t}<\/dt><dd>${fmt(t.d)}<\/dd><button class=\"link\" data-go=\"${t.st}\">→ ${byId[t.st].title}<\/button><\/div>`).join(\"\");\n}\n\n/* ---------- старт ---------- */\nrenderRoute(); renderLabList(); renderLabWork(); renderSummary(); renderGloss();\n(function(){\n  const h=(location.hash||\"\").slice(1);\n  if(byId[h]){ S.stage=h; renderRoute(); show(\"route\",false); }\n  else if(TABS.includes(h)) show(h,false);\n  else show(\"route\",false);\n})();\n\n<\/script>\n\n<\/body><\/html>";
const DOC_NOUN = "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<title>Имя существительное<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Ponomar&display=swap\">\n<style>\n/* Layout: шапка → липкие вкладки → панель. Главная панель «Склонение»: шесть карточек типов сверху, под ними парадигма выбранного типа.\n   Цвета — те же пигменты, что в «Фонетике»: киноварь — окончание, умбра — суффикс основы, лазурь — пояснения. */\n:root{\n  --bg:#F2F3EF; --surface:#FFFFFF; --surface-2:#E9EBE5; --ink:#1A1D24; --muted:#5A5F68; --faint:#A9ADA4; --line:#D5D8D0;\n  --kinovar:#AE3720; --lazur:#2D4B8E; --yar:#1C6A57; --umbra:#85652F; --ok:#2A7A4A; --bad:#B42318;\n  --font-ustav:'Ponomar','Literata',Georgia,serif;\n  --font-text:'Literata','PT Serif',Georgia,'Times New Roman',serif;\n  --font-ui:'Golos Text','PT Sans','Segoe UI',system-ui,sans-serif;\n  --font-rec:'Noto Serif','Literata',Georgia,serif;\n  --r:10px;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#14161B; --surface:#1C1F26; --surface-2:#252930; --ink:#E7E5DF; --muted:#A0A5AD; --faint:#5C616A; --line:#31353D;\n  --kinovar:#E2694C; --lazur:#93ABEE; --yar:#4DB59B; --umbra:#D0A768; --ok:#5CC48A; --bad:#F07167; color-scheme:dark;}}\n:root[data-theme=\"dark\"]{\n  --bg:#14161B; --surface:#1C1F26; --surface-2:#252930; --ink:#E7E5DF; --muted:#A0A5AD; --faint:#5C616A; --line:#31353D;\n  --kinovar:#E2694C; --lazur:#93ABEE; --yar:#4DB59B; --umbra:#D0A768; --ok:#5CC48A; --bad:#F07167; color-scheme:dark;}\n\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--font-text);font-size:17px;line-height:1.6}\n.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}\n@media (max-width:480px){.wrap{padding-inline:16px} body{font-size:16px}}\nbutton{font:inherit;color:inherit}\n:focus-visible{outline:2px solid var(--kinovar);outline-offset:2px;border-radius:4px}\n.ocs{font-family:var(--font-ustav);font-size:1.12em;letter-spacing:.01em}\n.rec{font-family:var(--font-rec);font-style:italic;font-size:.97em}\n.ru{font-style:italic}\nh2,h3,h4{text-wrap:balance;line-height:1.25}\n.muted{color:var(--muted)}\n\n.masthead{padding-block:34px 16px}\n.eyebrow{font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}\n.masthead h1{font-family:var(--font-ustav);font-weight:400;font-size:clamp(36px,6.4vw,60px);line-height:1.02;margin:10px 0 12px;text-wrap:balance}\n.masthead h1 .ini{color:var(--kinovar);font-size:1.18em;line-height:.8}\n.lede{font-family:var(--font-ui);font-size:15px;line-height:1.55;color:var(--muted);max-width:74ch;margin:0}\n\n.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}\n.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:8px}\n.tabs-in::-webkit-scrollbar{display:none}\n.tab{font-family:var(--font-ui);font-size:14.5px;font-weight:500;padding:8px 12px;border:0;border-radius:8px;background:none;color:var(--muted);white-space:nowrap;cursor:pointer}\n.tab:hover{color:var(--ink);background:var(--surface-2)}\n.tab[aria-selected=\"true\"]{color .opt{display:block;width:100%;text-align:left;font-size:16px;line-height:1.4;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);cursor:pointer}\n.opt:hover:not(:disabled){border-color:var(--muted)}\n.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}\n.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}\n.opt:disabled{cursor:default}\n.fb{margin-top:10px;font-size:15.5px;padding:9px 12px;border-radius:7px;background:var(--surface-2)}\n.fb b.ok{color:var(--ok)} .fb b.no{color:var(--bad)}\n.btn{font-family:var(--font-ui);font-size:14px;font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}\n.btn:hover{border-color:var(--muted)}\n.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}\n.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--kinovar) 60%,transparent);text-underline-offset:3px;text-decoration-thickness:1.5px;font:inherit}\n.link:hover{color:var(--kinovar)}\n.next-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}\n\n/* --- тетрадь --- */\n.nb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;max-width:820px}\n.nb h4{font-family:var(--font-ui);font-size:14.5px;font-weight:700;margin:16px 0 4px}\n.nb h4:first-child{margin-top:0}\n.nb ul{margin:2px 0 0;padding-left:1.15em;font-size:16px}\n.nb li{margin-bottom:2px}\n.nb .sch{font-family:var(--font-ui);font-size:14px;background:var(--surface-2);border-radius:7px;padding:8px 12px;margin:6px 0;line-height:1.55;overflow-x:auto;white-space:nowrap}\n.nb .sch .ocs{font-size:17px}\n.copyrow{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}\n.copied{font-family:var(--font-ui);font-size:13px;color:var(--ok)}\n<\/style>\n\n<header class=\"wrap masthead\">\n  <div class=\"eyebrow\">Старославянский язык · лекция 6 · морфология<\/div>\n  <h1><span class=\"ini\">И<\/span>мя существительное<\/h1>\n  <p class=\"lede\">В порядке презентации: словообразование, категории числа и падежа, шесть типов склонения, праформы. Окончания выделены киноварью, суффиксы основы — охрой.<\/p>\n<\/header>\n\n<nav class=\"tabs\" aria-label=\"Разделы\">\n  <div class=\"wrap tabs-in\" role=\"tablist\" id=\"tabs\">\n    <button class=\"tab\" role=\"tab\" data-tab=\"wf\">1. Словообразование<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"num\">2. Число и падеж<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"decl\">3. Склонение<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"pf\">4. Праформы<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"drill\">Тренажёр<\/button>\n    <button class=\"tab\" role=\"tab\" data-tab=\"nb\">В тетрадь<\/button>\n  <\/div>\n<\/nav>\n\n<main class=\"wrap\">\n  <section class=\"panel\" id=\"p-decl\" role=\"tabpanel\" hidden>\n    <h2>Склонение имени существительного<\/h2>\n    <p>В общеславянском языке имена существительные распределялись по следующим типам склонения:<\/p>\n    <ol class=\"tlist\" id=\"tlist\"><\/ol>\n    <p>Однако из-за пережитых фонетических изменений древнее распределение стало утрачиваться: тематический гласный основы перестал выделяться во всех падежных формах парадигмы и отошёл к флексии. Окончания существительных разных типов во многих случаях совпали, и типы стали взаимодействовать. Перегруппировка типов происходила на основе <b>родовой принадлежности<\/b>.<\/p>\n    <div class=\"why\">\n      <div class=\"b\"><b>1. Фонетические изменения<\/b>тематический гласный основы перестал выделяться в падежных формах<\/div><div class=\"a\">→<\/div>\n      <div class=\"b\"><b>2. Гласный отошёл к флексии<\/b>основа *rybā- → рыб- + окончание -а<\/div><div class=\"a\">→<\/div>\n      <div class=\"b\"><b>3. Окончания совпали<\/b>типы взаимодействуют; перегруппировка — по <b>роду<\/b><\/div>\n    <\/div>\n    <div class=\"tstep\" id=\"tstep\" role=\"tablist\" aria-label=\"Тип склонения\"><\/div>\n    <div id=\"para\"><\/div>\n    <div class=\"key\" id=\"key\"><\/div>\n    <p class=\"refs\">По слайдам лекции. В учебниках: <span class=\"src\">Ив. §45–50, с. 117–125<\/span><span class=\"src\">Р. §110–114, с. 180–192<\/span><span class=\"src\">К. §38–39, с. 75–84<\/span><\/p>\n  <\/section>\n\n  <section class=\"panel\" id=\"p-pf\" role=\"tabpanel\" hidden>\n    <h2>4. Праформы: откуда окончания<\/h2>\n    <p class=\"intro\">Слайды лекции дают праславянские формы для трёх типов. Нажми на строку — внизу появится, какой фонетический закон превратил праформу в старославянскую.<\/p>\n    <div class=\"pfsel\" id=\"pfsel\"><\/div>\n    <div class=\"tbl\" id=\"pftbl\"><\/div>\n    <div class=\"pfwhy\" id=\"pfwhy\">Нажми на строку таблицы.<\/div>\n    <div class=\"block-h\">Законы, которые делают окончания<\/div>\n    <div class=\"laws\" id=\"laws\"><\/div>\n  <\/section>\n\n  <section class=\"panel\" id=\"p-num\" role=\"tabpanel\" hidden>\n    <h2>2. Категории числа и падежа<\/h2>\n    <p class=\"intro\">Три числа и семь падежных форм. Главное отличие от русского — двойственное число, местный без предлога и звательная форма.<\/p>\n    <div id=\"numBody\"><\/div>\n  <\/section>\n\n  <section class=\"panel\" id=\"p-wf\" role=\"tabpanel\" hidden>\n    <h2>1. Словообразование существительных<\/h2>\n    <p class=\"intro\">Суффиксы по слайду лекции, сгруппированы по значению. Суффикс в примерах выделен.<\/p>\n    <div id=\"wfBody\"><\/div>\n  <\/section>\n\n  <section class=\"panel\" id=\"p-drill\" role=\"tabpanel\" hidden>\n    <h2>Тренажёр<\/h2>\n    <p class=\"intro\">Вопросы по всей лекции и бесконечная «форма» — поставить слово в падеж по парадигме. Неверный ответ показывает правило.<\/p>\n    <div class=\"drill-top\"><div class=\"numseg\" id=\"dmode\" role=\"group\" aria-label=\"Режим\"><\/div><span class=\"score\" id=\"score\"><\/span><\/div>\n    <div id=\"drillBox\"><\/div>\n  <\/section>\n\n  <section class=\"panel\" id=\"p-nb\" role=\"tabpanel\" hidden>\n    <h2>В тетрадь<\/h2>\n    <p class=\"intro\">Сжатый конспект лекции: словосочетания и схемы.<\/p>\n    <div class=\"copyrow\"><button class=\"btn primary\" id=\"copyNb\">Скопировать текст<\/button><span class=\"copied\" id=\"copied\"><\/span><\/div>\n    <div class=\"nb\" id=\"nbBody\"><\/div>\n  <\/section>\n<\/main>\n\n<script>\n/* Разметка в строках: {…} — старославянское, ^…^ — праформа, _…_ — русское. */\nconst $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];\nconst fmt=s=>(s||\"\").replace(/\\{([^}]+)\\}/g,'<span class=\"ocs\">$1<\/span>').replace(/\\^([^\\^]+)\\^/g,'<span class=\"rec\">$1<\/span>').replace(/_([^_]+)_/g,'<i class=\"ru\">$1<\/i>');\nconst shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\nconst store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};\nconst saved=store.get(\"noun-v2\")||{};\nconst S={tab:saved.tab||\"wf\", type:saved.type||\"a\", pf:\"a\", pfRow:null, mode:\"q\", qDone:saved.qDone||[], right:0, total:0};\nfunction save(){ store.set(\"noun-v2\",{tab:S.tab,type:S.type,qDone:S.qDone}); }\n\n/* ================= ПАРАДИГМЫ (по слайдам лекции) ================= */\nconst CASES_SG=[\"И.\",\"Р.\",\"Д.\",\"В.\",\"Т.\",\"М.\",\"Зв.\"], CASES_PL=[\"И.\",\"Р.\",\"Д.\",\"В.\",\"Т.\",\"М.\"], CASES_DU=[\"И.-В.\",\"Р.-М.\",\"Д.-Т.\"];\nconst TYPES=[\n{id:\"a\", no:1, key:\"*ā\", gender:\"ж. р. и немного м. р.\", nomEnd:\"-а, -ꙗ\", gen:\"-ы / -ѩ\", ex:\"рыба, землꙗ\",\n lead:\"Самый продуктивный тип. Женский род и небольшое число слов мужского рода.\",\n members:[\"на {-а, -ꙗ}: {вода, жена, волꙗ}; м. р. {юноша, воевода}\",\"с суффиксом {-ыни}: {милостыни, богыни, рабыни}\",\"с суффиксом {-ии} (ж. и м. ьны} (жернов), {цѣлы} (исцеление), {неплоды} (бесплодная женщина), {свекры} (свекровь), {црькы} (церковь), {хорѫгы} (знамя), {ѩтры} (невестка), {любы} (любовь)\"],\n tables:[{cols:[{w:\"боукы\",st:[\"боук\"],suf:[\"ъв\"]}],\n  sg:[[\"боукы\"],[\"боукъве\"],[\"боукъви\"],[\"боукъвь\"],[\"боукъвьѭ\"],[\"боукъве\"]],\n  pl:[[\"боукъви\"],[\"боукъвъ\"],[\"боукъвамъ\"],[\"боукъви\"],[\"боукъвами\"],[\"боукъвахъ\"]],\n  du:null}],\n notes:[\n  {ph:1,t:\"{ы} // {ъв}\",x:\"Как {ы} и {ов} у дифтонгов: перед согласным и на конце — монофтонг {ы}, перед гласным — {ъв}: {боукы — боукъве}.\"},\n  {t:\"Как узнать тип\",x:\"{камы} и {боукы} в И. п. похожи. Род и Р. п. различают: {камене} (м. р., *n), {боукъве} (ж. р., *ū).\"},\n  {t:\"Двойственное\",x:\"На слайде лекции не приведено.\"}],\n ru:[[\"{црькъвь}\",\"_церковь_\",\"форма В. п. стала И. п.\"],[\"{любъвь}\",\"_любовь_\",\"то же\"],[\"{свекръвь}\",\"_свекровь_\",\"то же\"]],\n refs:\"Ив. §50, с. 125 · Р. с. 192 · К. с. 79\"}\n];\nconst SLIDE={\n a:{title:\"1. Склонение существительных с основой на *ā\",html:`<p>Этот тип склонения являлся одним из наиболее продуктивных. К нему относились главным образом существительные <b>женского рода<\/b> и небольшое число существительных <b>мужского рода<\/b>, оканчивавшиеся в И. п. ед. ч.:<\/p><ol><li>на {-а, -ꙗ} ({вода, жена, волꙗ, юноша, воевода});<\/li><li>существительные ж. р. с суффиксом {-ыни} ({милостыни, богыни, рабыни});<\/li><li>существительные ж. и м. р. с суффиксом {-ии} ({млъни, судии});<\/li><li>существительные м. р. с суффиксом {-чии} ({кръмчии, корабьчии, кънигъчии}).<\/li><\/ol><p>В зависимости от конечного согласного основы различались два варианта склонения — <b>твёрдый и мягкий<\/b> (к мягкому относились некоторые существительные первой группы и все существительные второй, третьей и четвёртой групп).<\/p>`},\n o:{title:\"2. Склонение существительных с основой на *ŏ\",html:`<p>К этому типу относились существительные <b>мужского и среднего рода<\/b>. Как и в склонении на *ā, различались два варианта — твёрдый и мягкий.<\/p><p>М. р. в И. п. ед. ч.: {-ъ} (твёрдый вариант), {-ь} или {-и} (< ^*jь^) (мягкий): {рабъ, врагъ} — {плачь, вождь, краи, бои}.<\/p><p>Ср. р. в И. п. ед. ч.: {-о} (твёрдый) или {-е} (мягкий): {село, вино} — {полѥ, камениѥ}.<\/p>`},\n u:{title:\"3. Склонение существительных с основой на *ŭ\",html:`<p>По этому типу склонялась немногочисленная группа слов <b>мужского рода<\/b>: {сынъ, волъ, домъ, врьхъ, медъ, полъ, садъ, санъ, чинъ, ледъ, рѧдъ, грѣхъ, ꙗдъ, даръ} и некоторые другие.<\/p>`},\n i:{title:\"4. Склонение существительных с основой на *ĭ\",html:`<p>К этому типу относились существительные <b>женского рода<\/b> и немногочисленные существительные <b>мужского рода<\/b>, которые в И. п. ед. ч. имели окончание {-ь}: {дань, кость, казнь, ношть, рѣчь} (ж. р.) — {гвоздь, грътань, гость, зѧть, пѫть, тать, тьсть} (м. р.).<\/p><p>Основа существительных ж. р. могла оканчиваться на полумягкий или мягкий согласный, основа слов м. р. — только на полумягкий.<\/p>`},\n c:{title:\"5. Склонение существительных с основой на согласный (*n, *r, *s, *nt)\",html:`<p>К этому типу относились слова <b>мужского, женского и среднего рода<\/b>.<\/p><p><b>а) м. р. на *n:<\/b> {дьнь, корень, ремень, степень, ѥлень, камы} (камень), {пламы} (пламень). Первоначально в И. п. ед. ч. они имели окончание {-ы}. Кроме того, по этому типу изменялись во мн. ч. существительные м. р. с суффиксами {-арь, -тель, -инъ}: {оучитель, житель, рыбарь, мытарь, гражданинъ}. У слов на {-инъ} во мн. ч. суффикс утрачивался: {гражданинъ — граждане}.<\/p><p><b>б) на *r:<\/b> только два слова ж. р. — {мати} и {дъшти}. В более раннюю эпоху тип, видимо, включал больше слов. Дв. ч. у этих слов в старославянских текстах не зафиксировано.<\/p><p><b>в) ср. р. на *s, *n, *nt:<\/b> на *s — {слово — словесе, коло — колесе, чюдо — чюдесе}; на *n — {имѧ — имене, писмѧ} (буква) {— писмене, племѧ — племене}; на *nt (названия детёнышей) — {жрѣбѧ — жрѣбѧте, козьлѧ — козьлѧте, осьлѧ — осьлѧте}.<\/p>`},\n y:{title:\"6. Склонение существительных с основой на *ū\",html:`<p>К этому типу относились слова <b>женского рода<\/b> на {-ы} в И. п. ед. ч.: {брады} (топор), {боукы} (буква, письмо), {жрьны} (жернов), {цѣлы} (исцеление), {неплоды} (бесплодная женщина), {свекры} (свекровь), {црькы} (церковь), {хорѫгы} (знамя), {ѩтры} (невестка), {любы} (любовь).<\/p><p>В косвенных падежах чередовался тематический гласный основы: {ы} (< ^*ū^) // {ъв} (< ^*ŭu̯^).<\/p>`}\n};\nconst byType=Object.fromEntries(TYPES.map(t=>[t.id,t]));\n\n/* разбор формы: основа | суффикс основы | окончание */\nfunction splitWord(w,col){\n  let st=\"\"; for(const s of col.st) if(w.startsWith(s)&&s.length>st.length) st=s;\n  if(!st) return `<span>${w}<\/span>`;\n  let rest=w.slice(st.length), sf=\"\";\n  if(col.suf) for(const x of col.suf) if(rest.startsWith(x)){ sf=x; rest=rest.slice(x.length); break; }\n  return `${st}${sf?`<span class=\"sf\">${sf}<\/span>`:\"\"}${rest?`<span class=\"en\">${rest}<\/span>`:\"\"}`;\n}\nfunction cell(v,col){\n  if(v===\"—\") return '<span class=\"alt\">—<\/span>';\n  return v.replace(/[^\\s(),]+/g,w=>splitWord(w,col)).replace(/\\(([^)]*)\\)/g,'<span class=\"alt\">($1)<\/span>');\n}\nfunction tableHTML(t){\n  const head=`<tr><th><\/th>${t.cols.map(c=>`<th class=\"w\">${c.w}${c.v?`<small>${c.v}<\/small>`:\"\"}<\/th>`).join(\"\")}<\/tr>`;\n  const grp=(name,rows,cases)=>rows?`<tr class=\"grp\"><td colspan=\"${t.cols.length+1}\">${name}<\/td><\/tr>`+rows.map((r,i)=>`<tr data-case=\"${cases[i]}\"><td class=\"c\">${cases[i]}<\/td>${r.map((v,k)=>`<td>${cell(v,t.cols[k])}<\/td>`).join(\"\")}<\/tr>`).join(\"\"):\"\";\n  return `<div class=\"tbl\"><table class=\"pd\">${head}${grp(\"Единственное\",t.sg,CASES_SG)}${grp(\"Множественное\",t.pl,CASES_PL)}${grp(\"Двойственное\",t.du,CASES_DU)}<\/table><\/div>`;\n}\nfunction renderTypes(){\n  $(\"#tlist\").innerHTML=TYPES.map(t=>`<li><button data-type=\"${t.id}\" aria-current=\"${S.type===t.id}\"><span class=\"n\">${t.no}.<\/span><span>Склонение имён с основой на ${t.key===\"согласный\"?\"согласный (-en, -es, -ęt, -(t)er)\":t.key}<\/span><span class=\"ex\">${t.ex}<\/span><\/button><\/li>`).join(\"\");\n  $(\"#tstep\").innerHTML=TYPES.map(t=>`<button role=\"tab\" data-type=\"${t.id}\" aria-selected=\"${S.type===t.id}\">${t.no} · ${t.key===\"согласный\"?\"согласный\":t.key}<\/button>`).join(\"\");\n}\nfunction renderKey(){\n  const K=[[\"а\",\"града\",\"*ŏ\",\"o\"],[\"ы / ѩ\",\"рыбы\",\"*ā\",\"a\"],[\"оу\",\"сыноу\",\"*ŭ\",\"u\"],[\"и\",\"кости\",\"*ĭ\",\"i\"],[\"е\",\"камене\",\"согл.\",\"c\"],[\"ъве\",\"боукъве\",\"*ū\",\"y\"]];\n  $(\"#key\").innerHTML=`<h4>Подсказка: как определить тип по родительному падежу<\/h4><div class=\"keyrow\">${K.map(k=>`<button data-type=\"${k[3]}\"><span class=\"e\">-${k[0]}<\/span><span class=\"w\">${k[1]}<\/span><span class=\"t\">${k[2]}<\/span><\/button>`).join(\"\")}<\/div>\n  <p class=\"keynote\">И. п. часто обманывает: {сынъ} = {градъ}, {кость} = {конь}, {камы} ≈ {боукы}, {слово} = {село}. Родительный и род различают всегда.<\/p>`.replace(/\\{([^}]+)\\}/g,'<span class=\"ocs\">$1<\/span>');\n}\nfunction renderPara(){\n  const t=byType[S.type], sl=SLIDE[t.id], k=TYPES.indexOf(t), prev=TYPES[k-1], next=TYPES[k+1];\n  $(\"#para\").innerHTML=`<div class=\"para\" id=\"paraBox\">\n   <h3>${sl.title}<\/h3>\n   <div class=\"slide\">${fmt(sl.html)}<\/div>\n   <div class=\"legend\"><span><span class=\"ocs\">рыб<\/span> — основа<\/span><span><span class=\"ocs\" style=\"color:var(--umbra)\">ен<\/span> — суффикс основы<\/span><span><span class=\"ocs\" style=\"color:var(--kinovar)\">ами<\/span> — окончание<\/span><\/div>\n   ${t.tables.map(tb=>(tb.sub?`<div class=\"sub\">${tb.sub}<\/div>`:\"\")+tableHTML(tb)).join(\"\")}\n   <div class=\"block-h\">Пояснения<\/div>\n   <div class=\"notes\">${t.notes.map(n=>`<div class=\"note ${n.ph?\"ph\":\"\"}\"><b class=\"t\">${fmt(n.t)}<\/b>${fmt(n.x)}<\/div>`).join(\"\")}<\/div>\n   <div class=\"block-h\">Сравнение с русским<\/div>\n   <table class=\"cmp\"><tr><th>Старославянский<\/th><th>Русский<\/th><th>Почему<\/th><\/tr>${t.ru.map(r=>`<tr><td>${fmt(r[0])}<\/td><td>${fmt(r[1])}<\/td><td>${fmt(r[2])}<\/td><\/tr>`).join(\"\")}<\/table>\n   <p class=\"refs\">Где читать: ${t.refs.split(\" · \").map(x=>`<span class=\"src\">${x}<\/span>`).join(\"\")}<\/p>\n   <div class=\"para-nav\">${prev?`<button data-type=\"${prev.id}\" data-scroll=\"1\"><small>← Тип ${prev.no}<\/small>${SLIDE[prev.id].title.replace(/^\\d\\. /,\"\")}<\/button>`:\"<span><\/span>\"}${next?`<button class=\"nx\" data-type=\"${next.id}\" data-scroll=\"1\"><small>Тип ${next.no} →<\/small>${SLIDE[next.id].title.replace(/^\\d\\. /,\"\")}<\/button>`:`<button class=\"nx\" data-gotab=\"pf\"><small>Дальше →<\/small>Праформы<\/button>`}<\/div><\/div>`;\n}\ndocument.addEventListener(\"click\",e=>{\n  const b=e.target.closest(\"[data-type]\"); if(!b) return;\n  S.type=b.dataset.type; save(); renderTypes(); renderPara();\n  if(b.closest(\"#key\")||b.closest(\"#tlist\")||b.dataset.scroll){ const y=$(\"#tstep\").getBoundingClientRect().top+window.scrollY-60; window.scrollTo({top:y,behavior:\"smooth\"}); }\n});\n\n/* ================= ПРАФОРМЫ ================= */\nconst PF={\n a:{t:\"на *ā\",h:[\"*ā\",\"*jā\",\"ā\",\"jā\"],\n  rows:[[\"И.\",\"sestrā\",\"kapjā\",\"сестра\",\"каплꙗ\",\"nom\"],[\"Р.\",\"sestrăns\",\"kapjăns\",\"сестры\",\"каплѩ\",\"ans\"],[\"Д.\",\"sestrăi̯\",\"kapjăi̯\",\"сестрѣ\",\"капл’и\",\"ai\"],[\"В.\",\"sestrān\",\"kapjān\",\"сестрѫ\",\"каплѭ\",\"an\"],[\"Т.\",\"sestrăjān\",\"kapjăjān\",\"сестроѭ\",\"каплеѭ\",\"ajan\"],[\"М.\",\"sestrai̯\",\"kapjai̯\",\"сестрѣ\",\"капл’и\",\"ai\"],[\"Зв.\",\"sestrə\",\"kapjə\",\"сестро\",\"капле\",\"voc\"],\n   \"Множественное\",[\"И.\",\"sestrăns\",\"kapjăns\",\"сестры\",\"каплѩ\",\"ans\"],[\"Р.\",\"sestrəōn\",\"kapjəōn\",\"сестръ\",\"капл’ь\",\"on\"],[\"Д.\",\"sestrāmŭ\",\"kapjāmŭ\",\"сестрамъ\",\"каплꙗмъ\",\"mu\"],[\"В.\",\"sestrăns\",\"kapjăns\",\"сестры\",\"каплѩ\",\"ans\"],[\"Т.\",\"sestrāmi\",\"kapjāmi\",\"сестрами\",\"каплꙗми\",\"mi\"],[\"М.\",\"sestrāsŭ\",\"kapjāsŭ\",\"сестрахъ\",\"каплꙗхъ\",\"su\"],\n   \"Двойственное\",[\"И.-В.\",\"sestrăi̯\",\"kapjăi̯\",\"сестрѣ\",\"капл’и\",\"ai\"],[\"Р.-М.\",\"sestrău̯\",\"kapjău̯\",\"сестроу\",\"каплю\",\"au\"],[\"Д.-Т.\",\"sestrăma\",\"kapjăma\",\"сестрама\",\"каплꙗма\",\"ma\"]]},\n o:{t:\"на *ŏ\",h:[\"*ŏ\",\"*jŏ\",\"ŏ\",\"jŏ\"],\n  rows:[[\"И.\",\"dedŏs\",\"konjŏs\",\"дѣдъ\",\"кон’ь\",\"os\"],[\"Р.\",\"dedōd\",\"konjōd\",\"дѣда\",\"конꙗ\",\"od\"],[\"Д.\",\"dedŏu̯\",\"konjŏu̯\",\"дѣдоу\",\"коню\",\"au\"],[\"В.\",\"dedŏm\",\"konjŏm\",\"дѣдъ\",\"кон’ь\",\"os\"],[\"Т.\",\"dedŏmĭ\",\"konjŏmĭ\",\"дѣдомь\",\"конемь\",\"mi1\"],[\"М.\",\"dedŏi̯\",\"konjŏi̯\",\"дѣдѣ\",\"кон’и\",\"oi\"],[\"Зв.\",\"dedě\",\"kon’u\",\"дѣде\",\"коню\",\"voc2\"],\n   \"Множественное\",[\"И.\",\"dedŏi̯\",\"konjŏi̯\",\"дѣди\",\"кон’и\",\"oi2\"],[\"Р.\",\"dedōn\",\"konjōn\",\"дѣдъ\",\"кон’ь\",\"on\"],[\"Д.\",\"dedŏmŭs\",\"konjŏmŭs\",\"дѣдомъ\",\"конемъ\",\"mu\"],[\"В.\",\"dedŏns\",\"konjŏns\",\"дѣды\",\"конѩ\",\"ons\"],[\"Т.\",\"dedŏi̯s\",\"konjŏi̯s\",\"дѣды\",\"кон’и\",\"ois\"],[\"М.\",\"dedŏi̯sŭ\",\"konjŏi̯sŭ\",\"дѣдѣхъ\",\"кон’ихъ\",\"su2\"],\n   \"Двойственное\",[\"И.-В.\",\"dedō\",\"konjō\",\"дѣда\",\"конꙗ\",\"o2\"],[\"Р.-М.\",\"dedŏu̯\",\"konjŏu̯\",\"дѣдоу\",\"коню\",\"au\"],[\"Д.-Т.\",\"dedŏma\",\"konjŏma\",\"дѣдома\",\"конема\",\"ma\"]]},\n i:{t:\"на *ĭ\",h:[\"м. р.\",\"ж. р.\",\"м. р.\",\"ж. р.\"],\n  rows:[[\"И.\",\"gostĭs\",\"kostĭs\",\"гость\",\"кость\",\"is\"],[\"Р.\",\"gostei̯s\",\"kostei̯s\",\"гости\",\"кости\",\"ei\"],[\"Д.\",\"gostei\",\"kostei\",\"гости\",\"кости\",\"ei\"],[\"В.\",\"gostĭm\",\"kostĭm\",\"гость\",\"кость\",\"is\"],[\"Т.\",\"gostĭmĭ\",\"kostĭjān\",\"гостьмь\",\"костиѭ\",\"ti\"],[\"М.\",\"gostei̯\",\"kostei̯\",\"гости\",\"кости\",\"ei\"],[\"Зв.\",\"gostei̯\",\"kostei̯\",\"гости\",\"кости\",\"ei\"],\n   \"Множественное\",[\"И.\",\"gostei̯es\",\"kostis\",\"гостиѥ\",\"кости\",\"ies\"],[\"Р.\",\"gostei̯ōn\",\"kostei̯ōn\",\"гостии\",\"костии\",\"ion\"],[\"Д.\",\"gostĭmŭs\",\"kostĭmŭs\",\"гостьмъ\",\"костьмъ\",\"mu\"],[\"В.\",\"gostĭns\",\"kostĭns\",\"гости\",\"кости\",\"ins\"],[\"Т.\",\"gostĭmi\",\"kostimi\",\"гостьми\",\"костьми\",\"mi\"],[\"М.\",\"gostĭsŭ\",\"kostisŭ\",\"гостьхъ\",\"костьхъ\",\"su\"],\n   \"Двойственное\",[\"И.-В.\",\"gostī\",\"kostī\",\"гости\",\"кости\",\"ii\"],[\"Р.-М.\",\"gostei̯u\",\"kostei̯u\",\"гостию\",\"костию\",\"eiu\"],[\"Д.-Т.\",\"gostĭma\",\"kostĭma\",\"гостьма\",\"костьма\",\"ma\"]]}\n};\n/* пояснения к строкам (короткие, по законам из «Фонетики») */\nconst WHY={\n nom:\"Долгий ^ā^ > {а}: количество → качество. После j — {ꙗ} (j + а).\",\n ans:\"Окончание ^*-ans^ на конце слова дало {ы}; после мягкого согласного вместо ы пишется {ѩ}/{ѧ} — сингармонизм: {сестры — каплѩ}.\",\n ai:\"Дифтонг ^ai̯^ на конце > {ѣ}; после j — {и}: {сестрѣ — капл’и}.\",\n an:\"^an^ в закрытом слоге (на конце) > носовой {ѫ}; после j — {ѭ}.\",\n ajan:\"^-ăjān^ > {-оѭ}: ă > о, ^jān^ > {ѭ} (an > ѫ, после j — ѭ). После мягкого о > е: {каплеѭ}.\",\n voc:\"^ə^ > {о}; после мягкого {о} > {е}: {сестро — капле}.\",\n on:\"^-ōn^ > {ъ}: конечный n утрачен (закон открытого слога). После мягкого — {ь}: {капл’ь}.\",\n mu:\"^-mŭ(s)^ > {-мъ}: ŭ > ъ, конечный s утрачен.\",\n mi:\"^-mi^ > {-ми} без изменений.\",\n su:\"^-sŭ^ > {-хъ}: s > х закономерно после i̯, u, r, k ({-ѣхъ, -ихъ}); в {-ахъ} — по аналогии.\",\n su2:\"^oi̯^ перед согласным > {ѣ}, s после i̯ > {х}: ^-oi̯sŭ^ > {-ѣхъ}; после j — {-ихъ}.\",\n os:\"^ŏ^ перед конечными s, m > ^u^ > {ъ}, согласный утрачен: ^*dedŏs > *dedus^ > {дѣдъ}. После j — {ь}: {кон’ь}.\",\n od:\"Долгий ^ō^ > {а}, конечный d утрачен: {дѣда}. После j — {ꙗ}.\",\n au:\"Дифтонг ^ou̯^/^au̯^ > {оу}; после j — {ю}: {дѣдоу — коню}.\",\n mi1:\"^-ŏmĭ^ > {-омь}: ĭ > ь. После j о > е: {конемь}.\",\n oi:\"^oi̯^ > {ѣ} (М. п.); после j — {и}: {дѣдѣ — кон’и}. Перед этим ѣ — вторая палатализация: {враѕѣ}.\",\n oi2:\"Тот же ^oi̯^ в И. мн. дал {и} (нисходящая интонация): {дѣди}. Отсюда {враѕи, дуси}.\",\n voc2:\"^ě^ > {е}: {дѣде}; у мягких — {ю}: {коню}. Перед этим е — первая палатализация: {враже}.\",\n ons:\"^-ons^ > {ы}; после j — {ѩ}/{ѧ}: {дѣды — конѩ}.\",\n ois:\"^-oi̯s^ > {ы} (Т. мн.); после j — {и}.\",\n o2:\"Долгий ^ō^ > {а}: И.-В. дв. ч. {дѣда} совпал с Р. ед.\",\n ma:\"^-ma^ > {-ма}: окончание дв. ч. без изменений.\",\n is:\"^-ĭs^, ^-ĭm^ > {ь}: конечный согласный утрачен, ĭ > ь.\",\n ei:\"Дифтонг ^ei̯^ > {и}: отсюда одинаковые {гости} в Р., Д., М., Зв. ед.\",\n ti:\"М. р. ^-ĭmĭ^ > {-ьмь}, ж. р. ^-ĭjān^ > {-иѭ}: род различает формы.\",\n ies:\"М. р. ^-ei̯es^ > {-иѥ}: ei̯ перед гласным > ij. Ж. р. ^-is^ > {-и}.\",\n ion:\"^-ei̯ōn^ > {-ии}: ei̯ перед гласным > ij, ^-ōn^ после j > {ь}/{и}.\",\n ins:\"^-ĭns^ > {и}.\",\n ii:\"Долгий ^ī^ > {и}.\",\n eiu:\"^-ei̯u^ > {-ию}: ei̯ перед гласным > ij, ju > {ю}.\"\n};\nconst LAWS=[\n [\"^ā^ > {а}, ^ō^ > {а}, ^ŏ^ > {о}/{ъ}, ^ĭ^ > {ь}\",\"количество → качество (тема 2)\"],\n [\"^ai̯, oi̯^ > {ѣ}; ^oi̯^ > {и}; ^ei̯^ > {и}; ^ou̯^ > {оу}\",\"монофтонгизация дифтонгов (тема 3)\"],\n [\"^an^ > {ѫ}, ^en^ > {ѧ}\",\"носовые в закрытом слоге (тема 3)\"],\n [\"^-s, -d, -m, -n^ отпадают\",\"закон открытого слога: утрата конечных согласных\"],\n [\"после j: {ъ → ь, о → е, ы → ѧ/ѩ, ѣ → и}\",\"слоговой сингармонизм — мягкий вариант склонения\"],\n [\"{враже}, {враѕѣ}, {враѕи}\",\"первая и вторая палатализации на стыке основы и окончания (тема 4)\"]\n];\nfunction renderPF(){\n  $(\"#pfsel\").innerHTML=Object.entries(PF).map(([k,v])=>`<button class=\"chip\" data-pf=\"${k}\" aria-pressed=\"${S.pf===k}\">Склонение ${v.t}<\/button>`).join(\"\");\n  const p=PF[S.pf];\n  let html=`<table class=\"pf\"><tr><th>Падеж<\/th><th>Праслав. ${p.h[0]}<\/th><th>Праслав. ${p.h[1]}<\/th><th>Ст.-сл. ${p.h[2]}<\/th><th>Ст.-сл. ${p.h[3]}<\/th><\/tr><tr class=\"grp\"><td colspan=\"5\">Единственное<\/td><\/tr>`;\n  let n=0;\n  p.rows.forEach(r=>{\n    if(typeof r===\"string\"){ html+=`<tr class=\"grp\"><td colspan=\"5\">${r}<\/td><\/tr>`; return; }\n    html+=`<tr data-r=\"${n}\" class=\"${S.pfRow===n?\"on\":\"\"}\"><td class=\"c\">${r[0]}<\/td><td class=\"p\">*${r[1]}<\/td><td class=\"p\">*${r[2]}<\/td><td class=\"o\">${r[3]}<\/td><td class=\"o\">${r[4]}<\/td><\/tr>`; n++;\n  });\n  $(\"#pftbl\").innerHTML=html+\"<\/table>\";\n  const rows=p.rows.filter(r=>typeof r!==\"string\");\n  if(S.pfRow!=null && rows[S.pfRow]){ const r=rows[S.pfRow]; $(\"#pfwhy\").innerHTML=`<b>${r[0]}<\/b> <span class=\"rec\">*${r[1]}<\/span> → <span class=\"ocs\">${r[3]}<\/span>, <span class=\"rec\">*${r[2]}<\/span> → <span class=\"ocs\">${r[4]}<\/span>. ${fmt(WHY[r[5]]||\"\")}`; }\n  else $(\"#pfwhy\").textContent=\"Нажми на строку таблицы.\";\n}\n$(\"#pfsel\").addEventListener(\"click\",e=>{ const b=e.target.closest(\"[data-pf]\"); if(b){ S.pf=b.dataset.pf; S.pfRow=null; renderPF(); } });\n$(\"#pftbl\").addEventListener(\"click\",e=>{ const r=e.target.closest(\"tr[data-r]\"); if(r){ S.pfRow=+r.dataset.r; renderPF(); } });\n$(\"#laws\").innerHTML=LAWS.map(l=>`<div class=\"law\"><span class=\"f\">${fmt(l[0])}<\/span><span>${l[1]}<\/span><\/div>`).join(\"\");\n\n/* ================= ЧИСЛО И ПАДЕЖ ================= */\n$(\"#numBody\").innerHTML=fmt(`\n<h3 class=\"h3\">Категория числа<\/h3>\n<div class=\"facts\">\n <div class=\"fact\"><h4>Три числа<\/h4><p>Единственное — <b>двойственное<\/b> — множественное.<\/p><table class=\"nums\"><tr><th>ед. ч.<\/th><th>дв. ч.<\/th><th>мн. ч.<\/th><\/tr><tr><td>{градъ}<\/td><td>{града}<\/td><td>{гради}<\/td><\/tr><tr><td>{рыба}<\/td><td>{рыбѣ}<\/td><td>{рыбы}<\/td><\/tr><tr><td>{сынъ}<\/td><td>{сыны}<\/td><td>{сынове}<\/td><\/tr><tr><td>{слово}<\/td><td>{словесѣ}<\/td><td>{словеса}<\/td><\/tr><\/table><p class=\"muted\" style=\"font-family:var(--font-ui);font-size:13px\">И. п.; формы — из парадигм раздела «Склонение».<\/p><\/div>\n <div class=\"fact\"><h4>Когда двойственное<\/h4><ul><li>два предмета или лица — с числительными {дъва, дъвѣ, оба, обѣ} или без них: {дъва слѣпьца, дъвѣ женѣ, дъва оученика, обѣ рѫцѣ};<\/li><li>парные предметы: {ланитѣ} (щёки), {нозѣ} (ноги), {очи, оуши}, {рѫцѣ} (руки).<\/li><li>дв. ч. согласуется: {идѣта} (идите вдвоём), {вама} (вам двоим) — в глаголах и местоимениях тоже.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"quote\"><div class=\"t\">тогда посъла ·в҃· (дъва) <mark>оученика<\/mark> свои гл҃а <mark>има<\/mark>. <mark>идѣта<\/mark> въ вьсь ꙗже прѣмо <mark>вама<\/mark> и абиѥ <mark>обрѧщета<\/mark> осьлѧ привѧзано… <mark>шьдъша<\/mark> же <mark>оученика<\/mark>. <mark>сътвориста<\/mark> ꙗкоже повелѣ ис҃<\/div>\n<div class=\"tr\">«Тогда послал двух учеников своих, говоря им: пойдите в селение, которое прямо перед вами, и тотчас найдёте ослицу привязанную… Ученики пошли и поступили, как повелел Иисус» (Мф. 21:1–2, 6).<\/div>\n<div class=\"cap\">Саввина книга. Выделены формы двойственного числа — у существительных, местоимений, глаголов и причастий.<\/div><\/div>\n<h3 class=\"h3\">Категория падежа<\/h3>\n<div class=\"casegrid\"><div><b>И.<\/b>именит.<i>{градъ}<\/i><i>{рыба}<\/i><\/div><div><b>Р.<\/b>родит.<i>{града}<\/i><i>{рыбы}<\/i><\/div><div><b>Д.<\/b>дат.<i>{градоу}<\/i><i>{рыбѣ}<\/i><\/div><div><b>В.<\/b>винит.<i>{градъ}<\/i><i>{рыбѫ}<\/i><\/div><div><b>Т.<\/b>творит.<i>{градомь}<\/i><i>{рыбоѭ}<\/i><\/div><div class=\"sp\"><b>М.<\/b>местный<i>{градѣ}<\/i><i>{рыбѣ}<\/i><\/div><div class=\"sp\"><b>Зв.<\/b>зват. форма<i>{граде}<\/i><i>{рыбо}<\/i><\/div><\/div>\n<div class=\"facts\">\n <div class=\"fact\"><h4>Местный без предлога<\/h4><p>В отличие от современного предложного, местный мог употребляться без предлога:<\/p><ul><li>{да не бѫдетъ бѣство ваше зимѣ} — <i>чтобы не случилось бегство ваше зимой<\/i> (Мф. 24:20);<\/li><li>{ꙗко сѫть сохранены кости нашѧ семь мѣстѣ} — <i>что сохранены кости наши в этом месте<\/i>.<\/li><\/ul><p>Ср. в одном слове: {зимѣ} = _зимой_; {мѣстѣ} = _в месте_. С предлогом местный тоже употреблялся: {въ градѣ, на рѫцѣ}.<\/p><\/div>\n <div class=\"fact\"><h4>Звательная форма<\/h4><p>Только от существительных <b>м. и ж. р.<\/b> и только в <b>ед. ч.<\/b>: {владыко, дѣвице, оучителю, сыноу, господи}.<\/p><p>Прилагательное при обращении — в форме И. п. или в звательной: {оучителю благыи} (Лк. 18:18) — прилагательное в И. п. при звательном {оучителю}.<\/p><p>Ср. в русском: _Боже! Господи! Отче!_ — остатки звательной формы.<\/p><\/div>\n<\/div>\n<div class=\"block-h\">Звательная форма по типам<\/div>\n<table class=\"cmp\"><tr><th>Тип<\/th><th>Звательная<\/th><th>Пример<\/th><\/tr>\n<tr><td>*ā<\/td><td>{-о}, мягк. {-е}<\/td><td>{рыбо, владыко; земле, дѣвице}<\/td><\/tr>\n<tr><td>*ŏ<\/td><td>{-е}, мягк. {-ю}<\/td><td>{граде, враже; ножю, оучителю}<\/td><\/tr>\n<tr><td>*ŭ<\/td><td>{-оу}<\/td><td>{сыноу}<\/td><\/tr>\n<tr><td>*ĭ<\/td><td>{-и}<\/td><td>{дани, пѫти, господи}<\/td><\/tr><\/table>\n<p class=\"refs\">Где читать: <span class=\"src\">Ив. §41, с. 113; §43, с. 114<\/span><span class=\"src\">Р. §106, с. 171; §108, с. 175<\/span><span class=\"src\">К. §37, с. 74–75<\/span><\/p>`);\n\n/* ================= СЛОВООБРАЗОВАНИЕ ================= */\nconst WF=[\n {h:\"1. Названия лиц\",rows:[\n  [\"-ьць\",\"от глаголов и прилагательных\",[[\"лов\",\"ьць\"],[\"льст\",\"ьць\"],[\"твор\",\"ьць\"],[\"слѣп\",\"ьць\"],[\"стар\",\"ьць\"],[\"чрьн\",\"ьць\",\"монах\"]]],\n  [\"-тель\",\"от глагольных основ: деятель по роду деятельности\",[[\"жѧ\",\"тель\",\"жнец\"],[\"крьсти\",\"тель\"],[\"съвѣдѣ\",\"тель\",\"свидетель\"],[\"оучи\",\"тель\"]]],\n  [\"-икъ, -ьникъ (ж. р. -ица, -ьница)\",\"от прилагательных и страд. причастий: лицо по свойству, черте характера\",[[\"грѣш\",\"ьникъ\"],[\"длъж\",\"ьникъ\"],[\"къниж\",\"ьникъ\"],[\"мѫчен\",\"икъ\"],[\"грѣш\",\"ьница\"],[\"поуштен\",\"ица\",\"разведённая жена\"]]],\n  [\"-арь, -атаи, -чии\",\"от существительных: лицо по роду занятий\",[[\"врат\",\"арь\"],[\"мыт\",\"арь\",\"сборщик пошлин\"],[\"рыб\",\"арь\"],[\"ход\",\"атаи\",\"заступник\"],[\"кръмъ\",\"чии\",\"кормчий\"],[\"кънигъ\",\"чии\",\"книжник\"]]],\n  [\" =>v!==\"—\"&&v!==ans))];\n  const wrong=shuffle(pool).filter(v=>!v.split(/[ ,()]+/).includes(ans.split(\" \")[0])).slice(0,3);\n  const caseName={\"И.\":\"И. п.\",\"Р.\":\"Р. п.\",\"Д.\":\"Д. п.\",\"В.\":\"В. п.\",\"Т.\":\"Т. п.\",\"М.\":\"М. п.\",\"Зв.\":\"звательная форма\",\"И.-В.\":\"И.-В.\",\"Р.-М.\":\"Р.-М.\",\"Д.-Т.\":\"Д.-Т.\"}[cs[ri]];\n  const same=rows.map((r,i)=>r[k]===ans?cs[i]:null).filter(Boolean);\n  return {q:`Поставь {${tb.cols[k].w}} в форму: ${caseName} ${nn}`,o:[ans,...wrong],a:0,e:`Тип ${t.no} (${t.key}). ${same.length>1?`Та же форма — в падежах: ${same.join(\", \")}.`:\"\"}`,ty:t.id,form:1};\n}\nlet cur=null;\nfunction nextTask(){\n  if(S.mode===\"f\") cur=formTask();\n  else{ const left=Q.map((x,i)=>i).filter(i=>!S.qDone.includes(i)); const pool=left.length?left:Q.map((x,i)=>i); const i=pool[Math.floor(Math.random()*pool.length)]; cur={...Q[i],idx:i}; }\n  renderTask();\n}\nfunction renderTask(){\n  const order=shuffle(cur.o.map((o,i)=>i));\n  $(\"#drillBox\").innerHTML=`<div class=\"task\"><div class=\"tag\">${S.mode===\"f\"?\"Форма слова\":\"Вопрос \"+(cur.idx+1)+\" из \"+Q.length}<\/div><p class=\"tq\">${fmt(cur.q)}<\/p><div class=\"opts\">${order.map(i=>`<button class=\"opt\" data-o=\"${i}\">${fmt(cur.o[i])}<\/button>`).join(\"\")}<\/div><div class=\"fbw\"><\/div><\/div>`;\n  $(\"#score\").textContent=S.total?`Верно ${S.right} из ${S.total}`+(S.mode===\"q\"?` · решено ${S.qDone.length} из ${Q.length}`:\"\"):(S.mode===\"q\"?`Решено ${S.qDone.length} из ${Q.length}`:\"\");\n}\nfunction renderModes(){ $(\"#dmode\").innerHTML=[[\"q\",\"Вопросы\"],[\"f\",\"Форма слова\"]].map(m=>`<button data-m=\"${m[0]}\" aria-pressed=\"${S.mode===m[0]}\">${m[1]}<\/button>`).join(\"\"); }\n$(\"#dmode\").addEventListener(\"click\",e=>{ const b=e.target.closest(\"[data-m]\"); if(b){ S.mode=b.dataset.m; renderModes(); nextTask(); } });\n$(\"#drillBox\").addEventListener(\"click\",e=>{\n  const o=e.target.closest(\".opt\");\n  if(o&&!o.disabled){\n    const ok=+o.dataset.o===cur.a; S.total++; if(ok) S.right++;\n    $$(\".opt\").forEach(b=>{ b.disabled=true; if(+b.dataset.o===cur.a) b.classList.add(\"right\"); else if(b===o) b.classList.add(\"wrong\"); });\n    if(ok&&cur.idx!=null&&!S.qDone.includes(cur.idx)){ S.qDone.push(cur.idx); save(); }\n    const link=cur.ty?` <button class=\"link\" data-gotype=\"${cur.ty}\">Открыть парадигму<\/button>`:cur.pf?` <button class=\"link\" data-gotab=\"pf\">К праформам<\/button>`:\"\";\n    $(\".fbw\").innerHTML=`<div class=\"fb\"><b class=\"${ok?\"ok\":\"no\"}\">${ok?\"Верно.\":\"Неверно.\"}<\/b> ${fmt(cur.e)}${link}<\/div><div class=\"next-row\"><button class=\"btn primary\" id=\"nextT\">Дальше →<\/button>${S.mode===\"q\"&&S.qDone.length?`<button class=\"btn\" id=\"resetQ\">Сбросить прогресс<\/button>`:\"\"}<\/div>`;\n    $(\"#score\").textContent=`Верно ${S.right} из ${S.total}`+(S.mode===\"q\"?` · решено ${S.qDone.length} из ${Q.length}`:\"\");\n    return;\n  }\n  if(e.target.closest(\"#nextT\")){ nextTask(); return; }\n  if(e.target.closest(\"#resetQ\")){ S.qDone=[]; save(); nextTask(); return; }\n  const g=e.target.closest(\"[data-gotype]\"); if(g){ S.type=g.dataset.gotype; save(); renderTypes(); renderPara(); show(\"decl\"); return; }\n  const p=e.target.closest(\"[data-gotab]\"); if(p) show(p.dataset.gotab);\n});\n\n/* ================= ТЕТРАДЬ ================= */\nconst NB=`\n<h4>Словообразование<\/h4>\n<ul><li><b>лица:<\/b> {-ьць} (ловьць), {-тель} (оучитель), {-ьникъ} (грѣшьникъ), {-арь, -атаи, -чии} (мытарь, ходатаи, кръмъчии), {-инъ, -ꙗнинъ} (словѣнинъ), ж. р. {-ица, -ыни} (пророчица, рабыни)<\/li>\n<li><b>предметы:<\/b> орудие {-ло, -то} (рало, сито); место {-иште, -ьница} (сѫдиште, житьница); предмет {-ьникъ, -ьце} (свѣтильникъ, срьдьце)<\/li>\n<li><b>уменьшит.:<\/b> {-ьць, -ьца, -ьце} (градьць, двьрьца, чѧдьце); детёныши {-ьць, -ишть} (агньць, козьлишть)<\/li>\n<li><b>отвлечённые:<\/b> {-ость} (благость), {-ота, -ина, -ыни, -ьда, -оба} (истина, гръдыни, правьда), {-тва}
